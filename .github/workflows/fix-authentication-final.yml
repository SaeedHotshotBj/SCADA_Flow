name: Fix authentication session validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-authentication:
    if: github.actor == 'SaeedHotshotBj'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app.py authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          old = '''def is_logged_in():\n    user_id = session.get("user_id")\n\n    print(\n        "SESSION CHECK:",\n        dict(session)\n    )\n\n    return user_id is not None\n'''

          new = '''def is_logged_in():\n    """Validate that the current session belongs to a real enabled user."""\n\n    user_id = session.get("user_id")\n\n    print(\n        "SESSION CHECK:",\n        dict(session)\n    )\n\n    if user_id is None:\n        return False\n\n    conn = None\n    cursor = None\n\n    try:\n        conn = get_connection()\n        cursor = conn.cursor()\n\n        cursor.execute(\n            """\n            SELECT UserID, Username, CompanyID, Role, Enabled\n            FROM Users\n            WHERE UserID = ?\n            LIMIT 1\n            """,\n            (user_id,)\n        )\n\n        user = cursor.fetchone()\n\n        if not user or not user["Enabled"]:\n            session.clear()\n            session.modified = True\n            return False\n\n        if str(session.get("username", "")).strip() != str(user["Username"]).strip():\n            session.clear()\n            session.modified = True\n            return False\n\n        if str(session.get("role", "")).strip().lower() != str(user["Role"]).strip().lower():\n            session.clear()\n            session.modified = True\n            return False\n\n        session_company = session.get("company_id")\n        db_company = user["CompanyID"]\n\n        if session_company != db_company:\n            try:\n                if session_company is not None and int(session_company) == int(db_company):\n                    pass\n                else:\n                    session.clear()\n                    session.modified = True\n                    return False\n            except (TypeError, ValueError):\n                session.clear()\n                session.modified = True\n                return False\n\n        return True\n\n    except Exception as e:\n        print("SESSION VALIDATION ERROR:", e)\n        session.clear()\n        session.modified = True\n        return False\n\n    finally:\n        if cursor is not None:\n            try:\n                cursor.close()\n            except Exception:\n                pass\n        if conn is not None:\n            try:\n                conn.close()\n            except Exception:\n                pass\n'''

          if old not in s:
              raise SystemExit('Expected authentication block was not found; no changes made.')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit authentication fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix stale authentication sessions"
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-authentication-final.yml
          git commit -m "Remove one-time authentication fix workflow"
          git push
