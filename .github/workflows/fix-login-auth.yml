name: Fix login authentication
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch login route
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    # =================================================\n    # ALREADY LOGGED IN')
          end=s.index('    # =================================================\n    # POST LOGIN', start)
          block='''    # =================================================\n    # GET LOGIN PAGE / EXISTING SESSION\n    # =================================================\n\n    # Existing sessions may redirect only on GET.\n    # POST always validates the submitted credentials.\n    if request.method == "GET":\n\n        if is_logged_in():\n\n            print("ALREADY LOGGED IN:", dict(session))\n\n            if is_master():\n                return redirect(url_for("master_companies"))\n\n            return redirect(url_for("dashboard"))\n\n        companies = _get_companies_for_login()\n\n        return render_template(\n            "login.html",\n            companies=companies\n        )\n\n'''
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-login-auth.yml
          git add app.py .github/workflows/fix-login-auth.yml
          git commit -m 'Fix login authentication bypass'
          git push origin main
