name: Final Trigger Report Repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final trigger-report repair
        run: python scripts/final_trigger_report_fix.py

      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow_engine/nodes/sql_writer.py flow_engine/trigger_edge_report_fix.py services/report_runtime.py scripts/final_trigger_report_fix.py .github/workflows/final-trigger-report-repair.yml
          git commit -m "Fix duplicate trigger report persistence and context"
          git push origin HEAD:main
