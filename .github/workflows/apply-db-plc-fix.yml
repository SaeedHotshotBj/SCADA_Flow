name: Apply SCADA DB PLC fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-db-plc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch database connection and Edge data storage
        shell: python
        run: |
          from pathlib import Path

          db = Path('database.py')
          text = db.read_text(encoding='utf-8')

          old_connect = '''    conn = sqlite3.connect(\n        db_path,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''
          new_connect = '''    conn = sqlite3.connect(\n        db_path,\n        timeout=30,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''
          if old_connect not in text:
              raise SystemExit('database.py: expected sqlite3.connect block not found')
          text = text.replace(old_connect, new_connect, 1)

          old_fk = '''    conn.execute(\n        "PRAGMA foreign_keys = ON"\n    )\n\n    conn.execute(\n        "PRAGMA journal_mode = WAL"\n    )'''
          new_fk = '''    conn.execute(\n        "PRAGMA foreign_keys = ON"\n    )\n\n    conn.execute(\n        "PRAGMA busy_timeout = 10000"\n    )\n\n    conn.execute(\n        "PRAGMA journal_mode = WAL"\n    )'''
          if old_fk not in text:
              raise SystemExit('database.py: expected PRAGMA block not found')
          text = text.replace(old_fk, new_fk, 1)
          db.write_text(text, encoding='utf-8')

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          old_sql = '''            INSERT INTO PLC_Data\n            (\n                CompanyID,\n                TagName,\n                Value,\n                StorageType,\n                Timestamp\n            )\n            VALUES\n            (?, ?, ?, ?, COALESCE(?, datetime('now', 'localtime')))\n            """,\n            (\n                company_id,\n                tag,\n                value,\n                "EDGE",\n                timestamp\n            )'''

          new_sql = '''            INSERT INTO PLC_Data\n            (\n                CompanyID,\n                PLC_ID,\n                TagName,\n                Value,\n                StorageType,\n                Timestamp\n            )\n            VALUES\n            (?, ?, ?, ?, ?, COALESCE(?, datetime('now', 'localtime')))\n            """,\n            (\n                company_id,\n                plc_id,\n                tag,\n                value,\n                "EDGE",\n                timestamp\n            )'''

          if old_sql not in text:
              raise SystemExit('app.py: expected /api/data PLC_Data insert block not found')
          text = text.replace(old_sql, new_sql, 1)
          app.write_text(text, encoding='utf-8')

          print('Patched database.py and app.py')

      - name: Verify Edge Timeout service was not modified
        shell: bash
        run: |
          if git diff --quiet -- services/edge_timeout_service.py; then
            echo 'Edge Timeout service unchanged.'
          else
            echo 'ERROR: edge_timeout_service.py changed.'
            git diff -- services/edge_timeout_service.py
            exit 1
          fi

      - name: Commit changes and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-db-plc-fix.yml
          git add app.py database.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix PLC-aware edge data storage and SQLite locking'
          git push origin main
