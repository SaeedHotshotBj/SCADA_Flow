name: Apply SCADA DB PLC fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-db-plc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch database connection and Edge data storage
        shell: python
        run: |
          from pathlib import Path
          import re

          db = Path('database.py')
          text = db.read_text(encoding='utf-8')

          old_connect = '''    conn = sqlite3.connect(\n        db_path,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''

          new_connect = '''    conn = sqlite3.connect(\n        db_path,\n        timeout=30,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''

          if old_connect not in text:
              raise SystemExit('database.py: expected sqlite3.connect block not found')
          text = text.replace(old_connect, new_connect, 1)

          old_fk = '''    conn.execute(\n        "PRAGMA foreign_keys = ON"\n    )\n\n    conn.execute(\n        "PRAGMA journal_mode = WAL"\n    )'''

          new_fk = '''    conn.execute(\n        "PRAGMA foreign_keys = ON"\n    )\n\n    conn.execute(\n        "PRAGMA busy_timeout = 10000"\n    )\n\n    conn.execute(\n        "PRAGMA journal_mode = WAL"\n    )'''

          if old_fk not in text:
              raise SystemExit('database.py: expected PRAGMA block not found')
          text = text.replace(old_fk, new_fk, 1)
          db.write_text(text, encoding='utf-8')

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          start = text.find('# =====================================================\n# EDGE DATA RECEIVER')
          if start < 0:
              raise SystemExit('app.py: EDGE DATA RECEIVER section not found')
          next_section = text.find('\n# =====================================================', start + 20)
          if next_section < 0:
              next_section = len(text)
          section = text[start:next_section]

          pattern = re.compile(
              r'INSERT INTO PLC_Data\s*\(\s*'
              r'CompanyID\s*,\s*TagName\s*,\s*Value\s*,\s*StorageType\s*,\s*Timestamp\s*\)\s*'
              r'VALUES\s*\(\s*\?,\s*\?,\s*\?,\s*\?,\s*COALESCE',
              re.S,
          )

          replacement = '''INSERT INTO PLC_Data\n            (\n                CompanyID,\n                PLC_ID,\n                TagName,\n                Value,\n                StorageType,\n                Timestamp\n            )\n            VALUES (?, ?, ?, ?, ?, COALESCE'''

          section, count = pattern.subn(replacement, section, count=1)
          if count != 1:
              raise SystemExit('app.py: expected PLC_Data INSERT statement not found')

          param_old = '(company_id, tag, value, storage_type, timestamp)'
          param_new = '(company_id, plc_id, tag, value, storage_type, timestamp)'
          if param_old not in section:
              raise SystemExit('app.py: expected PLC_Data parameter tuple not found')
          section = section.replace(param_old, param_new, 1)

          text = text[:start] + section + text[next_section:]
          app.write_text(text, encoding='utf-8')

          print('Patched database.py and app.py')

      - name: Verify Edge Timeout code was not modified
        shell: bash
        run: |
          if ! git diff -- services/edge_timeout_service.py | grep -q '^'; then
            echo 'Edge Timeout service unchanged.'
          else
            echo 'ERROR: edge_timeout_service.py changed.'
            git diff -- services/edge_timeout_service.py
            exit 1
          fi

      - name: Commit and remove this temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-db-plc-fix.yml
          git add app.py database.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix PLC-aware edge data storage and SQLite locking'
          git push origin main
