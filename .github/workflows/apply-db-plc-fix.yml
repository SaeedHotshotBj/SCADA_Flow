name: Apply SCADA DB PLC fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-db-plc-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact server-side fixes
        shell: python
        run: |
          from pathlib import Path

          db = Path('database.py')
          text = db.read_text(encoding='utf-8')

          needle = '''    conn = sqlite3.connect(\n        db_path,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''
          replacement = '''    conn = sqlite3.connect(\n        db_path,\n        timeout=30,\n        detect_types=(\n            sqlite3.PARSE_DECLTYPES |\n            sqlite3.PARSE_COLNAMES\n        ),\n        check_same_thread=False,\n    )'''
          if needle in text:
              text = text.replace(needle, replacement, 1)
          elif 'timeout=30,' not in text:
              raise SystemExit('database.py: sqlite connection block not found')

          busy = '''    conn.execute(\n        "PRAGMA busy_timeout = 10000"\n    )'''
          if busy not in text:
              marker = '''    conn.execute(\n        "PRAGMA foreign_keys = ON"\n    )'''
              if marker not in text:
                  raise SystemExit('database.py: foreign_keys marker not found')
              text = text.replace(marker, marker + '\n\n' + busy, 1)

          db.write_text(text, encoding='utf-8')

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          old = '''            INSERT INTO PLC_Data\n            (\n                CompanyID,\n                TagName,\n                Value,\n                StorageType,\n                Timestamp\n            )\n            VALUES\n            (?, ?, ?, ?, COALESCE(?, datetime('now', 'localtime')))\n            """,\n            (\n                company_id,\n                tag,\n                value,\n                "EDGE",\n                timestamp\n            )'''

          new = '''            INSERT INTO PLC_Data\n            (\n                CompanyID,\n                PLC_ID,\n                TagName,\n                Value,\n                StorageType,\n                Timestamp\n            )\n            VALUES\n            (?, ?, ?, ?, ?, COALESCE(?, datetime('now', 'localtime')))\n            """,\n            (\n                company_id,\n                plc_id,\n                tag,\n                value,\n                "EDGE",\n                timestamp\n            )'''

          if old in text:
              text = text.replace(old, new, 1)
          elif '                CompanyID,\n                PLC_ID,\n                TagName,' not in text:
              raise SystemExit('app.py: PLC_Data insert block not found')

          app.write_text(text, encoding='utf-8')
          print('Server fixes applied.')

      - name: Verify only intended files changed
        shell: bash
        run: |
          if ! git diff --quiet -- services/edge_timeout_service.py; then
            echo 'ERROR: Edge Timeout service changed.'
            git diff -- services/edge_timeout_service.py
            exit 1
          fi
          git diff --check
          grep -A8 'sqlite3.connect' database.py | head -n 12
          grep -A18 'INSERT INTO PLC_Data' app.py | head -n 22

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-db-plc-fix.yml
          git add app.py database.py
          git diff --cached --quiet && exit 1
          git commit -m 'Fix PLC-aware edge data storage and SQLite locking'
          git push origin main
