          # ---------------- TRIGGER SIGNAL INTERCEPTOR ----------------
          (ROOT / 'services/trigger_signal_interceptor.py').write_text(textwrap.dedent(r'''
          import json
          import math
          import uuid
          from datetime import datetime
          from flask import request, jsonify
          from database import get_connection, get_company_flow
          from services.edge_ingest import ensure_edge_event_schema, ingest_items

          PREFIX="__TRIGGER_REGISTER_"

          def _ts(value):
              text=str(value or datetime.now().strftime("%Y-%m-%d %H:%M:%S.%f")).strip().replace("T"," ")
              try:
                  dt=datetime.fromisoformat(text.replace("Z","+00:00"))
                  if dt.tzinfo is not None:
                      from zoneinfo import ZoneInfo
                      dt=dt.astimezone(ZoneInfo("Asia/Tehran")).replace(tzinfo=None)
                  return dt.strftime("%Y-%m-%d %H:%M:%S.%f").rstrip("0").rstrip(".")
              except Exception: return text

          def _allowed_registers(company_id):
              flow=get_company_flow(company_id)
              if isinstance(flow,str):
                  try: flow=json.loads(flow)
                  except Exception: flow={}
              nodes=(flow or {}).get("drawflow",{}).get("Home",{}).get("data",{}) or {}
              result=set()
              for node in nodes.values():
                  if not isinstance(node,dict) or node.get("name")!="TagMapper": continue
                  for item in (node.get("data",{}) or {}).get("mappings",[]) or []:
                      if not isinstance(item,dict) or str(item.get("storage","TIME")).upper()!="TRIGGER": continue
                      try: result.add(int(item.get("trigger_register")))
                      except (TypeError,ValueError): pass
              return result

          def _store_trigger_items(items):
              ensure_edge_event_schema(); acks=[]; errors=[]; conn=get_connection()
              try:
                  conn.execute("BEGIN IMMEDIATE")
                  for item in items:
                      event_id=str(item.get("EventID","")).strip(); tag=str(item.get("TagName","")).strip()
                      try: register=int(tag[len(PREFIX):]) if tag.startswith(PREFIX) else None
                      except Exception: register=None
                      if not event_id or register is None or register not in _allowed_registers_for_item(item,conn):
                          errors.append({"EventID":event_id,"Error":"Invalid Flow trigger signal"}); continue
                      try:
                          plc_id=int(item.get("PLC_ID")); value=float(item.get("Value")); timestamp=_ts(item.get("Timestamp"))
                          if not math.isfinite(value): raise ValueError("Value must be finite")
                      except Exception as exc:
                          errors.append({"EventID":event_id,"Error":str(exc)}); continue
                      existing=conn.execute("SELECT ID FROM PLC_Data WHERE EventID=? LIMIT 1",(event_id,)).fetchone()
                      if existing is not None: acks.append(event_id); continue
                      plc=conn.execute("SELECT CompanyID FROM PLCs WHERE PLC_ID=?",(plc_id,)).fetchone()
                      if plc is None or register not in _allowed_registers_for_company(int(plc["CompanyID"])):
                          errors.append({"EventID":event_id,"Error":"PLC/Flow trigger mismatch"}); continue
                      conn.execute("INSERT INTO PLC_Data(CompanyID,PLC_ID,TagName,Value,StorageType,Timestamp,EventID) VALUES(?,?,?,?,?,?,?)",(int(plc["CompanyID"]),plc_id,tag,value,"TRIGGER_SIGNAL",timestamp,event_id))
                      conn.execute("INSERT OR IGNORE INTO TagHistory(CompanyID,PLC_ID,TagName,Value,Timestamp,EventID) VALUES(?,?,?,?,?,?)",(int(plc["CompanyID"]),plc_id,tag,value,timestamp,event_id))
                      acks.append(event_id)
                  conn.commit()
              except Exception:
                  conn.rollback(); raise
              finally: conn.close()
              return acks,errors

          def _allowed_registers_for_company(company_id): return _allowed_registers(company_id)
          def _allowed_registers_for_item(item,conn):
              try:
                  plc_id=int(item.get("PLC_ID")); row=conn.execute("SELECT CompanyID FROM PLCs WHERE PLC_ID=?",(plc_id,)).fetchone(); return int(item.get("TagName")[len(PREFIX):]) if row else None in _allowed_registers(int(row["CompanyID"]))
              except Exception: return False

          def install_trigger_signal_interceptor(app):
              if getattr(app,"_trigger_signal_interceptor_installed",False): return
              @app.before_request
              def _trigger_signal_intercept():
                  if request.path!="/api/store_forward" or request.method!="POST": return None
                  payload=request.get_json(silent=True) or {}; items=payload.get("items",[]) or []
                  trigger=[x for x in items if isinstance(x,dict) and str(x.get("TagName","")).startswith(PREFIX)]
                  if not trigger: return None
                  normal=[x for x in items if x not in trigger]
                  normal_result=ingest_items(normal) if normal else {"acks":[],"errors":[]}
                  acks,errors=_store_trigger_items(trigger)
                  return jsonify({"status":"ok","acks":normal_result.get("acks",[])+acks,"errors":normal_result.get("errors",[])+errors})
              app._trigger_signal_interceptor_installed=True
          ''').lstrip(), encoding='utf-8')

          # fix a small helper typo by replacing the generated function with a clearer version
          replace_once('services/trigger_signal_interceptor.py',
                       'def _allowed_registers_for_item(item,conn):\n              try:\n                  plc_id=int(item.get("PLC_ID")); row=conn.execute("SELECT CompanyID FROM PLCs WHERE PLC_ID=?",(plc_id,)).fetchone(); return int(item.get("TagName")[len(PREFIX):]) if row else None in _allowed_registers(int(row["CompanyID"]))\n              except Exception: return False',
                       'def _allowed_registers_for_item(item,conn):\n              try:\n                  plc_id=int(item.get("PLC_ID")); row=conn.execute("SELECT CompanyID FROM PLCs WHERE PLC_ID=?",(plc_id,)).fetchone()\n                  if row is None: return False\n                  register=int(str(item.get("TagName"))[len(PREFIX):])\n                  return register in _allowed_registers(int(row["CompanyID"]))\n              except Exception: return False')

          # ---------------- BOOTSTRAP HOOK ----------------
          replace_once(
              'services/runtime_bootstrap.py',
              'def bootstrap(app):\n    install_save_flow_sync(app)\n    install_flow_json_guard(app)',
              'def bootstrap(app):\n    from services.trigger_signal_interceptor import install_trigger_signal_interceptor\n    install_trigger_signal_interceptor(app)\n    install_save_flow_sync(app)\n    install_flow_json_guard(app)'
          )

          # ---------------- BASIC VALIDATION ----------------
          import py_compile
          for path in [
