                  data["ReportData"]=report
                  data["ChartData"]={"type":"bar","calendar":calendar,"date_picker":self.date_picker,"PLC_ID":plc_id,"report":report,"labels":[item.get("name",item.get("tag","")) for item in report.get("columns",[])],"datasets":[{"label":"مجموع گزارش","data":report.get("totals",[])}]}
                  return data
