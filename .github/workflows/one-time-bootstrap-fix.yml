name: One-time deterministic bootstrap repair

on:
  push:
    branches: ["refactor/stability-architecture-fix"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore app from main and apply one patch
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- app.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          text = p.read_text(encoding="utf-8")

          marker = "from services.dashboard_service import get_dashboard_widgets\n"
          assert marker in text
          text = text.replace(
              marker,
              marker + "from services.runtime_bootstrap import bootstrap as bootstrap_services\n",
              1,
          )

          text = text.replace(
              "init_database()\n",
              """try:
              init_database()
          except Exception as _database_bootstrap_error:
              print(\"DATABASE BOOTSTRAP ERROR:\", _database_bootstrap_error)
          """,
              1,
          )

          edge = """try:
              from services.edge_timeout_service import start_worker as _start_edge_timeout_worker
              _start_edge_timeout_worker()
              print(\"EDGE TIMEOUT WORKER BOOTSTRAP OK: app.py after init_database\")
          except Exception as _edge_timeout_start_error:
              print(\"EDGE TIMEOUT WORKER BOOTSTRAP ERROR:\", _edge_timeout_start_error)
          """
          assert edge in text
          text = text.replace(edge, "", 1)

          revocation = "_init_auth_session_revocations()\n"
          bootstrap = """try:
              _init_auth_session_revocations()
          except Exception as _auth_revocation_bootstrap_error:
              print(\"AUTH REVOCATION BOOTSTRAP ERROR:\", _auth_revocation_bootstrap_error)


          # =====================================================
          # EXPLICIT APPLICATION SERVICES BOOTSTRAP
          # =====================================================

          try:
              bootstrap_services(app)
              print(\"APPLICATION SERVICES BOOTSTRAP OK\")
          except Exception as _service_bootstrap_error:
              print(\"APPLICATION SERVICES BOOTSTRAP ERROR:\", _service_bootstrap_error)
          """
          assert text.count(revocation) == 1
          text = text.replace(revocation, bootstrap + "\n", 1)

          p.write_text(text, encoding="utf-8")
          PY

      - name: Verify exact security exception and syntax
        run: |
          grep -n 'SESSION_COOKIE_SECURE.*False' app.py
          python3 -m py_compile app.py
          if grep -q 'start_worker as _start_edge_timeout_worker' app.py; then exit 1; fi
          if grep -q 'try:$' app.py; then true; fi

      - name: Remove this temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/one-time-bootstrap-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Refactor app bootstrap deterministically"
          git push
