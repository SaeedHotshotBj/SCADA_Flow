name: Patch PLC ID field

on:
  push:
    branches:
      - main
    paths:
      - 'PLC_ID_FIELD_PATCH_TRIGGER.txt'
      - '.github/workflows/add-plc-id-field.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair PLC ID field patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('templates/flow_editor.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '<!-- PLC_ID_FIELD_PATCH_V1 -->'
          end_marker = '<!-- /PLC_ID_FIELD_PATCH_V1 -->'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end < start:
              raise SystemExit('PLC ID patch markers not found; no change made.')

          end += len(end_marker)
          block = text[start:end]
          fixed_block = block.replace('\\n', '\n')
          text = text[:start] + fixed_block + text[end:]
          path.write_text(text, encoding='utf-8')
          print('PLC ID field patch newlines normalized.')

      - name: Verify final HTML patch
        shell: python
        run: |
          from pathlib import Path
          text = Path('templates/flow_editor.html').read_text(encoding='utf-8')
          required = [
              '<!-- PLC_ID_FIELD_PATCH_V1 -->',
              '<label for="plc-id-input">PLC ID</label>',
              "editor.on('nodeSelected'",
              'current.data.plc_id=parsed;',
              '<!-- /PLC_ID_FIELD_PATCH_V1 -->',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('PLC ID patch verification failed: ' + repr(missing))
          if '\\n<style>' in text:
              raise SystemExit('Literal \\n escape remains before PLC ID patch.')
          print('PLC ID field patch verification passed.')

      - name: Commit target and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/flow_editor.html
          git rm .github/workflows/add-plc-id-field.yml PLC_ID_FIELD_PATCH_TRIGGER.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add PLC ID field to PLCReader UI"
          git push origin main
