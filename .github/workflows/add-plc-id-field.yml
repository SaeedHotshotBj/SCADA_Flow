name: Add PLC ID field to PLCReader UI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-plc-id-field.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add PLC ID field to PLCReader properties
        shell: python
        run: |
          from pathlib import Path

          path = Path('templates/flow_editor.html')
          text = path.read_text(encoding='utf-8')

          marker = "<!-- PLC_ID_FIELD_PATCH_V1 -->"
          if marker in text:
              print('PLC ID field patch already present.')
          else:
              injection = r'''\n<style>\n/* PLC_ID_FIELD_PATCH_V1 */\n.plc-id-note{font-size:11px;color:#999;line-height:1.4;margin-top:4px}\n</style>\n<script>\n/* PLC_ID_FIELD_PATCH_V1\n   Adds a PLC ID field only to PLCReader properties.\n   The value is stored in the existing node.data object and therefore\n   survives the normal Drawflow export/save path. No other node logic is changed. */\n(function(){\n    function installPlcIdField(){\n        if(typeof editor==='undefined' || !editor) return false;\n        if(editor.__plcIdFieldPatchInstalled) return true;\n        editor.__plcIdFieldPatchInstalled=true;\n\n        editor.on('nodeSelected', function(id){\n            setTimeout(function(){\n                try{\n                    const node=editor.getNodeFromId(id);\n                    if(!node || node.name!=='PLCReader') return;\n\n                    const content=document.getElementById('property-content');\n                    if(!content || document.getElementById('plc-id-field-patch')) return;\n\n                    const field=document.createElement('div');\n                    field.className='property-field';\n                    field.id='plc-id-field-patch';\n                    field.innerHTML=\n                        '<label for="plc-id-input">PLC ID</label>'+\n                        '<input id="plc-id-input" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 1">'+\n                        '<div class="plc-id-note">Unique SCADA identifier for this PLC. Modbus Slave can remain 1.</div>';\n\n                    content.appendChild(field);\n\n                    const input=document.getElementById('plc-id-input');\n                    const existing=node.data && node.data.plc_id;\n                    input.value=(existing===undefined || existing===null || existing==='') ? '' : existing;\n\n                    input.addEventListener('input', function(){\n                        const current=editor.getNodeFromId(id);\n                        if(!current) return;\n\n                        const raw=input.value.trim();\n                        if(raw===''){\n                            if(current.data) delete current.data.plc_id;\n                            return;\n                        }\n\n                        const parsed=Number(raw);\n                        if(!Number.isInteger(parsed) || parsed<1) return;\n\n                        current.data=current.data||{};\n                        current.data.plc_id=parsed;\n\n                        if(typeof editor.updateNodeDataFromId==='function'){\n                            editor.updateNodeDataFromId(id, current.data);\n                        }\n                    });\n                }catch(error){\n                    console.error('PLC ID FIELD ERROR:', error);\n                }\n            }, 0);\n        });\n\n        return true;\n    }\n\n    function waitForEditor(){\n        if(installPlcIdField()) return;\n        setTimeout(waitForEditor, 50);\n    }\n\n    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', waitForEditor);\n    else waitForEditor();\n})();\n</script>\n<!-- /PLC_ID_FIELD_PATCH_V1 -->\n'''

              closing = '</body>'
              if closing not in text:
                  raise SystemExit('Expected </body> marker was not found; no change made.')

              text = text.replace(closing, injection + closing, 1)
              path.write_text(text, encoding='utf-8')
              print('Added PLC ID field patch to flow_editor.html')

      - name: Commit target file and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/flow_editor.html .github/workflows/add-plc-id-field.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add PLC ID field to PLCReader UI"
          git push origin main
