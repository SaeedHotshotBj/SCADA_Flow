name: Direct Report Context Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-report-context-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch report service
        shell: python
        run: |
          from pathlib import Path
          path = Path('services/report_service.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''    if product_code in (None, ""):\n        product_code = management_context.get(\n            "ProductCode"\n        )\n\n    values = []\n'''

          replacement = '''    if product_code in (None, ""):\n        product_code = management_context.get(\n            "ProductCode"\n        )\n\n    # ManagementPanel context is already present in TagMapper output.\n    # Use it directly as the authoritative snapshot context so Trigger\n    # reports do not depend on ReportOutput context-role rows.\n    tag_lookup = {\n        str(name).strip().lower(): value\n        for name, value in tags.items()\n    }\n\n    direct_contract = tag_lookup.get("contractcode")\n    direct_product = tag_lookup.get("productcode")\n\n    if contract_code in (None, "") and direct_contract not in (None, ""):\n        contract_code = str(direct_contract).strip()\n\n    if product_code in (None, "") and direct_product not in (None, ""):\n        product_code = str(direct_product).strip()\n\n    values = []\n'''

          if anchor not in text:
              raise SystemExit('report context anchor not found')

          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/report_service.py
          git commit -m 'Fix ContractCode ProductCode in report history'
          git push origin main
          git rm .github/workflows/fix-report-context-direct.yml
          git commit -m 'Remove temporary report context fix workflow'
          git push origin main
