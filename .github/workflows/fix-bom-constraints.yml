name: Fix BOM constraints

on:
  push:
    paths:
      - '.github/workflows/fix-bom-constraints.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch management schema migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/management_service.py')
          s = p.read_text(encoding='utf-8')
          marker = """        CREATE INDEX IF NOT EXISTS idx_product_bom_product\n            ON ProductBOM (ProductID);\n"""
          replacement = """        CREATE INDEX IF NOT EXISTS idx_product_bom_product\n            ON ProductBOM (ProductID);\n\n        CREATE UNIQUE INDEX IF NOT EXISTS ux_products_company_code\n            ON Products (CompanyID, ProductCode);\n\n        CREATE UNIQUE INDEX IF NOT EXISTS ux_product_bom_product\n            ON ProductBOM (ProductID);\n\n        CREATE UNIQUE INDEX IF NOT EXISTS ux_contracts_company_code\n            ON Contracts (CompanyID, ContractCode);\n\n        CREATE UNIQUE INDEX IF NOT EXISTS ux_contract_products_pair\n            ON ContractProducts (ContractID, ProductID);\n"""
          if marker not in s:
              raise SystemExit('Expected migration marker not found')
          if 'ux_product_bom_product' not in s:
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Unique indexes already present')
          PY

      - name: Commit migration fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/management_service.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix management DB unique constraints"
          git push