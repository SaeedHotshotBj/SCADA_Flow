name: SCADA architecture tests

on:
  push:
    branches: ["refactor/stability-architecture-fix"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Import canonical registry
        run: |
          python - <<'PY'
          from flow_engine.node_registry import NODE_REGISTRY
          print("EDITOR KEYS:", sorted(NODE_REGISTRY.keys()))
          required = {"PLCReader", "ManagementPanel", "Pulse"}
          missing = required.difference(NODE_REGISTRY)
          assert not missing, missing
          print("EDITOR REGISTRY IMPORT OK")
          PY

      - name: Import runtime registry
        run: |
          python - <<'PY'
          import flow_engine.registry as runtime_registry
          from flow_engine.node_registry import NODE_REGISTRY
          print("RUNTIME KEYS:", sorted(runtime_registry.NODE_CLASSES.keys()))
          assert runtime_registry.NODE_REGISTRY is NODE_REGISTRY
          required = {
              "PLCReader", "TagMapper", "ExpressionNode", "ManagementPanel", "SQLWriter",
              "DashboardOutput", "MachineCard", "AlarmNode", "EdgeTimeout",
              "Roles", "RolesEngaged", "Pulse", "TrendReader",
              "TrendDatabaseReader", "TrendOutput", "ReportOutput", "DateConverter",
          }
          missing = required.difference(runtime_registry.NODE_CLASSES)
          assert not missing, missing
          print("RUNTIME REGISTRY IMPORT OK")
          PY

      - name: Verify Flow calculation nodes
        run: |
          python - <<'PY'
          from flow_engine.nodes.expression_node import ExpressionNode
          from flow_engine.nodes.management_panel import ManagementPanel

          payload = {"Tags": {"H": 30, "Voltage": 400}}
          payload = ExpressionNode({"expressions": [{"name": "Hour", "expression": "40-H"}]}).execute(payload)
          assert payload["Tags"]["Hour"] == 10

          payload = ManagementPanel({
              "calculations": [{"name": "Energy", "expression": "Voltage * 2"}]
          }).execute(payload)
          assert payload["Tags"]["Energy"] == 800

          try:
              ExpressionNode({"expressions": [{"name": "Bad", "expression": "__import__('os').system('x')"}]}).execute({"Tags": {}})
          except Exception:
              pass
          print("FLOW CALCULATION NODES OK")
          PY

      - name: Verify TagMapper PLC identity inference
        run: |
          python - <<'PY'
          from flow_engine.nodes.tag_mapper import TagMapper

          node = TagMapper({
              "mappings": [
                  {"register": 100, "name": "Batch"},
                  {"register": 101, "name": "Voltage", "plc_id": 2},
              ]
          })
          payload = node.execute({
              "CompanyID": 7,
              "PLC_ID": 1,
              "Registers": {"100": 55, "101": 400},
          })
          assert payload["Tags"] == {"Batch": 55.0}, payload
          assert payload["TagDefinitions"][0]["plc_id"] == 1

          payload = node.execute({
              "CompanyID": 7,
              "PLC_ID": 2,
              "Registers": {"100": 66, "101": 415},
          })
          assert payload["Tags"] == {"Batch": 66.0, "Voltage": 415.0}, payload
          print("TAG MAPPER PLC INFERENCE OK")
          PY

      - name: Verify production events traverse the connected Flow only
        run: |
          python - <<'PY'
          from flow_runner import FlowRunner
          import flow_engine.nodes.report_output as report_module

          saved = []

          def fake_save(company_id, tags, products, **kwargs):
              saved.append({"company_id": company_id, "tags": dict(tags), "products": list(products), **kwargs})
              return len(saved)

          report_module.save_report_snapshot = fake_save

          def node(name, config=None, outputs=None):
              return {
                  "name": name,
                  "data": {"config": config or {}},
                  "outputs": outputs or {},
              }

          flow = {"drawflow": {"Home": {"data": {
              "1": node("ExpressionNode", {
                  "expressions": [{"name": "Hour", "expression": "40-H"}]
              }, {"output_1": {"connections": [{"node": "2"}]}}),
              "2": node("SQLWriter", {}, {"output_1": {"connections": [{"node": "3"}]}}),
              "3": node("ManagementPanel", {
                  "calculations": [{"name": "Energy", "expression": "Voltage * Hour"}]
              }, {"output_1": {"connections": [{"node": "4"}]}}),
              "4": node("ReportOutput", {
                  "products": [{"name": "Energy", "tag": "Energy", "plc_id": 1}]
              }),
              "5": node("ReportOutput", {
                  "products": [{"name": "Energy", "tag": "Energy", "plc_id": 1}]
              }),
              "6": node("ReportOutput", {
                  "products": [{"name": "Energy", "tag": "Energy", "plc_id": 1}]
              }),
          }}}}

          runner = FlowRunner(flow, 7)
          result = runner.execute_production_event({
              "event_id": "evt-1",
              "PLC_ID": 1,
              "tags": {"H": 30, "Voltage": 400},
              "duration_seconds": 120,
              "timestamp": "2026-09-16 12:00:00",
          })

          assert result is not None
          assert len(saved) == 1, saved
          assert saved[0]["company_id"] == 7
          assert saved[0]["tags"]["Hour"] == 10.0
          assert saved[0]["tags"]["Energy"] == 4000.0
          assert saved[0]["report_node_id"] == "4"
          print("CONNECTED PRODUCTION FLOW OK")
          PY

      - name: Verify trigger edge definitions
        run: |
          python - <<'PY'
          from services.production_event_service import trigger_definitions

          definitions = [
              {"name": "Start", "storage": "TRIGGER", "trigger_register": 118, "trigger_value": 1, "trigger_edge": "rise"},
              {"name": "Stop", "storage": "TRIGGER", "trigger_register": 119, "trigger_value": 0, "trigger_edge": "fall"},
              {"name": "Ignored", "storage": "TIME", "trigger_register": 118, "trigger_value": 1},
          ]
          assert trigger_definitions(definitions, 118)[0][1] == "rise"
          assert trigger_definitions(definitions, 119)[0][1] == "fall"
          assert trigger_definitions(definitions, 120) == []
          print("TRIGGER EDGE DEFINITION OK")
          PY

      - name: Verify report persistence has no calculation evaluator
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("services/report_plc.py").read_text(encoding="utf-8")
          assert "def _safe_eval" not in text
          assert "_all_management_calculations" not in text
          assert "eval(" not in text
          text = Path("services/report_snapshot_runtime.py").read_text(encoding="utf-8")
          assert "def safe_flow_eval" not in text
          assert "eval(" not in text
          print("REPORT PERSISTENCE IS FLOW-PAYLOAD ONLY")
          PY

      - name: Verify Pulse runtime validation
        run: |
          python - <<'PY'
          from flow_engine.nodes.pulse import Pulse
          payload = Pulse({
              "enabled": True,
              "plc_id": 1,
              "register": 100,
              "bandwidth": 1,
              "pulse_width": 100,
              "interval": 1000,
          }).execute({})
          assert payload["PulseCommand"]["PLC_ID"] == 1
          try:
              Pulse({"enabled": True, "plc_id": 1, "register": 100, "bandwidth": 1, "pulse_width": 1000, "interval": 100}).execute({})
          except ValueError:
              pass
          else:
              raise AssertionError("Pulse accepted interval <= pulse width")
          print("PULSE VALIDATION OK")
          PY

      - name: Verify trend retention policy
        run: |
          python - <<'PY'
          from services.trend_aggregation import MINUTE_RETENTION_HOURS, HOUR_RETENTION_DAYS, DAY_RETENTION_DAYS, RAW_RETENTION_DAYS
          assert MINUTE_RETENTION_HOURS == 2
          assert HOUR_RETENTION_DAYS == 2
          assert DAY_RETENTION_DAYS == 600
          assert RAW_RETENTION_DAYS >= 600
          print("TREND RETENTION POLICY OK")
          PY

      - name: Verify Edge ingestion and Master command modules import
        run: |
          python - <<'PY'
          from services.edge_ingest import ingest_items, ensure_edge_event_schema
          from services.plc_write_service import queue_write, claim_next_command, complete_command
          from services.master_control_routes import bp
          print("EDGE INGEST + MASTER WRITE IMPORT OK", bp.name)
          PY

      - name: Verify service package has no import bootstrap side effect
        run: |
          python - <<'PY'
          import services
          assert services.__all__ == []
          print("IMPORT-SAFE SERVICES PACKAGE OK")
          PY

      - name: Verify dashboard service has no startup thread
        run: |
          ! grep -nE '(^|[^A-Za-z])threading|Thread\(' services/dashboard_service.py
          ! grep -n 'edge_timeout_service' services/dashboard_service.py

      - name: Verify PLC settings are Flow-defined
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("services/runtime_bootstrap.py").read_text(encoding="utf-8")
          assert 'data.get("port")' in text
          assert 'data.get("slave")' in text
          assert 'data.get("port", 502)' not in text
          assert 'data.get("slave", 1)' not in text
          print("PLC CONNECTION SETTINGS ARE FLOW-DEFINED")
          PY

      - name: Verify empty global flow has no project-specific configuration
        run: |
          python - <<'PY'
          import json
          with open("flow.json", encoding="utf-8") as f:
              flow = json.load(f)
          nodes = flow.get("drawflow", {}).get("Home", {}).get("data", {})
          assert nodes == {}, nodes
          print("GLOBAL FLOW IS EMPTY: COMPANY FLOWS ARE AUTHORITATIVE")
          PY

      - name: Verify application session setting is unchanged
        run: grep -n 'SESSION_COOKIE_SECURE.*False' app.py

      - name: Verify app source imports the explicit bootstrap
        run: |
          grep -n 'from services.runtime_bootstrap import bootstrap as bootstrap_services' app.py
          grep -n 'bootstrap_services(app)' app.py
