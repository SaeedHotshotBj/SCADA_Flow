name: Final ManagementPanel report context fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-management-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch ReportOutput context resolution
        shell: python
        run: |
          from pathlib import Path

          path = Path('flow_engine/nodes/report_output.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('    def _management_context_tags(self, data):\n')
          end = text.index('    @staticmethod\n    def normalize_date', start)

          replacement = '''    def _management_context_tags(self, data):
        """Resolve ContractCode/ProductCode from ManagementPanel settings.

        ManagementPanel owns the register addresses. TagMapper supplies the
        actual mapped values in data["Tags"]. Registers are used only as a
        fallback when those explicit context tags are not present.
        """
        if self.company_id is None:
            return {}

        try:
            flow = get_company_flow(self.company_id)
            if isinstance(flow, str):
                flow = json.loads(flow)

            nodes = flow.get("drawflow", {}).get("Home", {}).get("data", {})
            config = {}
            mappings = []

            for node in nodes.values():
                if not isinstance(node, dict):
                    continue
                name = node.get("name")
                raw = node.get("data", {}) or {}

                if name == "ManagementPanel":
                    config = raw.get("config", raw) or {}
                elif name == "TagMapper":
                    node_mappings = raw.get("mappings", [])
                    if isinstance(node_mappings, list):
                        mappings = node_mappings

            if not isinstance(config, dict):
                return {}

            tags = data.get("Tags", {}) or {}
            if not isinstance(tags, dict):
                tags = {}

            registers = data.get("Registers", {}) or {}
            if not isinstance(registers, dict):
                registers = {}

            # First and authoritative source at runtime: TagMapper output.
            tag_lookup = {
                str(name).strip().lower(): value
                for name, value in tags.items()
            }

            result = {}
            for key, aliases in {
                "ContractCode": (
                    "ContractCode",
                    "contractcode",
                    "Contract Code",
                    "contract_code",
                ),
                "ProductCode": (
                    "ProductCode",
                    "productcode",
                    "Product Code",
                    "product_code",
                ),
            }.items():
                for alias in aliases:
                    value = tag_lookup.get(str(alias).strip().lower())
                    if value not in (None, ""):
                        result[key] = str(value).strip()
                        break

            # Fallback: resolve ManagementPanel register -> TagMapper mapping
            # -> PLC register value when explicit context tags are unavailable.
            register_to_tag = {}
            for mapping in mappings:
                if not isinstance(mapping, dict):
                    continue
                name = str(mapping.get("name", "")).strip()
                if not name:
                    continue
                try:
                    address = int(float(mapping.get("register")))
                except (TypeError, ValueError):
                    continue
                register_to_tag[address] = name

            def read_register_value(field):
                address = config.get(field)
                if address in (None, ""):
                    return None
                try:
                    address = int(float(address))
                except (TypeError, ValueError):
                    return None

                tag_name = register_to_tag.get(address)
                if tag_name:
                    value = tag_lookup.get(tag_name.lower())
                    if value not in (None, ""):
                        return value

                for key in (str(address), address):
                    if key in registers and registers[key] not in (None, ""):
                        return registers[key]
                return None

            if "ContractCode" not in result:
                value = read_register_value("contract_code_register")
                if value not in (None, ""):
                    result["ContractCode"] = str(value).strip()

            if "ProductCode" not in result:
                value = read_register_value("product_code_register")
                if value not in (None, ""):
                    result["ProductCode"] = str(value).strip()

            print(
                "REPORT MANAGEMENT CONTEXT:",
                "Company=", self.company_id,
                "ContractCode=", result.get("ContractCode"),
                "ProductCode=", result.get("ProductCode"),
            )
            return result

        except Exception as exc:
            print("REPORT MANAGEMENT REGISTER LOAD ERROR:", exc)
            return {}

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flow_engine/nodes/report_output.py
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ManagementPanel Contract/Product context in report snapshots'
          git push origin main
