name: Add management panel to navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add management link
        shell: python
        run: |
          from pathlib import Path

          path = Path('templates/dashboard.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="/dashboard">Dashboard</a><a href="/trend">Trend</a><a href="/report">Report</a><a href="/plc_control">PLC Control</a><a href="/logout">Logout</a>'
          new = '<a href="/dashboard">Dashboard</a><a href="/trend">Trend</a><a href="/report">Report</a><a href="/plc_control">PLC Control</a><a href="/management">Management Panel</a><a href="/logout">Logout</a>'
          if old not in text:
              raise SystemExit('Dashboard navigation markup was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          nav = Path('templates/nav.html')
          nav_text = nav.read_text(encoding='utf-8')
          old_nav = '<a href="/dashboard">Dashboard</a>\n    <a href="/trend">Trend</a>\n    <a href="/report">Report</a>\n    <a href="/plc_control">PLC Control</a>\n    <a href="/logout">Logout</a>'
          new_nav = '<a href="/dashboard">Dashboard</a>\n    <a href="/trend">Trend</a>\n    <a href="/report">Report</a>\n    <a href="/plc_control">PLC Control</a>\n    <a href="/management">Management Panel</a>\n    <a href="/logout">Logout</a>'
          if old_nav not in nav_text:
              raise SystemExit('Shared navigation markup was not found.')
          nav.write_text(nav_text.replace(old_nav, new_nav, 1), encoding='utf-8')

      - name: Remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/add-management-nav.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/dashboard.html templates/nav.html .github/workflows/add-management-nav.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add management panel to top navigation'
          git push origin main
