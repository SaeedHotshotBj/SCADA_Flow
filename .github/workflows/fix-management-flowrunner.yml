name: Isolate management nodes from main FlowRunner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[management-flowrunner-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix_management_flowrunner.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow_runner.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "management: isolate management nodes from main FlowRunner [management-flowrunner-fixed]"
          git push
