name: Fix Trend Every Point

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-trend-every-point.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix login authentication session handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          old = '''    # =================================================
    # ALREADY LOGGED IN
    # =================================================

    if is_logged_in():

        print(
            "ALREADY LOGGED IN:",
            dict(session)
        )

        if is_master():

            return redirect(
                url_for(
                    "master_companies"
                )
            )

        return redirect(
            url_for(
                "dashboard"
            )
        )
'''

          new = '''    # =================================================
    # ALREADY LOGGED IN — GET ONLY
    # =================================================
    # A POST to /login must always validate the submitted
    # username/password. Never redirect merely because an
    # old session cookie exists.

    if request.method == "GET" and is_logged_in():

        print(
            "ALREADY LOGGED IN:",
            dict(session)
        )

        if is_master():

            return redirect(
                url_for(
                    "master_companies"
                )
            )

        return redirect(
            url_for(
                "dashboard"
            )
        )
'''

          if old not in text:
              raise SystemExit('Expected login block was not found; no change made.')

          text = text.replace(old, new, 1)

          marker = '''    # =================================================
    # POST LOGIN
    # =================================================

'''

          replacement = '''    # =================================================
    # POST LOGIN
    # =================================================

    # Do not inherit an old authenticated session when credentials
    # are submitted. The credentials below must always be validated.
    session.clear()

'''

          if marker not in text:
              raise SystemExit('POST LOGIN marker was not found; no change made.')

          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          print('Applied login authentication fix to app.py')

      - name: Remove Trend point downsampling
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n        # -------------------------------------------------\n'
              r'        # LIMIT CHART POINTS\n'
              r'        # -------------------------------------------------\n'
              r'.*?\n        print\(\)\n        print\(\n            "FINAL CHART DATASETS:",',
              re.S,
          )

          replacement = (
              '\n        # -------------------------------------------------\n'
              '        # KEEP EVERY HISTORIAN POINT\n'
              '        # -------------------------------------------------\n'
              '        # Do not downsample or slice historian data.\n'
              '        # TIME tags are stored at their configured interval\n'
              '        # and every stored point must reach the Trend chart.\n'
              '\n'
              '        print(\n'
              '            "FINAL CHART DATASETS:",'
          )

          new_text, count = pattern.subn(replacement, text, count=1)

          if count != 1:
              if 'LIMIT CHART POINTS' not in text:
                  print('Trend point downsampling is already removed.')
              else:
                  raise SystemExit('Could not locate the Trend point downsampling block.')
          else:
              path.write_text(new_text, encoding='utf-8')
              print('Removed Trend point downsampling from app.py')

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix login authentication session handling"
          git push origin main
