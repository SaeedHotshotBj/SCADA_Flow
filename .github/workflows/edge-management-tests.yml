name: Edge Management tests

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  edge-management:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Verify Edge Management protocol
        env:
          PYTHONPATH: .
        run: python tests/edge_management_test.py
