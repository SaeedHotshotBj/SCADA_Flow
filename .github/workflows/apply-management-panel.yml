name: Apply Flow Management Panel

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: !contains(github.event.head_commit.message, 'Implement flow management panel')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import ast

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'PATCH ANCHOR NOT FOUND: {label}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # 1) Flow editor node definition: ManagementPanel
          # ------------------------------------------------------------
          p = 'flow_engine/node_registry.py'
          s = read(p)
          marker = '    "DateConverter": {'
          management_node = '''    "ManagementPanel": {
              "config": [
                  {
                      "name": "DatePicker",
                      "label": "Date Type",
                      "type": "select",
                      "options": ["GregorianPicker", "JalaliPicker"],
                      "default": "JalaliPicker"
                  },
                  {
                      "name": "calculations",
                      "label": "Management Calculations",
                      "type": "table",
                      "columns": [
                          {"name": "name", "label": "Result Name", "type": "text"},
                          {"name": "label", "label": "Column Label", "type": "text"},
                          {"name": "expression", "label": "Expression", "type": "text"},
                          {"name": "unit", "label": "Unit", "type": "text"}
                      ]
                  }
              ]
          },

'''
          s = must_replace(s, marker, management_node + marker, 'ManagementPanel node registry')
          write(p, s)

          # ------------------------------------------------------------
          # 2) ReportHistory context columns + dynamic report products
          # ------------------------------------------------------------
          p = 'services/report_service.py'
          s = read(p)
          create_old = '''            CREATE TABLE IF NOT EXISTS ReportHistory (\n                ReportID INTEGER PRIMARY KEY AUTOINCREMENT,\n                CompanyID INTEGER,\n                Timestamp TEXT NOT NULL,\n                FOREIGN KEY (CompanyID)\n                    REFERENCES Companies(CompanyID)\n            );'''
          create_new = '''            CREATE TABLE IF NOT EXISTS ReportHistory (\n                ReportID INTEGER PRIMARY KEY AUTOINCREMENT,\n                CompanyID INTEGER,\n                ContractCode TEXT,\n                ProductCode TEXT,\n                Timestamp TEXT NOT NULL,\n                FOREIGN KEY (CompanyID)\n                    REFERENCES Companies(CompanyID)\n            );'''
          s = must_replace(s, create_old, create_new, 'ReportHistory create')

          alter_anchor = '''        cursor.execute('PRAGMA table_info("ReportHistory")')\n        columns = {row["name"] for row in cursor.fetchall()}\n\n        if "CompanyID" not in columns:'''
          alter_new = '''        cursor.execute('PRAGMA table_info("ReportHistory")')\n        columns = {row["name"] for row in cursor.fetchall()}\n\n        if "CompanyID" not in columns:'''
          # Keep the existing CompanyID migration intact; add context columns immediately after it.
          s = must_replace(s, alter_anchor, alter_new, 'ReportHistory migration anchor')
          company_block = '''            cursor.execute(\n                """\n                UPDATE ReportHistory\n                SET CompanyID = 1\n                WHERE CompanyID IS NULL\n                """\n            )\n'''
          context_block = company_block + '''\n        if "ContractCode" not in columns:\n            cursor.execute(\n                'ALTER TABLE "ReportHistory" ADD COLUMN ContractCode TEXT'\n            )\n\n        if "ProductCode" not in columns:\n            cursor.execute(\n                'ALTER TABLE "ReportHistory" ADD COLUMN ProductCode TEXT'\n            )\n'''
          s = must_replace(s, company_block, context_block, 'ReportHistory context migration')

          product_return_old = '''                candidate.append({\n                    "name": str(item.get("name", tag)).strip() or tag,\n                    "tag": tag,\n                    "unit": str(item.get("unit", "")).strip(),\n                })'''
          product_return_new = '''                candidate.append({\n                    "name": str(item.get("name", tag)).strip() or tag,\n                    "tag": tag,\n                    "unit": str(item.get("unit", "")).strip(),\n                    "context_role": str(\n                        item.get("context_role", item.get("context", ""))\n                    ).strip().lower(),\n                })'''
          s = must_replace(s, product_return_old, product_return_new, 'report product context_role')

          values_start = '''    values = []\n    seen = set()\n\n    tag_lookup = {'''
          context_helper = '''    values = []\n    seen = set()\n    contract_code = None\n    product_code = None\n\n    tag_lookup = {'''
          s = must_replace(s, values_start, context_helper, 'snapshot context variables')

          loop_old = '''        key = requested.lower()\n        if key in seen:\n            continue\n        seen.add(key)\n\n        item = tag_lookup.get(key)'''
          loop_new = '''        key = requested.lower()\n\n        context_role = str(\n            product.get("context_role", product.get("context", ""))\n        ).strip().lower()\n\n        item = tag_lookup.get(key)\n        if context_role in ("contract", "contract_code", "contractid", "contract_id"):\n            if item is not None and item[1] is not None:\n                contract_code = str(item[1]).strip()\n            continue\n        if context_role in ("product", "product_code", "productid", "product_id"):\n            if item is not None and item[1] is not None:\n                product_code = str(item[1]).strip()\n            continue\n\n        if key in seen:\n            continue\n        seen.add(key)'''
          s = must_replace(s, loop_old, loop_new, 'snapshot context extraction')

          insert_old = '''            INSERT INTO ReportHistory\n            (CompanyID, Timestamp)\n            VALUES (?, ?)'''
          insert_new = '''            INSERT INTO ReportHistory\n            (CompanyID, ContractCode, ProductCode, Timestamp)\n            VALUES (?, ?, ?, ?)'''
          s = must_replace(s, insert_old, insert_new, 'ReportHistory insert')

          insert_args_old = '''            (company_id, timestamp),'''
          insert_args_new = '''            (company_id, contract_code, product_code, timestamp),'''
          s = must_replace(s, insert_args_old, insert_args_new, 'ReportHistory insert args')

          report_products_old = '''    products = get_report_products(company_id)\n\n    result = {\n        "columns": products,'''
          report_products_new = '''    products = [\n        item\n        for item in get_report_products(company_id)\n        if not str(item.get("context_role", "")).strip()\n    ]\n\n    result = {\n        "columns": products,'''
          s = must_replace(s, report_products_old, report_products_new, 'report data context columns')
          write(p, s)

          # ------------------------------------------------------------
          # 3) Management service
          # ------------------------------------------------------------
          management_service = r'''# =====================================================
# SCADA_FLOW MANAGEMENT SERVICE
# Contracts + Products + BOM + Flow-defined calculations
# =====================================================

import json
from datetime import datetime

import jdatetime

from database import get_connection, get_company_flow
from flow_engine.nodes.expression_node import ExpressionNode
from services.report_service import get_report_products


TABLES_READY = False


def _flow_nodes(company_id):
    flow = get_company_flow(company_id)
    if not flow:
        return {}
    if isinstance(flow, str):
        flow = json.loads(flow)
    return flow.get("drawflow", {}).get("Home", {}).get("data", {}) or {}


def _management_config(company_id):
    nodes = _flow_nodes(company_id)
    configs = []
    for node in nodes.values():
        if not isinstance(node, dict) or node.get("name") != "ManagementPanel":
            continue
        data = node.get("data", {}) or {}
        config = data.get("config", data) or {}
        configs.append(config)
    if not configs:
        return {}
    return configs[-1]


def _connected_roles(company_id):
    nodes = _flow_nodes(company_id)
    targets = {str(k) for k, n in nodes.items() if isinstance(n, dict) and n.get("name") == "ManagementPanel"}
    roles = []
    found = False
    for node in nodes.values():
        if not isinstance(node, dict) or node.get("name") != "RolesEngaged":
            continue
        connected = False
        for port in (node.get("outputs", {}) or {}).values():
            for connection in (port.get("connections", []) if isinstance(port, dict) else []):
                if str(connection.get("node", "")) in targets:
                    connected = True
                    break
            if connected:
                break
        if not connected:
            continue
        found = True
        selected = (node.get("data", {}) or {}).get("roles", [])
        if isinstance(selected, str):
            selected = [selected]
        for item in selected if isinstance(selected, list) else []:
            role = item.get("role", "") if isinstance(item, dict) else item
            role = str(role).strip()
            if role and role.lower() not in {x.lower() for x in roles}:
                roles.append(role)
    return found, roles


def management_flow_allowed(company_id, user_role, is_master=False):
    if is_master:
        return True
    found, roles = _connected_roles(company_id)
    if not found:
        return False
    role = str(user_role or "").strip().lower()
    return any(role == str(item).strip().lower() for item in roles)


def ensure_management_tables():
    global TABLES_READY
    conn = get_connection()
    try:
        conn.executescript("""
        CREATE TABLE IF NOT EXISTS Contracts (
            ContractID INTEGER PRIMARY KEY AUTOINCREMENT,
            CompanyID INTEGER NOT NULL,
            ContractCode TEXT NOT NULL,
            ContractDate TEXT NOT NULL,
            ContractName TEXT NOT NULL,
            DeliveryDate TEXT,
            Description TEXT,
            CreatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),
            FOREIGN KEY (CompanyID) REFERENCES Companies(CompanyID),
            UNIQUE (CompanyID, ContractCode)
        );

        CREATE TABLE IF NOT EXISTS Products (
            ProductID INTEGER PRIMARY KEY AUTOINCREMENT,
            CompanyID INTEGER NOT NULL,
            ProductCode TEXT NOT NULL,
            ProductName TEXT NOT NULL,
            Unit TEXT DEFAULT '',
            CreatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),
            FOREIGN KEY (CompanyID) REFERENCES Companies(CompanyID),
            UNIQUE (CompanyID, ProductCode)
        );

        CREATE TABLE IF NOT EXISTS ContractProducts (
            ContractProductID INTEGER PRIMARY KEY AUTOINCREMENT,
            ContractID INTEGER NOT NULL,
            ProductID INTEGER NOT NULL,
            OrderedQuantity REAL NOT NULL DEFAULT 0,
            DeliveryDate TEXT,
            Description TEXT,
            FOREIGN KEY (ContractID) REFERENCES Contracts(ContractID) ON DELETE CASCADE,
            FOREIGN KEY (ProductID) REFERENCES Products(ProductID),
            UNIQUE (ContractID, ProductID)
        );

        CREATE TABLE IF NOT EXISTS ProductBOM (
            BOMID INTEGER PRIMARY KEY AUTOINCREMENT,
            ProductID INTEGER NOT NULL UNIQUE,
            CostPerKg REAL DEFAULT 0,
            CostPerMeter REAL DEFAULT 0,
            Notes TEXT,
            UpdatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),
            FOREIGN KEY (ProductID) REFERENCES Products(ProductID) ON DELETE CASCADE
        );

        CREATE INDEX IF NOT EXISTS idx_contracts_company_date
            ON Contracts (CompanyID, ContractDate);
        CREATE INDEX IF NOT EXISTS idx_contract_products_contract
            ON ContractProducts (ContractID, ProductID);
        CREATE INDEX IF NOT EXISTS idx_products_company_code
            ON Products (CompanyID, ProductCode);
        CREATE INDEX IF NOT EXISTS idx_product_bom_product
            ON ProductBOM (ProductID);
        """)
        conn.commit()
        TABLES_READY = True
    finally:
        conn.close()


def _parse_jalali(value, end_of_day=False):
    if not value:
        return None
    text = str(value).strip().replace("-", "/").replace("T", " ")
    text = text.translate(str.maketrans("۰۱۲۳۴۵۶۷۸۹٠١٢٣٤٥٦٧٨٩", "01234567890123456789"))
    for fmt in ("%Y/%m/%d %H:%M:%S", "%Y/%m/%d %H:%M", "%Y/%m/%d"):
        try:
            dt = jdatetime.datetime.strptime(text, fmt).togregorian()
            if end_of_day and len(text) <= 10:
                dt = dt.replace(hour=23, minute=59, second=59)
            return dt.strftime("%Y-%m-%d %H:%M:%S")
        except Exception:
            pass
    return None


def jalali_display(value):
    if not value:
        return ""
    try:
        dt = datetime.strptime(str(value)[:19], "%Y-%m-%d %H:%M:%S")
        return jdatetime.datetime.fromgregorian(datetime=dt).strftime("%Y/%m/%d %H:%M")
    except Exception:
        return str(value)


def save_product(company_id, payload):
    ensure_management_tables()
    code = str(payload.get("product_code", "")).strip()
    name = str(payload.get("product_name", "")).strip()
    unit = str(payload.get("unit", "")).strip()
    if not code or not name:
        raise ValueError("Product code and product name are required")
    try:
        kg = float(payload.get("cost_per_kg", 0) or 0)
        meter = float(payload.get("cost_per_meter", 0) or 0)
    except (TypeError, ValueError):
        raise ValueError("BOM prices must be numeric")
    if kg < 0 or meter < 0:
        raise ValueError("BOM prices cannot be negative")

    conn = get_connection()
    try:
        conn.execute("""
            INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
            VALUES (?, ?, ?, ?)
            ON CONFLICT(CompanyID, ProductCode) DO UPDATE SET
                ProductName=excluded.ProductName,
                Unit=excluded.Unit
        """, (company_id, code, name, unit))
        row = conn.execute("""
            SELECT ProductID FROM Products
            WHERE CompanyID=? AND ProductCode=?
        """, (company_id, code)).fetchone()
        product_id = int(row["ProductID"])
        conn.execute("""
            INSERT INTO ProductBOM (ProductID, CostPerKg, CostPerMeter, Notes, UpdatedAt)
            VALUES (?, ?, ?, ?, datetime('now','localtime'))
            ON CONFLICT(ProductID) DO UPDATE SET
                CostPerKg=excluded.CostPerKg,
                CostPerMeter=excluded.CostPerMeter,
                Notes=excluded.Notes,
                UpdatedAt=excluded.UpdatedAt
        """, (product_id, kg, meter, str(payload.get("notes", "")).strip()))
        conn.commit()
        return product_id
    finally:
        conn.close()


def save_contract(company_id, payload):
    ensure_management_tables()
    code = str(payload.get("contract_code", "")).strip()
    name = str(payload.get("contract_name", "")).strip()
    contract_date = _parse_jalali(payload.get("contract_date"))
    description = str(payload.get("description", "")).strip()
    products = payload.get("products", [])
    if not code or not name or not contract_date:
        raise ValueError("Contract code, name and a valid Jalali contract date are required")
    if not isinstance(products, list) or not products:
        raise ValueError("At least one contract product is required")

    conn = get_connection()
    try:
        conn.execute("BEGIN IMMEDIATE")
        conn.execute("""
            INSERT INTO Contracts (CompanyID, ContractCode, ContractDate, ContractName, DeliveryDate, Description)
            VALUES (?, ?, ?, ?, NULL, ?)
        """, (company_id, code, contract_date, name, description))
        contract_id = conn.execute("SELECT last_insert_rowid()").fetchone()[0]

        for item in products:
            if not isinstance(item, dict):
                continue
            pcode = str(item.get("product_code", "")).strip()
            pname = str(item.get("product_name", "")).strip()
            if not pcode or not pname:
                continue
            try:
                ordered = float(item.get("ordered_quantity", 0) or 0)
            except (TypeError, ValueError):
                raise ValueError(f"Invalid ordered quantity for {pcode}")
            delivery = _parse_jalali(item.get("delivery_date"))
            unit = str(item.get("unit", "")).strip()
            conn.execute("""
                INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
                VALUES (?, ?, ?, ?)
                ON CONFLICT(CompanyID, ProductCode) DO UPDATE SET
                    ProductName=excluded.ProductName,
                    Unit=CASE WHEN excluded.Unit<>'' THEN excluded.Unit ELSE Products.Unit END
            """, (company_id, pcode, pname, unit))
            product = conn.execute("""
                SELECT ProductID FROM Products WHERE CompanyID=? AND ProductCode=?
            """, (company_id, pcode)).fetchone()
            if not product:
                raise ValueError(f"Could not create product {pcode}")
            conn.execute("""
                INSERT INTO ContractProducts (ContractID, ProductID, OrderedQuantity, DeliveryDate, Description)
                VALUES (?, ?, ?, ?, ?)
            """, (contract_id, product["ProductID"], ordered, delivery, str(item.get("description", "")).strip()))

        conn.commit()
        return contract_id
    except Exception:
        conn.rollback()
        raise
    finally:
        conn.close()


def get_products(company_id):
    ensure_management_tables()
    conn = get_connection()
    try:
        rows = conn.execute("""
            SELECT p.ProductID, p.ProductCode, p.ProductName, p.Unit,
                   COALESCE(b.CostPerKg,0) AS CostPerKg,
                   COALESCE(b.CostPerMeter,0) AS CostPerMeter,
                   COALESCE(b.Notes,'') AS BOMNotes
            FROM Products p
            LEFT JOIN ProductBOM b ON b.ProductID=p.ProductID
            WHERE p.CompanyID=?
            ORDER BY p.ProductCode
        """, (company_id,)).fetchall()
        return [dict(row) for row in rows]
    finally:
        conn.close()


def _report_columns(company_id):
    return [p for p in get_report_products(company_id) if not str(p.get("context_role", "")).strip()]


def _management_calculations(company_id):
    config = _management_config(company_id)
    rows = config.get("calculations", []) if isinstance(config, dict) else []
    return [r for r in rows if isinstance(r, dict) and str(r.get("expression", "")).strip() and str(r.get("name", "")).strip()]


def get_config(company_id):
    ensure_management_tables()
    config = _management_config(company_id)
    return {
        "configured": bool(config),
        "date_picker": config.get("DatePicker", "JalaliPicker"),
        "report_columns": _report_columns(company_id),
        "calculations": _management_calculations(company_id),
        "products": get_products(company_id),
    }


def _query_base(company_id, filters):
    ensure_management_tables()
    where = ["c.CompanyID = ?"]
    args = [int(company_id)]

    def add_like(column, key):
        value = str(filters.get(key, "")).strip()
        if value:
            where.append(f"LOWER(CAST({column} AS TEXT)) LIKE LOWER(?)")
            args.append(f"%{value}%")

    add_like("c.ContractCode", "contract_code")
    add_like("c.ContractName", "contract_name")
    add_like("c.Description", "description")
    add_like("p.ProductCode", "product_code")
    add_like("p.ProductName", "product_name")

    try:
        min_qty = float(filters.get("min_ordered", "")) if str(filters.get("min_ordered", "")).strip() else None
        max_qty = float(filters.get("max_ordered", "")) if str(filters.get("max_ordered", "")).strip() else None
    except ValueError:
        raise ValueError("Ordered quantity filters must be numeric")
    if min_qty is not None:
        where.append("cp.OrderedQuantity >= ?"); args.append(min_qty)
    if max_qty is not None:
        where.append("cp.OrderedQuantity <= ?"); args.append(max_qty)

    start = _parse_jalali(filters.get("contract_date_from"), False)
    end = _parse_jalali(filters.get("contract_date_to"), True)
    if start:
        where.append("datetime(c.ContractDate) >= datetime(?)"); args.append(start)
    if end:
        where.append("datetime(c.ContractDate) <= datetime(?)"); args.append(end)

    delivery_from = _parse_jalali(filters.get("delivery_date_from"), False)
    delivery_to = _parse_jalali(filters.get("delivery_date_to"), True)
    if delivery_from:
        where.append("datetime(COALESCE(cp.DeliveryDate,'')) >= datetime(?)"); args.append(delivery_from)
    if delivery_to:
        where.append("datetime(COALESCE(cp.DeliveryDate,'')) <= datetime(?)"); args.append(delivery_to)

    return where, args


def get_management_data(company_id, filters=None):
    filters = filters or {}
    ensure_management_tables()
    where, args = _query_base(company_id, filters)
    conn = get_connection()
    try:
        rows = conn.execute(f"""
            SELECT c.ContractID, c.ContractCode, c.ContractDate, c.ContractName,
                   c.Description AS ContractDescription,
                   cp.ContractProductID, cp.OrderedQuantity, cp.DeliveryDate,
                   p.ProductID, p.ProductCode, p.ProductName, p.Unit,
                   COALESCE(b.CostPerKg,0) AS CostPerKg,
                   COALESCE(b.CostPerMeter,0) AS CostPerMeter,
                   COALESCE(b.Notes,'') AS BOMNotes
            FROM Contracts c
            INNER JOIN ContractProducts cp ON cp.ContractID=c.ContractID
            INNER JOIN Products p ON p.ProductID=cp.ProductID
            LEFT JOIN ProductBOM b ON b.ProductID=p.ProductID
            WHERE {' AND '.join(where)}
            ORDER BY datetime(c.ContractDate) DESC, c.ContractID DESC, p.ProductCode ASC
        """, args).fetchall()

        base = [dict(row) for row in rows]
        if not base:
            return {"columns": [], "rows": [], "count": 0}

        # Pull report values only for the selected contract/product pairs.
        report_args = [int(company_id)]
        pair_where = []
        for row in base:
            pair_where.append("(LOWER(COALESCE(h.ContractCode,''))=LOWER(?) AND LOWER(COALESCE(h.ProductCode,''))=LOWER(?))")
            report_args.extend([row["ContractCode"], row["ProductCode"]])
        report_rows = conn.execute(f"""
            SELECT h.ReportID, h.ContractCode, h.ProductCode, h.Timestamp,
                   v.TagName, v.Value
            FROM ReportHistory h
            INNER JOIN ReportValues v ON v.ReportID=h.ReportID
            WHERE h.CompanyID=? AND ({' OR '.join(pair_where)})
            ORDER BY h.ReportID ASC, v.ReportValueID ASC
        """, report_args).fetchall()

        grouped = {}
        for rr in report_rows:
            key = (str(rr["ContractCode"] or "").strip().lower(), str(rr["ProductCode"] or "").strip().lower())
            g = grouped.setdefault(key, {"ids": set(), "tags": {}, "timestamps": []})
            g["ids"].add(rr["ReportID"])
            tag = str(rr["TagName"] or "").strip()
            if tag:
                g["tags"].setdefault(tag, []).append(rr["Value"])
            if rr["Timestamp"]:
                g["timestamps"].append(rr["Timestamp"])

        calculations = _management_calculations(company_id)
        expression_node = ExpressionNode({"expressions": calculations}) if calculations else None
        report_columns = _report_columns(company_id)
        columns = [
            {"key":"ContractCode","label":"کد قرارداد","unit":""},
            {"key":"ContractDate","label":"تاریخ عقد قرارداد","unit":""},
            {"key":"ContractName","label":"نام قرارداد","unit":""},
            {"key":"ProductCode","label":"کد محصول","unit":""},
            {"key":"ProductName","label":"محصول","unit":""},
            {"key":"OrderedQuantity","label":"مقدار سفارش","unit":""},
            {"key":"DeliveryDate","label":"تاریخ تحویل","unit":""},
            {"key":"Description","label":"توضیحات","unit":""},
            {"key":"CostPerKg","label":"هزینه BOM / kg","unit":""},
            {"key":"CostPerMeter","label":"هزینه BOM / m","unit":""},
        ]
        columns.extend({"key":p["tag"], "label":p["name"], "unit":p.get("unit","")} for p in report_columns)
        columns.extend({"key":str(c["name"]), "label":str(c.get("label", c["name"])), "unit":str(c.get("unit", ""))} for c in calculations)

        output_rows = []
        for row in base:
            key = (str(row["ContractCode"]).strip().lower(), str(row["ProductCode"]).strip().lower())
            g = grouped.get(key, {"ids":set(),"tags":{},"timestamps":[]})
            tags = {}
            for tag, values in g["tags"].items():
                clean = []
                for value in values:
                    try:
                        clean.append(float(value))
                    except (TypeError, ValueError):
                        pass
                tags[tag] = clean
                # Explicit aggregate variables are also available to Flow formulas.
                tags[f"{tag}_values"] = clean
                tags[f"{tag}_last"] = clean[-1] if clean else None

            tags["OrderedQuantity"] = row["OrderedQuantity"]
            tags["CostPerKg"] = row["CostPerKg"]
            tags["CostPerMeter"] = row["CostPerMeter"]
            tags["ContractCode"] = row["ContractCode"]
            tags["ProductCode"] = row["ProductCode"]

            calculated = {}
            if expression_node:
                result = expression_node.execute({"Tags": tags}) or {}
                calculated = dict(result.get("Tags", {}))

            display = {
                "ContractCode": row["ContractCode"],
                "ContractDate": jalali_display(row["ContractDate"]),
                "ContractName": row["ContractName"],
                "ProductCode": row["ProductCode"],
                "ProductName": row["ProductName"],
                "OrderedQuantity": row["OrderedQuantity"],
                "DeliveryDate": jalali_display(row["DeliveryDate"]),
                "Description": row["ContractDescription"] or row.get("BOMNotes", ""),
                "CostPerKg": row["CostPerKg"],
                "CostPerMeter": row["CostPerMeter"],
            }
            for p in report_columns:
                value = tags.get(p["tag"], [])
                display[p["tag"]] = value
            for c in calculations:
                display[str(c["name"])] = calculated.get(str(c["name"]))
            output_rows.append(display)

        return {"columns": columns, "rows": output_rows, "count": len(output_rows)}
    finally:
        conn.close()
'''
          write('services/management_service.py', management_service)

          # ------------------------------------------------------------
          # 4) Flow-company routes: management page + APIs
          # ------------------------------------------------------------
          p = 'flow_company_routes.py'
          s = read(p)
          imports = '''\nfrom services.management_service import (\n    ensure_management_tables,\n    management_flow_allowed,\n    get_config as get_management_config,\n    get_management_data,\n    save_contract,\n    save_product,\n    get_products,\n)\n'''
          if 'from services.management_service import (' not in s:
              s += imports

          routes = r'''\n\n# =====================================================\n# MANAGEMENT PANEL\n# Contracts + Products + BOM + Flow-defined calculations\n# =====================================================\n\n\ndef _management_company_id():\n    return _report_company_id()\n\n\ndef _management_allowed(company_id):\n    if not session.get("user_id"):\n        return False\n    return management_flow_allowed(\n        company_id,\n        session.get("role"),\n        is_master=_is_master(),\n    )\n\n\n@flow_company_bp.get("/management")\ndef management_page():\n    company_id = _management_company_id()\n    if company_id is None:\n        return jsonify({"status": "error", "message": "Company is required"}), 403\n    if not _management_allowed(company_id):\n        response = render_template("access_denied.html")\n        return response, 403, {\n            "Cache-Control": "no-store, no-cache, must-revalidate, max-age=0",\n            "Pragma": "no-cache",\n            "Expires": "0",\n        }\n    ensure_management_tables()\n    return render_template("management.html", company_id=company_id)\n\n\n@flow_company_bp.get("/management/config")\ndef management_config():\n    company_id = _management_company_id()\n    if company_id is None or not _management_allowed(company_id):\n        return jsonify({"status":"error", "message":"Access denied"}), 403\n    return jsonify(get_management_config(company_id))\n\n\n@flow_company_bp.post("/management/contracts")\ndef management_contract_create():\n    company_id = _management_company_id()\n    if company_id is None or not _management_allowed(company_id):\n        return jsonify({"status":"error", "message":"Access denied"}), 403\n    try:\n        payload = request.get_json(silent=True) or {}\n        contract_id = save_contract(company_id, payload)\n        return jsonify({"status":"ok", "ContractID":contract_id})\n    except Exception as exc:\n        return jsonify({"status":"error", "message":str(exc)}), 400\n\n\n@flow_company_bp.post("/management/products")\ndef management_product_save():\n    company_id = _management_company_id()\n    if company_id is None or not _management_allowed(company_id):\n        return jsonify({"status":"error", "message":"Access denied"}), 403\n    try:\n        payload = request.get_json(silent=True) or {}\n        product_id = save_product(company_id, payload)\n        return jsonify({"status":"ok", "ProductID":product_id})\n    except Exception as exc:\n        return jsonify({"status":"error", "message":str(exc)}), 400\n\n\n@flow_company_bp.get("/management/products")\ndef management_products():\n    company_id = _management_company_id()\n    if company_id is None or not _management_allowed(company_id):\n        return jsonify({"status":"error", "message":"Access denied"}), 403\n    return jsonify(get_products(company_id))\n\n\n@flow_company_bp.get("/management/data")\ndef management_data():\n    company_id = _management_company_id()\n    if company_id is None or not _management_allowed(company_id):\n        return jsonify({"status":"error", "message":"Access denied"}), 403\n    try:\n        return jsonify(get_management_data(company_id, request.args.to_dict(flat=True)))\n    except Exception as exc:\n        return jsonify({"status":"error", "message":str(exc)}), 400\n'''
          s += routes
          write(p, s)

          # ------------------------------------------------------------
          # 5) schema.sql: fresh installations
          # ------------------------------------------------------------
          p = 'schema.sql'
          s = read(p)
          s = s.replace(
              '''CREATE TABLE IF NOT EXISTS ReportHistory (''',
              '''CREATE TABLE IF NOT EXISTS ReportHistory ('''
          )
          schema_append = r'''\n\n-- =====================================================\n-- Management / Contracts / Products / BOM\n-- =====================================================\n\nCREATE TABLE IF NOT EXISTS Contracts (\n    ContractID INTEGER PRIMARY KEY AUTOINCREMENT,\n    CompanyID INTEGER NOT NULL,\n    ContractCode TEXT NOT NULL,\n    ContractDate TEXT NOT NULL,\n    ContractName TEXT NOT NULL,\n    DeliveryDate TEXT,\n    Description TEXT,\n    CreatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),\n    FOREIGN KEY (CompanyID) REFERENCES Companies(CompanyID),\n    UNIQUE (CompanyID, ContractCode)\n);\n\nCREATE TABLE IF NOT EXISTS Products (\n    ProductID INTEGER PRIMARY KEY AUTOINCREMENT,\n    CompanyID INTEGER NOT NULL,\n    ProductCode TEXT NOT NULL,\n    ProductName TEXT NOT NULL,\n    Unit TEXT DEFAULT '',\n    CreatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),\n    FOREIGN KEY (CompanyID) REFERENCES Companies(CompanyID),\n    UNIQUE (CompanyID, ProductCode)\n);\n\nCREATE TABLE IF NOT EXISTS ContractProducts (\n    ContractProductID INTEGER PRIMARY KEY AUTOINCREMENT,\n    ContractID INTEGER NOT NULL,\n    ProductID INTEGER NOT NULL,\n    OrderedQuantity REAL NOT NULL DEFAULT 0,\n    DeliveryDate TEXT,\n    Description TEXT,\n    FOREIGN KEY (ContractID) REFERENCES Contracts(ContractID) ON DELETE CASCADE,\n    FOREIGN KEY (ProductID) REFERENCES Products(ProductID),\n    UNIQUE (ContractID, ProductID)\n);\n\nCREATE TABLE IF NOT EXISTS ProductBOM (\n    BOMID INTEGER PRIMARY KEY AUTOINCREMENT,\n    ProductID INTEGER NOT NULL UNIQUE,\n    CostPerKg REAL DEFAULT 0,\n    CostPerMeter REAL DEFAULT 0,\n    Notes TEXT,\n    UpdatedAt TEXT NOT NULL DEFAULT (datetime('now','localtime')),\n    FOREIGN KEY (ProductID) REFERENCES Products(ProductID) ON DELETE CASCADE\n);\n\nCREATE INDEX IF NOT EXISTS idx_contracts_company_date\n    ON Contracts (CompanyID, ContractDate);\n\nCREATE INDEX IF NOT EXISTS idx_contract_products_contract\n    ON ContractProducts (ContractID, ProductID);\n\nCREATE INDEX IF NOT EXISTS idx_products_company_code\n    ON Products (CompanyID, ProductCode);\n\nCREATE INDEX IF NOT EXISTS idx_product_bom_product\n    ON ProductBOM (ProductID);\n'''
          if 'CREATE TABLE IF NOT EXISTS Contracts' not in s:
              s += schema_append
          write(p, s)

          # ------------------------------------------------------------
          # 6) Syntax validation for Python files touched by this patch
          # ------------------------------------------------------------
          for path in [
              'flow_engine/node_registry.py',
              'services/report_service.py',
              'services/management_service.py',
              'flow_company_routes.py',
          ]:
              try:
                  ast.parse(read(path), filename=path)
              except SyntaxError as exc:
                  raise SystemExit(f'SYNTAX ERROR in {path}: {exc}')

          print('PATCH FILES VALIDATED')
          PY

      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flow_engine/node_registry.py services/report_service.py services/management_service.py flow_company_routes.py schema.sql
          git rm -f .github/workflows/apply-management-panel.yml
          git commit -m "Implement flow management panel and report context" || exit 0
          git push origin HEAD:main
