name: Add Jalali DatePickers to ManagementPanel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-management-jalali.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch management.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('templates/management.html')
          t = p.read_text(encoding='utf-8')

          if 'persian-datepicker@1.2.0' not in t:
              t = t.replace('<meta charset="UTF-8">', '''<meta charset="UTF-8">\n<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>\n<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">''', 1)

          for field, placeholder in [
              ('contract_date_from','1405/06/01'),
              ('contract_date_to','1405/06/31'),
              ('delivery_date_from','1405/07/01'),
              ('delivery_date_to','1405/07/31'),
              ('new_contract_date','1405/06/10'),
          ]:
              t = t.replace(
                  f'id="{field}" placeholder="{placeholder}"',
                  f'id="{field}" class="jalali-date" placeholder="{placeholder}"',
                  1,
              )

          marker = 'function addContractProduct(){'
          if 'function initJalaliPicker' not in t:
              helper = '''function initJalaliPicker(el){if(!el||!window.jQuery||!jQuery.fn.persianDatepicker)return;const q=jQuery(el);if(q.data("jalali-ready"))return;q.persianDatepicker({format:"YYYY/MM/DD",initialValue:false,autoClose:true,observer:true,calendarType:"persian",toolbox:{enabled:true,todayButton:{enabled:true},submitButton:{enabled:false},calendarSwitch:{enabled:false}}});q.data("jalali-ready",true)}\nfunction initAllJalaliPickers(){document.querySelectorAll(".jalali-date").forEach(initJalaliPicker)}\n'''
              if marker not in t:
                  raise SystemExit('addContractProduct marker not found')
              t = t.replace(marker, helper + marker, 1)

          old_dynamic = '<td><input data-k="delivery_date" placeholder="1405/07/01"></td>'
          new_dynamic = '<td><input data-k="delivery_date" class="jalali-date" placeholder="1405/07/01"></td>'
          t = t.replace(old_dynamic, new_dynamic, 1)

          add_end = "$('contractProducts').appendChild(tr)}"
          if add_end in t:
              t = t.replace(add_end, "$('contractProducts').appendChild(tr);initAllJalaliPickers()}", 1)

          if 'initAllJalaliPickers();' not in t:
              anchor = "(async()=>{try{await loadConfig();await loadData()}catch(e){alert('پیکربندی پنل مدیریت در Flow موجود نیست یا دسترسی ندارید.')}})();"
              if anchor in t:
                  t = t.replace(anchor, 'initAllJalaliPickers();\n' + anchor, 1)

          if '.jalali-date{direction:ltr' not in t:
              t = t.replace('</style>', '.jalali-date{direction:ltr;text-align:center;cursor:pointer}.datepicker-plot-area{z-index:10000!important}\n</style>', 1)

          p.write_text(t, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q 'persian-datepicker@1.2.0' templates/management.html
          grep -q 'function initJalaliPicker' templates/management.html
          grep -q 'id="new_contract_date" class="jalali-date"' templates/management.html
          grep -q 'id="contract_date_from" class="jalali-date"' templates/management.html
          grep -q 'data-k="delivery_date" class="jalali-date"' templates/management.html
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/management.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Jalali datepickers to ManagementPanel'
          git push origin main
