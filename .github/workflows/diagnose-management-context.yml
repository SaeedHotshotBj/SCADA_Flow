name: Diagnose ManagementPanel context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-management-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add persistent diagnostic logging
        shell: python
        run: |
          from pathlib import Path

          path = Path('services/report_service.py')
          text = path.read_text(encoding='utf-8')

          imp = 'from services.management_debug import log as management_debug_log\n'
          anchor = 'from database import get_connection, get_company_flow\n'
          if imp not in text:
              if anchor not in text:
                  raise SystemExit('database import anchor not found')
              text = text.replace(anchor, anchor + imp, 1)

          old = '''        if not isinstance(management_config, dict):\n            return result\n\n        register_to_tag = {}\n'''
          new = '''        management_debug_log(\n            "CONTEXT_CONFIG",\n            company_id=company_id,\n            management_config=management_config,\n            tag_mappings=tag_mappings,\n        )\n\n        if not isinstance(management_config, dict):\n            management_debug_log(\n                "CONTEXT_RESULT",\n                company_id=company_id,\n                reason="ManagementPanel config is not a dict",\n                result=result,\n            )\n            return result\n\n        register_to_tag = {}\n'''
          if old not in text:
              raise SystemExit('context config anchor not found')
          text = text.replace(old, new, 1)

          old = '''        try:\n            contract_register = int(\n                float(\n                    management_config.get(\n                        "contract_code_register"\n                    )\n                )\n            )\n        except (TypeError, ValueError):\n            contract_register = None\n\n        try:\n            product_register = int(\n                float(\n                    management_config.get(\n                        "product_code_register"\n                    )\n                )\n            )\n        except (TypeError, ValueError):\n            product_register = None\n'''
          new = '''        def _config_register(*names):\n            for name in names:\n                value = management_config.get(name)\n                if value not in (None, ""):\n                    return value\n            return None\n\n        try:\n            contract_register = int(float(_config_register(\n                "contract_code_register",\n                "ContractCodePLCRegister",\n                "contractCodePLCRegister",\n                "Contract Code PLC Register",\n                "contractCodeRegister",\n            )))\n        except (TypeError, ValueError):\n            contract_register = None\n\n        try:\n            product_register = int(float(_config_register(\n                "product_code_register",\n                "ProductCodePLCRegister",\n                "productCodePLCRegister",\n                "Product Code PLC Register",\n                "productCodeRegister",\n            )))\n        except (TypeError, ValueError):\n            product_register = None\n\n        management_debug_log(\n            "REGISTER_RESOLUTION",\n            company_id=company_id,\n            contract_register=contract_register,\n            product_register=product_register,\n            register_to_tag=register_to_tag,\n        )\n'''
          if old not in text:
              raise SystemExit('register resolution block not found')
          text = text.replace(old, new, 1)

          old = '''                if value not in (None, ""):\n                    result["ContractCode"] = str(value).strip()\n\n            if product_register is not None:\n'''
          new = '''                management_debug_log(\n                    "CONTRACT_LOOKUP",\n                    company_id=company_id,\n                    register=contract_register,\n                    tag_name=tag_name,\n                    value=value,\n                )\n                if value not in (None, ""):\n                    result["ContractCode"] = str(value).strip()\n\n            if product_register is not None:\n'''
          if old not in text:
              raise SystemExit('contract lookup anchor not found')
          text = text.replace(old, new, 1)

          old = '''                if value not in (None, ""):\n                    result["ProductCode"] = str(value).strip()\n\n            # Optional fallback:\n'''
          new = '''                management_debug_log(\n                    "PRODUCT_LOOKUP",\n                    company_id=company_id,\n                    register=product_register,\n                    tag_name=tag_name,\n                    value=value,\n                )\n                if value not in (None, ""):\n                    result["ProductCode"] = str(value).strip()\n\n            # Optional fallback:\n'''
          if old not in text:
              raise SystemExit('product lookup anchor not found')
          text = text.replace(old, new, 1)

          old = '''        finally:\n            conn.close()\n\n    except Exception as exc:\n'''
          new = '''        finally:\n            conn.close()\n\n        management_debug_log(\n            "CONTEXT_RESULT",\n            company_id=company_id,\n            result=result,\n        )\n\n    except Exception as exc:\n        management_debug_log(\n            "CONTEXT_EXCEPTION",\n            company_id=company_id,\n            error=repr(exc),\n        )\n'''
          if old not in text:
              raise SystemExit('context finally anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if not values:\n        return None\n\n    conn = get_connection()\n'''
          new = '''    management_debug_log(\n        "SNAPSHOT_BEFORE_INSERT",\n        company_id=company_id,\n        timestamp=timestamp,\n        trigger_tag=trigger_tag,\n        trigger_register=trigger_register,\n        trigger_value=trigger_value,\n        contract_code=contract_code,\n        product_code=product_code,\n        value_tags=[name for name, _ in values],\n    )\n\n    if not values:\n        management_debug_log(\n            "SNAPSHOT_SKIPPED",\n            company_id=company_id,\n            reason="no report values",\n            contract_code=contract_code,\n            product_code=product_code,\n        )\n        return None\n\n    conn = get_connection()\n'''
          if old not in text:
              raise SystemExit('snapshot anchor not found')
          text = text.replace(old, new, 1)

          old = '''        conn.commit()\n        return report_id\n\n    except Exception:\n        conn.rollback()\n        raise\n'''
          new = '''        conn.commit()\n        management_debug_log(\n            "SNAPSHOT_INSERTED",\n            company_id=company_id,\n            report_id=report_id,\n            contract_code=contract_code,\n            product_code=product_code,\n            history_columns=history_columns,\n        )\n        return report_id\n\n    except Exception as exc:\n        management_debug_log(\n            "SNAPSHOT_INSERT_EXCEPTION",\n            company_id=company_id,\n            error=repr(exc),\n            contract_code=contract_code,\n            product_code=product_code,\n        )\n        conn.rollback()\n        raise\n'''
          if old not in text:
              raise SystemExit('snapshot commit anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          runtime = Path('services/report_runtime.py')
          rtext = runtime.read_text(encoding='utf-8')
          if 'from services.management_debug import log as management_debug_log' not in rtext:
              rtext = rtext.replace(
                  'from services.report_service import save_report_snapshot\n',
                  'from services.report_service import save_report_snapshot\nfrom services.management_debug import log as management_debug_log\n',
                  1,
              )

          old = '''            context = self._management_context(company_id)\n'''
          new = '''            context = self._management_context(company_id)\n            management_debug_log(\n                "RUNTIME_CONTEXT",\n                company_id=company_id,\n                trigger_tag=tag_name,\n                report_node=config["node_id"],\n                context=context,\n                tags=values,\n            )\n'''
          if old not in rtext:
              raise SystemExit('runtime context anchor not found')
          rtext = rtext.replace(old, new, 1)
          runtime.write_text(rtext, encoding='utf-8')

      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/report_service.py services/report_runtime.py
          git diff --cached --quiet && exit 0
          git commit -m 'Add persistent ManagementPanel context diagnostics'
          git push origin main
