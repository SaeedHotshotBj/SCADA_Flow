name: Fix BOM save final

on:
  push:
    paths:
      - '.github/workflows/fix-bom-save-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch BOM save and migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/management_service.py')
          s = p.read_text(encoding='utf-8')

          old_indexes = '''        CREATE UNIQUE INDEX IF NOT EXISTS ux_products_company_code
            ON Products (CompanyID, ProductCode);

        CREATE UNIQUE INDEX IF NOT EXISTS ux_product_bom_product
            ON ProductBOM (ProductID);

        CREATE UNIQUE INDEX IF NOT EXISTS ux_contracts_company_code
            ON Contracts (CompanyID, ContractCode);

        CREATE UNIQUE INDEX IF NOT EXISTS ux_contract_products_pair
            ON ContractProducts (ContractID, ProductID);
'''
          s = s.replace(old_indexes, '')

          old_product = '''        conn.execute("""
            INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
            VALUES (?, ?, ?, ?)
            ON CONFLICT(CompanyID, ProductCode) DO UPDATE SET
                ProductName=excluded.ProductName,
                Unit=CASE WHEN excluded.Unit<>'' THEN excluded.Unit ELSE Products.Unit END
        """, (company_id, code, name, unit))
        row = conn.execute(
            "SELECT ProductID FROM Products WHERE CompanyID=? AND ProductCode=?",
            (company_id, code),
        ).fetchone()
        product_id = int(row["ProductID"])
        conn.execute("""
            INSERT INTO ProductBOM (ProductID, CostPerKg, CostPerMeter, Notes, UpdatedAt)
            VALUES (?, ?, ?, ?, datetime('now','localtime'))
            ON CONFLICT(ProductID) DO UPDATE SET
                CostPerKg=excluded.CostPerKg,
                CostPerMeter=excluded.CostPerMeter,
                Notes=excluded.Notes,
                UpdatedAt=excluded.UpdatedAt
        """, (product_id, kg, meter, str(payload.get("notes", "")).strip()))
'''
          new_product = '''        row = conn.execute(
            "SELECT ProductID FROM Products WHERE CompanyID=? AND ProductCode=? ORDER BY ProductID LIMIT 1",
            (company_id, code),
        ).fetchone()
        if row is None:
            cursor = conn.execute("""
                INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
                VALUES (?, ?, ?, ?)
            """, (company_id, code, name, unit))
            product_id = int(cursor.lastrowid)
        else:
            product_id = int(row["ProductID"])
            conn.execute(
                """
                UPDATE Products
                   SET ProductName=?,
                       Unit=CASE WHEN ?<>'' THEN ? ELSE Unit END
                 WHERE ProductID=?
                """,
                (name, unit, unit, product_id),
            )

        bom = conn.execute(
            "SELECT BOMID FROM ProductBOM WHERE ProductID=? ORDER BY BOMID LIMIT 1",
            (product_id,),
        ).fetchone()
        notes = str(payload.get("notes", "")).strip()
        if bom is None:
            conn.execute("""
                INSERT INTO ProductBOM
                    (ProductID, CostPerKg, CostPerMeter, Notes, UpdatedAt)
                VALUES (?, ?, ?, ?, datetime('now','localtime'))
            """, (product_id, kg, meter, notes))
        else:
            conn.execute("""
                UPDATE ProductBOM
                   SET CostPerKg=?,
                       CostPerMeter=?,
                       Notes=?,
                       UpdatedAt=datetime('now','localtime')
                 WHERE BOMID=?
            """, (kg, meter, notes, int(bom["BOMID"])))
'''
          if old_product not in s:
              raise SystemExit('Expected save_product block not found')
          s = s.replace(old_product, new_product, 1)

          old_contract_product = '''            conn.execute("""
                INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
                VALUES (?, ?, ?, ?)
                ON CONFLICT(CompanyID, ProductCode) DO UPDATE SET
                    ProductName=excluded.ProductName,
                    Unit=CASE WHEN excluded.Unit<>'' THEN excluded.Unit ELSE Products.Unit END
            """, (company_id, pcode, pname, unit))
            product = conn.execute(
                "SELECT ProductID FROM Products WHERE CompanyID=? AND ProductCode=?",
                (company_id, pcode),
            ).fetchone()
'''
          new_contract_product = '''            product = conn.execute(
                "SELECT ProductID FROM Products WHERE CompanyID=? AND ProductCode=? ORDER BY ProductID LIMIT 1",
                (company_id, pcode),
            ).fetchone()
            if product is None:
                cursor = conn.execute("""
                    INSERT INTO Products (CompanyID, ProductCode, ProductName, Unit)
                    VALUES (?, ?, ?, ?)
                """, (company_id, pcode, pname, unit))
                product = conn.execute(
                    "SELECT ProductID FROM Products WHERE ProductID=?",
                    (cursor.lastrowid,),
                ).fetchone()
            else:
                conn.execute(
                    """
                    UPDATE Products
                       SET ProductName=?,
                           Unit=CASE WHEN ?<>'' THEN ? ELSE Unit END
                     WHERE ProductID=?
                    """,
                    (pname, unit, unit, int(product["ProductID"])),
                )
'''
          if old_contract_product not in s:
              raise SystemExit('Expected save_contract product block not found')
          s = s.replace(old_contract_product, new_contract_product, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit final BOM fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/management_service.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix legacy-safe BOM and product persistence"
          git push
