name: Fix ManagementPanel Jalali DatePicker Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-management-jalali-final.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch datepicker initialization
        shell: python
        run: |
          from pathlib import Path
          p = Path('templates/management.html')
          text = p.read_text(encoding='utf-8')

          old = '''function initJalaliPicker(el){if(!el||!window.jQuery||!jQuery.fn.persianDatepicker)return;const $el=jQuery(el);if($el.data('datepicker-initialized'))return;$el.persianDatepicker({format:'YYYY/MM/DD',initialValue:false,autoClose:true,observer:true,calendarType:'persian',toolbox:{enabled:true,todayButton:{enabled:true},submitButton:{enabled:false},calendarSwitch:{enabled:false}}});$el.data('datepicker-initialized',true)}
function initAllJalaliPickers(){document.querySelectorAll('.jalali-date').forEach(initJalaliPicker)}
'''

          new = '''function initJalaliPicker(el){
    if(!el||!window.jQuery)return;
    const $el=jQuery(el);
    if($el.data('datepicker-initialized'))return;

    const options={
        format:'YYYY/MM/DD',
        formatDate:'YYYY/MM/DD',
        initialValue:false,
        autoClose:true,
        observer:true,
        calendarType:'persian',
        toolbox:{enabled:true,todayButton:{enabled:true},submitButton:{enabled:false},calendarSwitch:{enabled:false}}
    };

    try{
        if(typeof $el.persianDatepicker==='function'){
            $el.persianDatepicker(options);
        }else if(typeof $el.pDatepicker==='function'){
            $el.pDatepicker(options);
        }else{
            return;
        }
        $el.data('datepicker-initialized',true);
    }catch(error){
        console.error('Management Jalali DatePicker init failed:',error);
    }
}

function initAllJalaliPickers(){
    document.querySelectorAll('.jalali-date').forEach(initJalaliPicker);
}
'''

          if old in text:
              text = text.replace(old,new,1)
          else:
              raise SystemExit('Expected initJalaliPicker block not found')

          old_open = "function openContract(){ $('contractModal').classList.add('open'); if(!$('contractProducts').children.length)addContractProduct() }"
          new_open = "function openContract(){ $('contractModal').classList.add('open'); if(!$('contractProducts').children.length)addContractProduct(); requestAnimationFrame(initAllJalaliPickers) }"
          if old_open in text:
              text = text.replace(old_open,new_open,1)

          old_init = "initAllJalaliPickers();\n(async()=>{try{await loadConfig();await loadData()}catch(e){alert('پیکربندی پنل مدیریت در Flow موجود نیست یا دسترسی ندارید.')}})();"
          new_init = "window.addEventListener('load',()=>{setTimeout(initAllJalaliPickers,0)});\ninitAllJalaliPickers();\n(async()=>{try{await loadConfig();await loadData()}catch(e){alert('پیکربندی پنل مدیریت در Flow موجود نیست یا دسترسی ندارید.')}})();"
          if old_init in text:
              text = text.replace(old_init,new_init,1)
          else:
              raise SystemExit('Expected final initialization block not found')

          p.write_text(text,encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -q "typeof \$el.persianDatepicker==='function'" templates/management.html
          grep -q "typeof \$el.pDatepicker==='function'" templates/management.html
          grep -q "requestAnimationFrame(initAllJalaliPickers)" templates/management.html
          grep -q "window.addEventListener('load'" templates/management.html
          git diff --check

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/management.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix ManagementPanel Jalali datepicker initialization'
          git push origin main
