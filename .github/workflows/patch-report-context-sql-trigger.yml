name: Patch report context SQL triggers

on:
  push:
    paths:
      - .github/workflows/patch-report-context-sql-trigger.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch report service
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("services/report_service.py")
          s = p.read_text(encoding="utf-8")
          marker = '        conn.commit()\n\n    finally:\n        conn.close()\n\n\ndef _flow_nodes(company_id):'
          insert = '''        conn.execute(\n            """\n            CREATE TRIGGER IF NOT EXISTS trg_report_context_contract\n            AFTER INSERT ON PLC_Data\n            WHEN LOWER(NEW.TagName) = 'contractcode'\n            BEGIN\n                UPDATE ReportHistory\n                SET ContractCode = CAST(NEW.Value AS TEXT)\n                WHERE ReportID = (\n                    SELECT ReportID\n                    FROM ReportHistory\n                    WHERE CompanyID = NEW.CompanyID\n                      AND TriggerRegister IS NOT NULL\n                      AND (ContractCode IS NULL OR TRIM(ContractCode) = '')\n                      AND datetime(Timestamp) >= datetime(NEW.Timestamp, '-10 seconds')\n                      AND datetime(Timestamp) <= datetime(NEW.Timestamp, '+2 seconds')\n                    ORDER BY ReportID DESC\n                    LIMIT 1\n                );\n            END\n            """\n        )\n\n        conn.execute(\n            """\n            CREATE TRIGGER IF NOT EXISTS trg_report_context_product\n            AFTER INSERT ON PLC_Data\n            WHEN LOWER(NEW.TagName) = 'productcode'\n            BEGIN\n                UPDATE ReportHistory\n                SET ProductCode = CAST(NEW.Value AS TEXT)\n                WHERE ReportID = (\n                    SELECT ReportID\n                    FROM ReportHistory\n                    WHERE CompanyID = NEW.CompanyID\n                      AND TriggerRegister IS NOT NULL\n                      AND (ProductCode IS NULL OR TRIM(ProductCode) = '')\n                      AND datetime(Timestamp) >= datetime(NEW.Timestamp, '-10 seconds')\n                      AND datetime(Timestamp) <= datetime(NEW.Timestamp, '+2 seconds')\n                    ORDER BY ReportID DESC\n                    LIMIT 1\n                );\n            END\n            """\n        )\n\n        conn.commit()\n\n    finally:\n        conn.close()\n\n\ndef _flow_nodes(company_id):'''
          if marker not in s:
              raise SystemExit("Patch marker not found; refusing to modify file")
          s = s.replace(marker, insert, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/report_service.py
          git commit -m "Fix report context backfill at database boundary"
          rm .github/workflows/patch-report-context-sql-trigger.yml
          git add -u .github/workflows/patch-report-context-sql-trigger.yml
          git commit -m "Remove temporary patch workflow"
          git push