name: patch-management-debug

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Add temporary ManagementPanel browser debug instrumentation') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch management debug logger
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('static/management_dropdowns.js')
          text = p.read_text(encoding='utf-8')
          marker = "  // SCADA_MANAGEMENT_DEBUG_V1"
          if marker in text:
              print('DEBUG ALREADY INSTALLED')
              raise SystemExit(0)

          needle = "})();"
          if needle not in text:
              raise SystemExit('management_dropdowns.js terminator not found')

          debug = r'''\n\n  // SCADA_MANAGEMENT_DEBUG_V1\n  // Browser-only diagnostic logger. Nothing is written to the server console.\n  (function installManagementDebugPanel(){\n    const root = document.createElement('div');\n    root.id = 'scada-management-debug';\n    root.dir = 'ltr';\n    Object.assign(root.style, {\n      position:'fixed', right:'12px', bottom:'12px', width:'min(720px,calc(100vw - 24px))',\n      maxHeight:'46vh', zIndex:'2147483647', background:'#0b0f14', color:'#d7e0ea',\n      border:'1px solid #4b5b6b', borderRadius:'10px', boxShadow:'0 12px 35px rgba(0,0,0,.55)',\n      fontFamily:'Consolas,monospace', fontSize:'12px', display:'flex', flexDirection:'column'\n    });\n\n    const head = document.createElement('div');\n    Object.assign(head.style,{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 10px',background:'#111923',borderBottom:'1px solid #334155'});\n    const title = document.createElement('b');\n    title.textContent = 'SCADA Management Debug';\n    const actions = document.createElement('div');\n    actions.style.display='flex'; actions.style.gap='6px';\n\n    function button(label, handler){\n      const b=document.createElement('button'); b.type='button'; b.textContent=label;\n      Object.assign(b.style,{border:'1px solid #52606d',background:'#1f2937',color:'#fff',borderRadius:'5px',padding:'4px 8px',cursor:'pointer'});\n      b.onclick=handler; actions.appendChild(b); return b;\n    }\n\n    const body=document.createElement('pre');\n    Object.assign(body.style,{margin:0,padding:'9px',overflow:'auto',whiteSpace:'pre-wrap',lineHeight:'1.45'});\n    head.appendChild(title); head.appendChild(actions); root.appendChild(head); root.appendChild(body);\n    document.body.appendChild(root);\n\n    const entries=[];\n    function redact(v){\n      if(v===undefined) return undefined;\n      try{ return JSON.parse(JSON.stringify(v)); }catch(_){ return String(v); }\n    }\n    function write(level,message,data){\n      const item={time:new Date().toISOString(),level,message,data:redact(data)};\n      entries.push(item);\n      if(entries.length>500) entries.shift();\n      body.textContent=entries.map(e=>{\n        const suffix=e.data===undefined?'':' | '+JSON.stringify(e.data);\n        return '['+e.time+'] '+e.level+' '+e.message+suffix;\n      }).join('\\n');\n      body.scrollTop=body.scrollHeight;\n      if(level==='ERROR') console.error('[SCADA MANAGEMENT DEBUG]',message,data);\n    }\n\n    button('CLEAR',()=>{entries.length=0; body.textContent='';});\n    button('COPY',async()=>{\n      const text=body.textContent;\n      try{await navigator.clipboard.writeText(text); write('INFO','Log copied to clipboard');}\n      catch(_){ write('ERROR','Clipboard copy failed'); }\n    });\n    button('DOWNLOAD',()=>{\n      const blob=new Blob([body.textContent],{type:'text/plain;charset=utf-8'});\n      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='management-debug.log'; a.click();\n      setTimeout(()=>URL.revokeObjectURL(a.href),1000);\n    });\n    button('HIDE',()=>{root.style.display='none';});\n\n    window.SCADA_MANAGEMENT_DEBUG = {\n      log:(m,d)=>write('INFO',m,d), error:(m,d)=>write('ERROR',m,d), dump:()=>write('INFO','STATE SNAPSHOT',{\n        companyId, calculations:state.managementCalculations, options:state.options,\n        calcFilters:getCalculationFilterValues(), calcFilterInitialized:state.calcFilterInitialized,\n        filterInputs:Array.from(document.querySelectorAll('[data-management-calculation-filter]')).map(x=>({id:x.id,name:x.getAttribute('data-management-calculation-filter'),value:x.value}))\n      })\n    };\n\n    function inspect(){\n      const grid=document.querySelector('.filters .grid');\n      const calcFields=grid ? Array.from(grid.querySelectorAll('.management-calculation-filter')).map(x=>({\n        name:x.dataset.calculationName, text:x.textContent.trim(), inputs:Array.from(x.querySelectorAll('input')).map(i=>({id:i.id,value:i.value}))\n      })) : [];\n      const result={\n        companyId, gridExists:!!grid, calcCount:state.managementCalculations.length, calculations:state.managementCalculations,\n        renderedCalculationFields:calcFields, currentCalcFilters:getCalculationFilterValues(),\n        loadDataExists:typeof window.loadData==='function', renderTableExists:typeof window.renderTable==='function',\n        lastData:window.__SCADA_MANAGEMENT_LAST_DATA, lastFilteredData:window.__SCADA_MANAGEMENT_LAST_FILTERED_DATA\n      };\n      write('INFO','DOM/STATE INSPECTION',result);\n    }\n\n    const originalFetch=window.fetch;\n    window.fetch=async function(){\n      const args=arguments; const requestUrl=String(args[0] && args[0].url ? args[0].url : args[0]);\n      const started=performance.now();\n      write('INFO','FETCH START',{url:requestUrl,method:(args[1]&&args[1].method)||'GET'});\n      try{\n        const response=await originalFetch.apply(this,args);\n        const cloned=response.clone(); let payload=null;\n        try{payload=await cloned.json();}catch(_){payload='[non-json]';}\n        write(response.ok?'INFO':'ERROR','FETCH END',{url:requestUrl,status:response.status,ms:Math.round(performance.now()-started),payload});\n        return response;\n      }catch(err){\n        write('ERROR','FETCH ERROR',{url:requestUrl,error:String(err)}); throw err;\n      }\n    };\n\n    const timer=setInterval(inspect,1500);\n    setTimeout(()=>clearInterval(timer),30000);\n    window.addEventListener('error',e=>write('ERROR','GLOBAL JS ERROR',{message:e.message,source:e.filename,line:e.lineno,column:e.colno}));\n    window.addEventListener('unhandledrejection',e=>write('ERROR','UNHANDLED PROMISE',{reason:String(e.reason)}));\n    write('INFO','DEBUG LOGGER INSTALLED',{companyId});\n    setTimeout(inspect,200);\n  })();\n'''

          text=text.replace(needle, debug+'\n'+needle, 1)
          p.write_text(text,encoding='utf-8')
          print('DEBUG PATCH APPLIED')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/management_dropdowns.js .github/workflows/patch-management-debug.yml
          git rm .github/workflows/patch-management-debug.yml
          git commit -m "Add browser-only ManagementPanel diagnostics"
          git push