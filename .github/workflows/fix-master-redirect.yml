name: Fix master login session and redirect

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix master login session and redirect
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("app.py")
          s = p.read_text(encoding="utf-8")

          # Master sessions must contain auth_login_time because is_logged_in()
          # validates it for every authenticated request.
          old_session = '''                session["company_id"] = None

                session.permanent = True'''

          new_session = '''                session["company_id"] = None
                session["auth_login_time"] = time.time()

                session.permanent = True'''

          if old_session in s and 'session["auth_login_time"] = time.time()' not in s[s.index(old_session):s.index(old_session) + 250]:
              s = s.replace(old_session, new_session, 1)
          elif 'session["auth_login_time"] = time.time()' not in s:
              raise SystemExit("Master session block was not found; no changes made.")

          # Master users always go to the Master Panel after successful login.
          old_redirect = '''                next_url = request.form.get(
                    "next"
                )

                if (
                    next_url
                    and next_url.startswith("/")
                ):

                    return redirect(
                        next_url
                    )

                return redirect(
                    url_for(
                        "master_companies"
                    )
                )'''

          new_redirect = '''                return redirect(
                    url_for(
                        "master_companies"
                    )
                )'''

          if old_redirect in s:
              s = s.replace(old_redirect, new_redirect, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix master session authentication and redirect" || exit 0
          git push

      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-master-redirect.yml
          git add .github/workflows/fix-master-redirect.yml
          git commit -m "Remove one-time master login fix workflow" || exit 0
          git push
