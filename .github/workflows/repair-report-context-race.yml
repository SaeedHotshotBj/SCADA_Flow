name: Repair ReportHistory context race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-report-context-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch /api/data report context backfill
        shell: python
        run: |
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = '# REPORT-CONTEXT-BACKFILL-V1'

          if marker in text:
              raise SystemExit('report context backfill already installed')

          start = text.find('def receive_edge_data():')
          if start < 0:
              raise SystemExit('receive_edge_data not found')

          end = text.find('\n\n# =====================================================', start + 10)
          if end < 0:
              raise SystemExit('receive_edge_data end anchor not found')

          section = text[start:end]
          anchor = '''        conn.commit()\n        cursor.close()\n        conn.close()\n'''
          if anchor not in section:
              raise SystemExit('api/data commit anchor not found')

          block = r'''        # REPORT-CONTEXT-BACKFILL-V1
        # Edge sends every TagMapper tag in a separate POST. A Trigger report
        # can therefore be created by B1/B2/B3 before ContractCode/ProductCode
        # arrives. When either context tag arrives, complete the newest
        # unfinished ReportHistory row belonging to the same company and
        # trigger register.
        context_tag = str(tag or "").strip()
        if context_tag.lower() in ("contractcode", "productcode"):
            try:
                report_columns = {
                    row["name"]
                    for row in conn.execute(
                        'PRAGMA table_info("ReportHistory")'
                    ).fetchall()
                }

                if {
                    "ReportID",
                    "Timestamp",
                    "TriggerRegister",
                    "ContractCode",
                    "ProductCode",
                }.issubset(report_columns):
                    trigger_register = None
                    try:
                        flow_json = get_company_flow(company_id)
                        if isinstance(flow_json, str):
                            flow_json = json.loads(flow_json)
                        nodes = (
                            flow_json.get("drawflow", {})
                            .get("Home", {})
                            .get("data", {})
                        ) if isinstance(flow_json, dict) else {}

                        for flow_node in nodes.values():
                            if not isinstance(flow_node, dict):
                                continue
                            if flow_node.get("name") != "TagMapper":
                                continue
                            mappings = (
                                flow_node.get("data", {}) or {}
                            ).get("mappings", [])
                            for mapping in mappings if isinstance(mappings, list) else []:
                                if not isinstance(mapping, dict):
                                    continue
                                if str(mapping.get("name", "")).strip().lower() == context_tag.lower():
                                    value = mapping.get("trigger_register")
                                    if value not in (None, ""):
                                        try:
                                            trigger_register = str(
                                                int(float(value))
                                            )
                                        except (TypeError, ValueError):
                                            trigger_register = str(value).strip()
                                    break
                            if trigger_register is not None:
                                break
                    except Exception as flow_error:
                        print(
                            "REPORT CONTEXT FLOW LOOKUP ERROR:",
                            flow_error,
                        )

                    field = (
                        "ContractCode"
                        if context_tag.lower() == "contractcode"
                        else "ProductCode"
                    )

                    query = f"""
                        SELECT
                            ReportID,
                            Timestamp,
                            TriggerRegister,
                            ContractCode,
                            ProductCode
                        FROM ReportHistory
                        WHERE CompanyID = ?
                          AND TriggerRegister IS NOT NULL
                          AND TRIM(COALESCE({field}, '')) = ''
                          AND datetime(Timestamp) >= datetime(?, '-15 seconds')
                          AND datetime(Timestamp) <= datetime(?, '+2 seconds')
                    """
                    params = [company_id, timestamp, timestamp]

                    if trigger_register is not None:
                        query += " AND CAST(TriggerRegister AS TEXT) = ?"
                        params.append(trigger_register)

                    query += " ORDER BY ReportID DESC LIMIT 1"
                    candidate = conn.execute(query, params).fetchone()

                    if candidate is not None:
                        old_value = candidate[field]
                        new_value = (
                            None
                            if value in (None, "")
                            else str(value).strip()
                        )

                        if new_value not in (None, ""):
                            conn.execute(
                                f"""
                                UPDATE ReportHistory
                                SET {field} = ?
                                WHERE ReportID = ?
                                  AND CompanyID = ?
                                  AND TRIM(COALESCE({field}, '')) = ''
                                """,
                                (
                                    new_value,
                                    int(candidate["ReportID"]),
                                    int(company_id),
                                ),
                            )
                            conn.commit()

                            delta_seconds = None
                            try:
                                incoming_dt = datetime.fromisoformat(
                                    str(timestamp).replace("Z", "")
                                )
                                report_dt = datetime.fromisoformat(
                                    str(candidate["Timestamp"]).replace("Z", "")
                                )
                                delta_seconds = (
                                    incoming_dt - report_dt
                                ).total_seconds()
                            except Exception:
                                pass

                            print(
                                "REPORT CONTEXT BACKFILL:",
                                "Company=", company_id,
                                "ReportID=", candidate["ReportID"],
                                "Field=", field,
                                "Value=", new_value,
                                "TriggerRegister=", candidate["TriggerRegister"],
                                "ContextTimestamp=", timestamp,
                                "ReportTimestamp=", candidate["Timestamp"],
                                "DeltaSeconds=", delta_seconds,
                            )

                            try:
                                verify = conn.execute(
                                    """
                                    SELECT ReportID, ContractCode, ProductCode
                                    FROM ReportHistory
                                    WHERE ReportID = ?
                                      AND CompanyID = ?
                                    """,
                                    (
                                        int(candidate["ReportID"]),
                                        int(company_id),
                                    ),
                                ).fetchone()
                                print(
                                    "REPORT CONTEXT BACKFILL VERIFIED:",
                                    dict(verify) if verify is not None else None,
                                )
                            except Exception as verify_error:
                                print(
                                    "REPORT CONTEXT BACKFILL VERIFY ERROR:",
                                    verify_error,
                                )
                    else:
                        print(
                            "REPORT CONTEXT BACKFILL NO MATCH:",
                            "Company=", company_id,
                            "Tag=", context_tag,
                            "Value=", value,
                            "TriggerRegister=", trigger_register,
                            "Timestamp=", timestamp,
                        )
            except Exception as context_error:
                print(
                    "REPORT CONTEXT BACKFILL ERROR:",
                    context_error,
                )

        conn.commit()
        cursor.close()
        conn.close()
'''

          section = section.replace(anchor, block, 1)
          text = text[:start] + section + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Syntax check patched app
        run: python -m py_compile app.py

      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Backfill report context when Edge context tags arrive'
          git push origin main
