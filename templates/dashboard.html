<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCADA LIVE DASHBOARD</title>
<script src="https://cdn.socket.io/4.7.5/dist/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%}body{background:#111827;color:#fff;font-family:Arial,sans-serif}.top-nav{height:58px;background:#0f172a;display:flex;align-items:center;gap:6px;padding:0 28px;border-bottom:1px solid #334155}.top-nav a{color:#cbd5e1;text-decoration:none;padding:10px 18px;border-radius:9px;font-size:14px;font-weight:600}.top-nav a:hover{background:#1e293b;color:#fff}.header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:#1f2937}.title{font-size:24px;font-weight:bold}.status{padding:8px 18px;border-radius:20px;font-weight:bold}.online{background:#166534;color:#bbf7d0}.offline{background:#7f1d1d;color:#fecaca}#dashboard{min-height:calc(100vh - 128px);padding:20px;display:flex;flex-direction:column;gap:20px}.dashboard-widget-row,.dashboard-machine-row{width:100%;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}.widget{width:220px;min-height:140px;background:#1f2937;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}.widget-title{font-size:17px;color:#d1d5db;margin-bottom:15px}.widget-value{font-size:34px;font-weight:bold;width:180px;height:42px;line-height:42px;text-align:center;white-space:nowrap;overflow:hidden}.widget-unit{margin-top:8px;color:#9ca3af;font-size:14px}.machine-card{width:230px;background:#1f2937;border:1px solid #374151;border-radius:16px;box-shadow:0 5px 18px rgba(0,0,0,.28);padding:14px;display:flex;flex-direction:column;gap:12px}.machine-header{display:flex;align-items:center;gap:10px;border-bottom:1px solid #374151;padding-bottom:10px}.machine-icon{width:48px;height:48px;border-radius:10px;background:#111827;display:flex;align-items:center;justify-content:center;font-size:28px;flex:0 0 auto}.machine-icon img{width:38px;height:38px;object-fit:contain}.machine-name{font-size:18px;font-weight:bold;flex:1}.machine-state{font-size:10px;padding:4px 7px;border-radius:10px;background:#374151;color:#d1d5db}.machine-state.online-state{background:#166534;color:#bbf7d0}.machine-parameters{display:grid;grid-template-columns:1fr;gap:7px}.machine-card.layout-2 .machine-parameters,.machine-card.layout-auto-compact .machine-parameters{grid-template-columns:repeat(2,minmax(0,1fr))}.machine-parameter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;background:#111827;border-radius:8px;padding:8px 9px;min-width:0;cursor:pointer}.machine-parameter-label{color:#d1d5db;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.machine-parameter-value{font-size:15px;font-weight:bold;white-space:nowrap}.machine-parameter-unit{color:#9ca3af;font-size:10px;margin-left:2px}.machine-empty,.empty{color:#9ca3af;text-align:center;padding:18px}.error-box{width:100%;padding:18px;background:#3f1d1d;border:1px solid #7f1d1d;border-radius:12px;color:#fecaca}@media(max-width:700px){#dashboard{padding:12px;gap:12px}.dashboard-widget-row,.dashboard-machine-row{gap:12px}.machine-card,.widget{width:100%}.machine-card.layout-2 .machine-parameters,.machine-card.layout-auto-compact .machine-parameters{grid-template-columns:1fr}.top-nav{padding:0 10px;overflow:auto}.top-nav a{padding:9px 12px;white-space:nowrap}}
</style>
</head>
<body>
<div class="top-nav"><a href="/dashboard">Dashboard</a><a href="/trend">Trend</a><a href="/report">Report</a><a href="/plc_control">PLC Control</a><a href="/management">Management Panel</a><a href="/logout">Logout</a></div>
<div class="header"><div class="title">SCADA LIVE DASHBOARD</div><div id="status" class="status offline">OFFLINE</div></div>
<div id="dashboard"></div>
<script>
const dashboardConfig={{ widgets|tojson }};
const socket=io({transports:["websocket","polling"],reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000,reconnectionDelayMax:5000});
const BUILTIN_ICONS={"builtin:factory":"🏭","builtin:machine":"⚙️","builtin:motor":"🔧","builtin:pump":"💧","builtin:fan":"🌀","builtin:heater":"🔥","builtin:power":"⚡","builtin:production":"📦","builtin:robot":"🤖","builtin:conveyor":"➡️","builtin:compressor":"🔩","builtin:warehouse":"🏢"};
function esc(v){const d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function iconHtml(icon,library){if(BUILTIN_ICONS[icon])return BUILTIN_ICONS[icon];let id=String(icon||"");if(id.indexOf("custom:")===0)id=id.slice(7);const item=Array.isArray(library)?library.find(x=>x&&String(x.id||"")===id):null;return item&&item.src?'<img src="'+esc(item.src)+'" alt="">':"🏭"}
function render(){const root=document.getElementById("dashboard");root.innerHTML="";const widgets=Array.isArray(dashboardConfig)?dashboardConfig:[];const widgetRow=document.createElement("div");const machineRow=document.createElement("div");widgetRow.className="dashboard-widget-row";machineRow.className="dashboard-machine-row";
widgets.filter(w=>w&&w._dashboard_type!=="machine"&&w._dashboard_type!=="machine_parameter").forEach(w=>{const tag=String(w.tag||"").trim();if(!tag)return;const plc=w.plc_id==null?"":String(w.plc_id);const node=document.createElement("div");node.className="widget";node.dataset.tag=tag;node.dataset.plcId=plc;node.innerHTML='<div class="widget-title">'+esc(w.title||tag)+'</div><div class="widget-value" data-value>--</div><div class="widget-unit">'+esc(w.unit||"")+'</div>';widgetRow.appendChild(node)});
widgets.filter(w=>w&&w._dashboard_type==="machine").forEach(item=>{const m=item.machine||{};const card=document.createElement("div");card.className="machine-card layout-"+String(m.layout||"auto");const params=Array.isArray(m.parameters)?m.parameters:[];let rows="";params.forEach(p=>{const tag=String(p&&p.tag||"").trim();if(!tag)return;const plc=p.plc_id==null?"":String(p.plc_id);rows+='<div class="machine-parameter" data-tag="'+esc(tag)+'" data-plc-id="'+esc(plc)+'"><div class="machine-parameter-label">'+esc(p.label||tag)+'</div><div class="machine-parameter-value"><span data-value>--</span><span class="machine-parameter-unit">'+esc(p.unit||"")+'</span></div></div>'});if(!rows)rows='<div class="machine-empty">No machine parameters configured.</div>';card.innerHTML='<div class="machine-header"><div class="machine-icon">'+iconHtml(m.icon,item.icon_library)+'</div><div class="machine-name">'+esc(m.name||m.id||"Machine")+'</div><div class="machine-state" data-machine-state>WAITING</div></div><div class="machine-parameters">'+rows+'</div>';machineRow.appendChild(card)});
if(widgetRow.children.length)root.appendChild(widgetRow);if(machineRow.children.length)root.appendChild(machineRow);if(!widgetRow.children.length&&!machineRow.children.length)root.innerHTML='<div class="empty">No dashboard widgets configured in Flow.</div>'}
function setOnline(){const s=document.getElementById("status");s.textContent="ONLINE";s.className="status online";document.querySelectorAll("[data-machine-state]").forEach(e=>{e.textContent="ONLINE";e.classList.add("online-state")})}
function setOffline(){const s=document.getElementById("status");s.textContent="OFFLINE";s.className="status offline";document.querySelectorAll("[data-machine-state]").forEach(e=>{e.textContent="OFFLINE";e.classList.remove("online-state")})}
function apply(tag,value,plcId){if(value===null||value===undefined)return;const normal=String(tag).toLowerCase(),pid=plcId==null?"":String(plcId);document.querySelectorAll("[data-tag]").forEach(row=>{const rowPid=String(row.dataset.plcId||"");if(normal===String(row.dataset.tag||"").toLowerCase()&&(pid===""||rowPid===pid)){const target=row.querySelector("[data-value]");if(target)target.textContent=String(value)}})}
function applyAll(data){if(!data){setOffline();return}if(Array.isArray(data.TagValues)){data.TagValues.forEach(item=>apply(item.TagName,item.Value,item.PLC_ID))}else{Object.keys(data.Tags||{}).forEach(k=>apply(k,data.Tags[k],null))}if(data.Online===true)setOnline();else setOffline()}
socket.on("disconnect",setOffline);socket.on("tag_update",d=>{if(d&&Array.isArray(d.TagValues)){applyAll(d)}else if(d&&d.Tag){apply(d.Tag,d.Value,d.PLC_ID);if(d.Online===true)setOnline()}});socket.on("connect_error",setOffline);
async function latest(){try{const r=await fetch("/dashboard/latest_plc?t="+Date.now(),{cache:"no-store",credentials:"same-origin"});if(!r.ok)throw new Error("HTTP "+r.status);applyAll(await r.json())}catch(e){console.error("DASHBOARD DATA ERROR",e);setOffline()}}
render();latest();setInterval(latest,1000);
</script>
<script src="/static/dashboard_machine_trend.js?v=20260912"></script>
</body>
</html>
