<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>SCADA LIVE DASHBOARD</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    body { background: #111827; color: white; font-family: Arial, sans-serif; }

    .header {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 25px;
        background: #1f2937;
    }

    .title { font-size: 24px; font-weight: bold; }

    .status {
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
    }

    .online { background: #166534; color: #bbf7d0; }
    .offline { background: #7f1d1d; color: #fecaca; }

    #dashboard {
        position: relative;
        min-height: calc(100vh - 70px);
    }

    .widget {
        position: absolute;
        width: 220px;
        height: 140px;
        background: #1f2937;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }

    .widget-title {
        font-size: 17px;
        color: #d1d5db;
        margin-bottom: 15px;
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }

    .widget-value {
        font-size: 34px;
        font-weight: bold;
        color: white;
        width: 120px;
        height: 42px;
        line-height: 42px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }

    .widget-unit {
        margin-top: 8px;
        color: #9ca3af;
        font-size: 14px;
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }

    #dashboard,
    #dashboard *,
    #dashboard *::before,
    #dashboard *::after {
        transition: none !important;
        animation: none !important;
        transform: none !important;
    }

</style>

</head>

<body>

{% include "nav.html" %}

<div class="header">

    <div class="title">SCADA LIVE DASHBOARD</div>

    <div id="status" class="status offline">OFFLINE</div>

</div>

<div id="dashboard">

{% for widget in widgets %}

<div
    class="widget"
    id="widget_{{ widget.tag }}"
    style="
        left: {{ loop.index0 % 4 * 260 + 20 }}px;
        top: {{ (loop.index0 // 4) * 180 + 20 }}px;
    "
>

    <div class="widget-title">
        {{ widget.title if widget.title else widget.tag }}
    </div>

    <div class="widget-value" id="value_{{ widget.tag }}">0</div>

    <div class="widget-unit">
        {{ widget.unit if widget.unit else "" }}
    </div>

</div>

{% endfor %}

{% if not widgets %}
<div style="padding: 30px;">No dashboard widgets configured in flow.</div>
{% endif %}

</div>

<script>

// =====================================================
// LIVE DATA POLICY
// =====================================================
//
// DashboardOutput controls the Edge timeout on the server.
// Between Edge transmissions the last value is preserved.
// When the configured timeout expires, the server returns
// zero for the stale Edge parameters.
//
// The browser has no fixed value timeout anymore.
// =====================================================

// =====================================================
// SOCKET.IO
// =====================================================

const socket = io({
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000
});

// =====================================================
// UPDATE ONE CARD
// =====================================================

function updateCard(tag, value) {

    if (!tag) {
        return;
    }

    const element = document.getElementById("value_" + tag);

    if (!element) {
        console.warn("Dashboard widget not found:", tag);
        return;
    }

    // null/undefined means no value. It must never replace
    // an existing valid value with zero.
    if (value === null || value === undefined) {
        return;
    }

    const newValue = String(value);

    if (element.textContent !== newValue) {
        element.textContent = newValue;
    }
}

// =====================================================
// CLEAR ALL VALUES
// =====================================================

function clearDashboardValues() {

    document.querySelectorAll(".widget-value").forEach(function (element) {

        if (element.id.startsWith("value_")) {
            element.textContent = "0";
        }

    });
}

// =====================================================
// ONLINE
// =====================================================

function setOnline() {

    const status = document.getElementById("status");

    if (!status) {
        return;
    }

    status.textContent = "ONLINE";
    status.classList.remove("offline");
    status.classList.add("online");
}

// =====================================================
// OFFLINE
// =====================================================

function setOffline() {

    const status = document.getElementById("status");

    if (!status) {
        return;
    }

    status.textContent = "OFFLINE";
    status.classList.remove("online");
    status.classList.add("offline");

    // IMPORTANT: offline status alone never clears cards.
}

// =====================================================
// APPLY SERVER LATEST DATA
// =====================================================

function applyLatestData(data) {

    if (!data) {
        setOffline();
        return;
    }

    const tags = data.Tags || {};

    Object.keys(tags).forEach(function (tag) {

        updateCard(tag, tags[tag]);

    });

    if (data.Online === true) {
        setOnline();
    } else {
        setOffline();
    }
}

// =====================================================
// SOCKET CONNECT
// =====================================================

socket.on("connect", function () {

    console.log("Dashboard Socket.IO connected");

});

// =====================================================
// SOCKET DISCONNECT
// =====================================================

socket.on("disconnect", function () {

    console.log("Dashboard Socket.IO disconnected");

    // Browser Socket.IO disconnect does not mean Edge is offline.
    // Keep the last values visible.
    setOffline();

});

// =====================================================
// SOCKET TAG UPDATE
// =====================================================

socket.on("tag_update", function (data) {

    console.log("TAG UPDATE RECEIVED:", data);

    if (!data || data.Online !== true) {
        return;
    }

    const tag = data.Tag;

    if (!tag) {
        return;
    }

    // Zero is a valid PLC value and must be displayed.
    if (data.Value === null || data.Value === undefined) {
        return;
    }

    updateCard(tag, data.Value);
    setOnline();

});

// =====================================================
// SOCKET ERROR
// =====================================================

socket.on("connect_error", function (error) {

    console.error("Socket.IO connection error:", error);

});

// =====================================================
// LOAD LATEST VALUES
// =====================================================

async function loadLatestValues() {

    try {

        const response = await fetch(
            "/dashboard/latest?t=" + Date.now(),
            {
                method: "GET",
                cache: "no-store",
                headers: {
                    "Cache-Control": "no-cache",
                    "Pragma": "no-cache"
                }
            }
        );

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("LATEST DASHBOARD DATA:", data);

        applyLatestData(data);

    }
    catch (error) {

        console.error("DASHBOARD DATA ERROR:", error);

        // Keep last values when the dashboard request itself fails.
        setOffline();

    }

}

// =====================================================
// INITIAL LOAD
// =====================================================

loadLatestValues();

// =====================================================
// SERVER TIMEOUT CHECK
// =====================================================
//
// The server evaluates DashboardOutput.timeout on every
// request. Polling once per second makes the zero appear
// within approximately one second after the configured
// timeout expires.
//

setInterval(loadLatestValues, 1000);

</script>

</body>

</html>
