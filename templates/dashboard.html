
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>SCADA LIVE DASHBOARD</title>

    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>

        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: #1f2937;
            box-sizing: border-box;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
        }

        .status {
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
        }

        .online {
            background: #166534;
            color: #bbf7d0;
        }

        .offline {
            background: #7f1d1d;
            color: #fecaca;
        }

        #dashboard {
            position: relative;
            min-height: calc(100vh - 70px);
        }

        .widget {
            position: absolute;

            width: 220px;
            height: 140px;

            background: #1f2937;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.3);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
        }

        .widget-title {
            font-size: 17px;
            color: #d1d5db;
            margin-bottom: 15px;
        }

        .widget-value {
            font-size: 34px;
            font-weight: bold;
        }

        .widget-unit {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 14px;
        }

    </style>

</head>


<body>
    {% include "nav.html" %}

    <div class="header">

        <div class="title">
            SCADA LIVE DASHBOARD
        </div>

        <div
            id="status"
            class="status offline"
        >
            OFFLINE
        </div>

    </div>


    <div id="dashboard">

        {% for widget in widgets %}

        <div
            class="widget"
            id="widget_{{ widget.tag }}"

            style="
                left: {{ loop.index0 % 4 * 260 + 20 }}px;
                top: {{ (loop.index0 // 4) * 180 + 20 }}px;
            "
        >

            <div class="widget-title">

                {{ widget.title if widget.title else widget.tag }}

            </div>


            <div
                class="widget-value"
                id="value_{{ widget.tag }}"
            >
                0
            </div>


            <div class="widget-unit">

                {{ widget.unit if widget.unit else "" }}

            </div>

        </div>

        {% endfor %}


        {% if not widgets %}

        <div style="padding: 30px;">

            No dashboard widgets configured in flow.

        </div>

        {% endif %}

    </div>


<script>


// =====================================================
// SOCKET.IO CONNECTION
// =====================================================

const socket = io();


// =====================================================
// CONNECTION
// =====================================================

socket.on("connect", function () {

    console.log(
        "Dashboard Socket.IO connected"
    );

});


// =====================================================
// DISCONNECTION
// =====================================================

socket.on("disconnect", function () {

    console.log(
        "Dashboard Socket.IO disconnected"
    );

    setOffline();

});


// =====================================================
// SERVER SENDS NEW TAG VALUE
// =====================================================

socket.on("tag_update", function (data) {

    console.log(
        "TAG UPDATE RECEIVED:",
        data
    );


    if (!data) {
        return;
    }


    const tag = data.Tag;

    const value = data.Value;


    if (!tag) {
        return;
    }


    // ---------------------------------------------
    // FIND VALUE ELEMENT
    // ---------------------------------------------

    const element = document.getElementById(
        "value_" + tag
    );


    if (!element) {

        console.warn(
            "Dashboard widget not found:",
            tag
        );

        return;
    }


    // ---------------------------------------------
    // UPDATE VALUE IMMEDIATELY
    // ---------------------------------------------

    element.textContent = value;


    // ---------------------------------------------
    // ONLINE
    // ---------------------------------------------

    setOnline();


    // ---------------------------------------------
    // OPTIONAL DEBUG
    // ---------------------------------------------

    console.log(
        "DASHBOARD UPDATED:",
        tag,
        value
    );

});


// =====================================================
// ONLINE STATUS
// =====================================================

function setOnline() {

    const status =
        document.getElementById("status");


    status.textContent = "ONLINE";


    status.classList.remove(
        "offline"
    );


    status.classList.add(
        "online"
    );

}


// =====================================================
// OFFLINE STATUS
// =====================================================

function setOffline() {

    const status =
        document.getElementById("status");


    status.textContent = "OFFLINE";


    status.classList.remove(
        "online"
    );


    status.classList.add(
        "offline"
    );

}


// =====================================================
// INITIAL LATEST VALUES
// =====================================================
//
// This is only for loading the current values
// when the dashboard is opened.
//
// After that, Socket.IO handles live updates.
// =====================================================

async function loadLatestValues() {

    try {

        const response =
            await fetch(
                "/dashboard/latest"
            );


        if (!response.ok) {

            throw new Error(
                "Latest values request failed"
            );

        }


        const data =
            await response.json();


        console.log(
            "INITIAL DASHBOARD DATA:",
            data
        );


        if (
            data &&
            data.Tags
        ) {

            for (
                const tag in data.Tags
            ) {

                const element =
                    document.getElementById(
                        "value_" + tag
                    );


                if (!element) {
                    continue;
                }


                element.textContent =
                    data.Tags[tag];

            }


            if (
                Object.keys(data.Tags).length > 0
            ) {

                setOnline();

            }

        }


    }
    catch (error) {

        console.error(
            "DASHBOARD INITIAL DATA ERROR:",
            error
        );

    }

}


// =====================================================
// LOAD INITIAL VALUES
// =====================================================

loadLatestValues();


</script>


</body>

</html>
