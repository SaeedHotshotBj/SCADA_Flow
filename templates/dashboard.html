<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<title>SCADA LIVE DASHBOARD</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .header {
        height: 70px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 25px;

        background: #1f2937;
    }

    .title {
        font-size: 24px;
        font-weight: bold;
    }

    .status {
        padding: 8px 18px;
        border-radius: 20px;
        font-weight: bold;
    }

    .online {
        background: #166534;
        color: #bbf7d0;
    }

    .offline {
        background: #7f1d1d;
        color: #fecaca;
    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    #dashboard {
        position: relative;
        min-height: calc(100vh - 70px);
    }


    /* =====================================================
       CARD
       ===================================================== */

    .widget {
        position: absolute;

        width: 220px;
        height: 140px;

        background: #1f2937;

        border-radius: 12px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        /*
         * ABSOLUTELY NO ANIMATION
         */

        transition: none !important;
        animation: none !important;
        transform: none !important;
    }


    /* =====================================================
       TITLE
       ===================================================== */

    .widget-title {
        font-size: 17px;

        color: #d1d5db;

        margin-bottom: 15px;

        transition: none !important;
        animation: none !important;
        transform: none !important;
    }


    /* =====================================================
       VALUE
       ===================================================== */

    .widget-value {
        font-size: 34px;

        font-weight: bold;

        color: white;

        width: 120px;
        height: 42px;

        line-height: 42px;

        text-align: center;

        white-space: nowrap;

        overflow: hidden;

        transition: none !important;
        animation: none !important;
        transform: none !important;
    }


    /* =====================================================
       UNIT
       ===================================================== */

    .widget-unit {
        margin-top: 8px;

        color: #9ca3af;

        font-size: 14px;

        transition: none !important;
        animation: none !important;
        transform: none !important;
    }


    /*
     * Disable every possible animation inside dashboard.
     */

    #dashboard,
    #dashboard *,
    #dashboard *::before,
    #dashboard *::after {

        transition: none !important;
        animation: none !important;
        transform: none !important;

    }

</style>


</head>

<body>

{% include "nav.html" %}

<!-- =====================================================
     HEADER
     ===================================================== -->

<div class="header">


<div class="title">
    SCADA LIVE DASHBOARD
</div>

<div
    id="status"
    class="status offline"
>
    OFFLINE
</div>


</div>

<!-- =====================================================
     DASHBOARD
     ===================================================== -->

<div id="dashboard">


{% for widget in widgets %}

<div
    class="widget"
    id="widget_{{ widget.tag }}"

    style="
        left: {{ loop.index0 % 4 * 260 + 20 }}px;
        top: {{ (loop.index0 // 4) * 180 + 20 }}px;
    "
>

    <div class="widget-title">

        {{ widget.title if widget.title else widget.tag }}

    </div>


    <div
        class="widget-value"
        id="value_{{ widget.tag }}"
    >
        0
    </div>


    <div class="widget-unit">

        {{ widget.unit if widget.unit else "" }}

    </div>

</div>

{% endfor %}


{% if not widgets %}

<div style="padding: 30px;">

    No dashboard widgets configured in flow.

</div>

{% endif %}


</div>

<script>


// =====================================================
// SOCKET.IO
// =====================================================

const socket = io({
    transports: ["websocket", "polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000
});


// =====================================================
// UPDATE ONE CARD
// =====================================================

function updateCard(tag, value) {

    if (!tag) {
        return;
    }


    const element =
        document.getElementById(
            "value_" + tag
        );


    if (!element) {

        console.warn(
            "Dashboard widget not found:",
            tag
        );

        return;

    }


    const newValue =
        String(
            value === null ||
            value === undefined
                ? ""
                : value
        );


    /*
     * Change ONLY the text.
     *
     * The card itself is never touched.
     */

    if (
        element.textContent !== newValue
    ) {

        element.textContent = newValue;

    }

}


// =====================================================
// SOCKET CONNECT
// =====================================================

socket.on("connect", function () {

    console.log(
        "Dashboard Socket.IO connected"
    );

    setOnline();

});


// =====================================================
// SOCKET DISCONNECT
// =====================================================

socket.on("disconnect", function () {

    console.log(
        "Dashboard Socket.IO disconnected"
    );

});


// =====================================================
// SOCKET TAG UPDATE
// =====================================================

socket.on("tag_update", function (data) {

    console.log(
        "TAG UPDATE RECEIVED:",
        data
    );


    if (!data) {
        return;
    }


    updateCard(
        data.Tag,
        data.Value
    );


    setOnline();

});


// =====================================================
// SOCKET ERROR
// =====================================================

socket.on("connect_error", function (error) {

    console.error(
        "Socket.IO connection error:",
        error
    );

});


// =====================================================
// ONLINE
// =====================================================

function setOnline() {

    const status =
        document.getElementById("status");


    if (!status) {
        return;
    }


    status.textContent = "ONLINE";


    status.classList.remove(
        "offline"
    );


    status.classList.add(
        "online"
    );

}


// =====================================================
// OFFLINE
// =====================================================

function setOffline() {

    const status =
        document.getElementById("status");


    if (!status) {
        return;
    }


    status.textContent = "OFFLINE";


    status.classList.remove(
        "online"
    );


    status.classList.add(
        "offline"
    );

}


// =====================================================
// LOAD LATEST VALUES
// =====================================================

async function loadLatestValues() {

    try {

        const response =
            await fetch(
                "/dashboard/latest?t="
                + Date.now(),
                {
                    method: "GET",

                    cache: "no-store",

                    headers: {
                        "Cache-Control": "no-cache",
                        "Pragma": "no-cache"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "LATEST DASHBOARD DATA:",
            data
        );


        if (
            !data ||
            !data.Tags
        ) {

            return;

        }


        /*
         * Update every dashboard card.
         *
         * Only the value text changes.
         */

        for (
            const tag in data.Tags
        ) {

            updateCard(
                tag,
                data.Tags[tag]
            );

        }


        if (
            Object.keys(data.Tags).length > 0
        ) {

            setOnline();

        }

    }
    catch (error) {

        console.error(
            "DASHBOARD DATA ERROR:",
            error
        );

    }

}


// =====================================================
// INITIAL LOAD
// =====================================================

loadLatestValues();


// =====================================================
// AUTOMATIC LIVE REFRESH
// =====================================================
//
// This is the important part.
//
// The browser asks the server for the latest values
// every 1 second.
//
// Therefore the dashboard does NOT require a manual
// page refresh.
//
// Socket.IO can update the values immediately when
// available, while this provides a reliable fallback.
//

setInterval(
    loadLatestValues,
    1000
);


</script>

</body>

</html>
