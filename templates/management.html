<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت قرارداد و تولید</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191d;color:#eee;font-family:Tahoma,Arial,sans-serif}.top{padding:18px 24px;background:#1d2329;border-bottom:1px solid #39414a;display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0;font-size:21px}.top small{color:#9aa5af}.wrap{padding:20px;max-width:1800px;margin:auto}.toolbar,.filters,.modal-card{background:#20262c;border:1px solid #3d4650;border-radius:10px;padding:16px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #52606d;background:#2c353e;color:#fff;border-radius:7px;padding:9px 14px;cursor:pointer}.btn.primary{background:#1677ff;border-color:#1677ff}.btn.good{background:#216e48}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px}.field label{display:block;color:#b9c1c8;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border-radius:6px;border:1px solid #505b65;background:#13171b;color:#fff}.field textarea{min-height:70px;resize:vertical}.filter-actions{display:flex;gap:8px;margin-top:12px}.table-wrap{overflow:auto;background:#20262c;border:1px solid #3d4650;border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{border-bottom:1px solid #343d46;padding:8px;text-align:right;vertical-align:top}.table th{background:#2a323a;color:#cfd6dc;position:sticky;top:0}.muted{color:#8e99a3}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.open{display:flex}.modal-card{width:min(1100px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0;font-size:18px}.products-table{width:100%;border-collapse:collapse;margin-top:12px}.products-table th,.products-table td{border:1px solid #3b444d;padding:6px}.products-table input{width:100%;padding:7px;background:#15191d;border:1px solid #4b5661;color:#fff;border-radius:5px}.summary{padding:8px 0;color:#9ca7b0;font-size:13px}.tag-list{white-space:pre-wrap;max-width:260px}.status{position:fixed;left:18px;bottom:18px;padding:10px 14px;border-radius:8px;background:#252d34;border:1px solid #48545f;display:none}.status.show{display:block}.jalali-date{direction:ltr;text-align:center;cursor:pointer}.datepicker-plot-area{z-index:10000!important}.datepicker-plot-area .datepicker-time-view{display:block!important}
</style>
</head>
<body>
<div class="top"><div><h1>پنل مدیریت قرارداد و محصولات</h1><small>Company ID: {{ company_id }} — محاسبات مدیریتی از Flow گرفته می‌شوند.</small></div><a class="btn" href="/dashboard">داشبورد</a></div>
<div class="wrap">
  <div class="toolbar"><button class="btn primary" onclick="openContract()">قرارداد جدید</button><button class="btn good" onclick="openProduct()">محصول / BOM</button><button class="btn" onclick="loadData()">بروزرسانی</button></div>
  <div class="filters"><div class="grid">
    <div class="field"><label>کد قرارداد</label><input id="contract_code"></div>
    <div class="field"><label>نام قرارداد</label><input id="contract_name"></div>
    <div class="field"><label>کد محصول</label><input id="product_code"></div>
    <div class="field"><label>نوع محصول</label><input id="product_name"></div>
    <div class="field"><label>تاریخ عقد از</label><input id="contract_date_from" class="jalali-date" placeholder="1405/06/01" autocomplete="off" readonly></div>
    <div class="field"><label>تاریخ عقد تا</label><input id="contract_date_to" class="jalali-date" placeholder="1405/06/31" autocomplete="off" readonly></div>
    <div class="field"><label>تاریخ تحویل از</label><input id="delivery_date_from" class="jalali-date" placeholder="1405/07/01" autocomplete="off" readonly></div>
    <div class="field"><label>تاریخ تحویل تا</label><input id="delivery_date_to" class="jalali-date" placeholder="1405/07/31" autocomplete="off" readonly></div>
    <div class="field"><label>حداقل مقدار سفارش</label><input id="min_ordered" type="number" step="any"></div>
    <div class="field"><label>حداکثر مقدار سفارش</label><input id="max_ordered" type="number" step="any"></div>
    <div class="field"><label>توضیحات</label><input id="description"></div>
  </div><div class="filter-actions"><button class="btn primary" onclick="loadData()">اعمال فیلتر</button><button class="btn" onclick="clearFilters()">پاک کردن</button></div></div>
  <div class="summary" id="summary"></div><div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</div>
<div class="modal" id="contractModal"><div class="modal-card"><div class="modal-head"><h2>قرارداد جدید</h2><button class="btn" onclick="closeModal('contractModal')">بستن</button></div>
  <div class="grid"><div class="field"><label>کد قرارداد</label><input id="new_contract_code"></div><div class="field"><label>تاریخ عقد قرارداد (شمسی)</label><input id="new_contract_date" class="jalali-date" placeholder="1405/06/10" autocomplete="off" readonly></div><div class="field"><label>نام قرارداد</label><input id="new_contract_name"></div><div class="field"><label>توضیحات</label><textarea id="new_contract_description"></textarea></div></div>
  <div class="summary">محصولات سفارشی</div><table class="products-table"><thead><tr><th>کد محصول</th><th>نام محصول</th><th>مقدار سفارش</th><th>واحد</th><th>تاریخ تحویل</th><th>توضیحات</th><th></th></tr></thead><tbody id="contractProducts"></tbody></table>
  <div class="filter-actions"><button class="btn" onclick="addContractProduct()">+ افزودن محصول</button><button class="btn primary" onclick="saveContract()">ذخیره قرارداد</button></div>
</div></div>
<div class="modal" id="productModal"><div class="modal-card"><div class="modal-head"><h2>محصول و BOM</h2><button class="btn" onclick="closeModal('productModal')">بستن</button></div>
  <div class="grid"><div class="field"><label>کد محصول</label><input id="bom_product_code"></div><div class="field"><label>نام محصول</label><input id="bom_product_name"></div><div class="field"><label>واحد</label><input id="bom_unit"></div><div class="field"><label>هزینه BOM به ازای kg</label><input id="cost_per_kg" type="number" step="any"></div><div class="field"><label>هزینه BOM به ازای meter</label><input id="cost_per_meter" type="number" step="any"></div><div class="field"><label>توضیحات BOM</label><textarea id="bom_notes"></textarea></div></div>
  <div class="filter-actions"><button class="btn primary" onclick="saveProduct()">ذخیره محصول/BOM</button></div><div class="summary">محصولات موجود</div><div class="table-wrap"><table class="table"><thead><tr><th>کد</th><th>محصول</th><th>واحد</th><th>kg</th><th>meter</th><th>یادداشت</th></tr></thead><tbody id="productsBody"></tbody></table></div>
</div></div>
<div class="status" id="status"></div>
<script>
const COMPANY_ID={{ company_id|tojson }};let config={};let productCache=[];function byId(id){return document.getElementById(id)}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}function showStatus(msg){const el=byId('status');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000)}function closeModal(id){byId(id).classList.remove('open')}
function initJalaliPicker(el){if(!el||!window.jQuery||typeof jQuery.fn.pDatepicker!=='function')return;const $el=jQuery(el);if($el.data('datepicker-ready'))return;$el.pDatepicker({format:'YYYY/MM/DD',initialValue:false,autoClose:true,observer:true,calendarType:'persian',responsive:true,position:'auto',toolbox:{enabled:true,todayButton:{enabled:true},submitButton:{enabled:false},calendarSwitch:{enabled:false}}});$el.data('datepicker-ready',true)}
function initAllJalaliPickers(){if(!window.jQuery||typeof jQuery.fn.pDatepicker!=='function')return;document.querySelectorAll('.jalali-date').forEach(initJalaliPicker)}
function openContract(){byId('contractModal').classList.add('open');if(!byId('contractProducts').children.length)addContractProduct();setTimeout(initAllJalaliPickers,150)}
function openProduct(){byId('productModal').classList.add('open');renderProducts()}
function addContractProduct(){const tr=document.createElement('tr');tr.innerHTML='<td><input data-k="product_code"></td><td><input data-k="product_name"></td><td><input data-k="ordered_quantity" type="number" step="any"></td><td><input data-k="unit"></td><td><input data-k="delivery_date" class="jalali-date" placeholder="1405/07/01" autocomplete="off" readonly></td><td><input data-k="description"></td><td><button class="btn" type="button">حذف</button></td>';tr.querySelector('button').onclick=()=>tr.remove();byId('contractProducts').appendChild(tr);setTimeout(initAllJalaliPickers,150)}
function readContractProducts(){return [...byId('contractProducts').rows].map(tr=>{const o={};tr.querySelectorAll('[data-k]').forEach(i=>o[i.dataset.k]=i.value.trim());return o}).filter(x=>x.product_code&&x.product_name)}async function saveContract(){const payload={contract_code:byId('new_contract_code').value.trim(),contract_date:byId('new_contract_date').value.trim(),contract_name:byId('new_contract_name').value.trim(),description:byId('new_contract_description').value.trim(),products:readContractProducts()};try{const r=await fetch('/management/contracts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.message||'خطا');showStatus('قرارداد ذخیره شد');closeModal('contractModal');['new_contract_code','new_contract_date','new_contract_name','new_contract_description'].forEach(id=>byId(id).value='');byId('contractProducts').innerHTML='';loadData()}catch(e){alert(e.message)}}async function saveProduct(){const payload={product_code:byId('bom_product_code').value.trim(),product_name:byId('bom_product_name').value.trim(),unit:byId('bom_unit').value.trim(),cost_per_kg:byId('cost_per_kg').value,cost_per_meter:byId('cost_per_meter').value,notes:byId('bom_notes').value.trim()};try{const r=await fetch('/management/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.message||'خطا');showStatus('محصول و BOM ذخیره شد');await loadConfig();['bom_product_code','bom_product_name','bom_unit','cost_per_kg','cost_per_meter','bom_notes'].forEach(id=>byId(id).value='')}catch(e){alert(e.message)}}async function loadConfig(){const r=await fetch('/management/config?company_id='+encodeURIComponent(COMPANY_ID),{cache:'no-store'});if(!r.ok)throw Error('config');config=await r.json();productCache=config.products||[];renderProducts()}function renderProducts(){const body=byId('productsBody');body.innerHTML=productCache.map(p=>'<tr><td>'+esc(p.ProductCode)+'</td><td>'+esc(p.ProductName)+'</td><td>'+esc(p.Unit)+'</td><td>'+esc(p.CostPerKg)+'</td><td>'+esc(p.CostPerMeter)+'</td><td>'+esc(p.BOMNotes)+'</td></tr>').join('')}function params(){const p=new URLSearchParams();['contract_code','contract_name','product_code','product_name','contract_date_from','contract_date_to','delivery_date_from','delivery_date_to','min_ordered','max_ordered','description'].forEach(id=>{const v=byId(id).value.trim();if(v)p.set(id,v)});p.set('company_id',COMPANY_ID);return p}async function loadData(){try{const r=await fetch('/management/data?'+params().toString(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'خطا');renderTable(d);byId('summary').textContent='تعداد ردیف: '+d.count}catch(e){alert(e.message)}}function renderTable(data){const th=byId('thead'),tb=byId('tbody');th.innerHTML='';tb.innerHTML='';if(!data.columns?.length)return;th.innerHTML='<tr>'+data.columns.map(c=>'<th>'+esc(c.label)+(c.unit?' ('+esc(c.unit)+')':'')+'</th>').join('')+'</tr>';tb.innerHTML=(data.rows||[]).map(row=>'<tr>'+data.columns.map(c=>'<td class="tag-list">'+formatValue(row[c.key])+'</td>').join('')+'</tr>').join('')}function formatValue(v){if(Array.isArray(v))return v.map(x=>esc(x)).join(', ');if(v===null||v===undefined||v==='')return '<span class="muted">—</span>';if(typeof v==='number')return esc(Number.isInteger(v)?v:v.toFixed(3));return esc(v)}function clearFilters(){['contract_code','contract_name','product_code','product_name','contract_date_from','contract_date_to','delivery_date_from','delivery_date_to','min_ordered','max_ordered','description'].forEach(id=>byId(id).value='');loadData()}
function bootManagementDatePicker(){const start=Date.now();const timer=setInterval(()=>{initAllJalaliPickers();if(window.jQuery&&typeof jQuery.fn.pDatepicker==='function')clearInterval(timer);if(Date.now()-start>10000)clearInterval(timer)},100);setTimeout(initAllJalaliPickers,0);}
bootManagementDatePicker();
(async()=>{try{await loadConfig();await loadData()}catch(e){alert('پیکربندی پنل مدیریت در Flow موجود نیست یا دسترسی ندارید.')}})();
</script>
</body></html>
