<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA FLOW EDITOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#eee;overflow:hidden}
#toolbar{height:105px;background:#1b1b1b;border-bottom:1px solid #333;padding:7px;overflow:auto}
.row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
button,select,input{font:inherit}
button{padding:7px 11px;border:1px solid #555;background:#292929;color:#fff;border-radius:4px;cursor:pointer}
button:hover{background:#444}
input,select{padding:7px;background:#111;color:#fff;border:1px solid #555;border-radius:4px}
#company_select{min-width:220px}.company-name{width:220px}.info{color:#aaa;padding-left:6px}
#node_buttons{display:flex;gap:6px;flex-wrap:wrap}
#drawflow-container{position:absolute;left:0;top:105px;right:360px;bottom:0;background:#181818}
#drawflow{width:100%;height:100%}
#status{position:absolute;left:10px;bottom:10px;padding:8px 12px;background:rgba(0,0,0,.75);border:1px solid #444;border-radius:4px;z-index:20}
#properties{position:absolute;top:105px;right:0;bottom:0;width:360px;overflow-y:auto;background:#202020;border-left:1px solid #444;padding:12px}
#properties .title{font-size:20px;font-weight:bold;margin-bottom:15px}
.property-title{font-size:18px;font-weight:bold;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #444}
.property-field{margin-bottom:15px}.property-field label{display:block;margin-bottom:6px;color:#ccc}
.property-field>input,.property-field>select{width:100%}
.config-table-wrapper{overflow-x:auto}.config-table{width:100%;border-collapse:collapse}
.config-table th,.config-table td{border:1px solid #444;padding:5px}.config-table th{background:#292929}
.config-table input,.config-table select{width:100%;min-width:75px;padding:5px}
.delete-row{padding:5px 8px}.table-actions{margin-top:8px}
.drawflow .drawflow-node{background:#252525;border:1px solid #777;color:#fff}.drawflow .drawflow-node.selected{border:2px solid #00aaff}.drawflow .drawflow-node .title-box{padding:10px;font-weight:bold}
</style>
</head>
<body>
<div id="toolbar">
    <div class="row">
        <select id="company_select"><option value="">Select Company</option></select>
        <input id="new_company_name" class="company-name" placeholder="New company name">
        <button onclick="createCompany()">NEW COMPANY</button>
        <button onclick="switchCompany()">OPEN COMPANY</button>
        <button onclick="newFactory()">NEW FACTORY</button>
        <button onclick="loadFactory()">LOAD FACTORY</button>
        <button onclick="saveFactory()">SAVE FACTORY</button>
        <span id="company_info" class="info">Company: {{ company_id }}</span>
    </div>
    <div id="node_buttons"></div>
</div>

<div id="drawflow-container">
    <div id="drawflow"></div>
    <div id="status">SCADA FLOW EDITOR</div>
</div>

<div id="properties">
    <div class="title">Properties</div>
    <div id="property-content">Select Node</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>
<script>
const currentCompanyId={{ company_id|tojson }};
let editor=null;
let nodeRegistry={};
let selectedNodeId=null;
let flowRoles=[];

function status(text){document.getElementById('status').textContent=text}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}

async function init(){
    editor=new Drawflow(document.getElementById('drawflow'));
    editor.reroute=true;
    editor.start();
    editor.on('nodeSelected',id=>selectNode(id));
    editor.on('nodeUnselected',()=>{selectedNodeId=null});
    editor.on('nodeCreated',()=>refreshRoles());
    await loadCompanies();
    await loadRegistry();
    await loadFactory();
    status('SCADA FLOW EDITOR READY');
}

document.addEventListener('DOMContentLoaded',init);

async function loadCompanies(){
    const select=document.getElementById('company_select');
    try{
        const r=await fetch('/flow/companies');
        if(!r.ok) return;
        const companies=await r.json();
        select.innerHTML='<option value="">Select Company</option>';
        companies.forEach(c=>select.add(new Option(c.CompanyName,c.CompanyID)));
        select.value=String(currentCompanyId||'');
    }catch(e){console.error('COMPANY LIST ERROR',e)}
}

async function createCompany(){
    const name=document.getElementById('new_company_name').value.trim();
    if(!name){alert('Enter a company name.');return}
    try{
        const r=await fetch('/flow/company/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_name:name})});
        const data=await r.json();
        if(!r.ok) throw new Error(data.message||'Company creation failed');
        const id=data.company.CompanyID;
        document.getElementById('new_company_name').value='';
        await loadCompanies();
        document.getElementById('company_select').value=String(id);
        window.location.href='/flow?company_id='+encodeURIComponent(id);
    }catch(e){alert(e.message||'Company creation failed')}
}

function switchCompany(){
    const id=document.getElementById('company_select').value;
    if(!id){alert('Select a company.');return}
    window.location.href='/flow?company_id='+encodeURIComponent(id);
}

async function loadRegistry(){
    try{
        const r=await fetch('/node_registry');
        if(!r.ok) throw new Error('Registry request failed');
        nodeRegistry=await r.json();
        const box=document.getElementById('node_buttons');
        box.innerHTML='';
        Object.keys(nodeRegistry).forEach(name=>{
            const b=document.createElement('button');
            b.textContent=name;
            b.onclick=()=>addNode(name);
            box.appendChild(b);
        });
    }catch(e){console.error(e);status('NODE REGISTRY ERROR')}
}

function addNode(name){
    let data={};
    if(name==='RolesEngaged') data={roles:[]};
    const id=editor.addNode(name,1,1,100+Math.random()*350,100+Math.random()*300,name,data,`<div class="title-box">${esc(name)}</div>`,false);
    selectNode(id);
    refreshRoles();
    status('NODE ADDED: '+name);
}

function collectRoles(){
    const roles=[];
    if(!editor) return roles;
    const nodes=editor.export()?.drawflow?.Home?.data||{};
    Object.values(nodes).forEach(node=>{
        if(node.name!=='Roles') return;
        const rows=Array.isArray(node.data?.roles)?node.data.roles:[];
        rows.forEach(row=>{
            const role=typeof row==='string'?row:String(row?.role||'').trim();
            if(role && !roles.includes(role)) roles.push(role);
        });
    });
    return roles;
}

async function refreshRoles(){
    const local=collectRoles();
    let server=[];
    try{
        const r=await fetch('/flow_roles?company_id='+encodeURIComponent(currentCompanyId));
        if(r.ok){
            const data=await r.json();
            if(Array.isArray(data)) server=data.map(x=>String(x.role||'').trim()).filter(Boolean);
        }
    }catch(e){}
    flowRoles=[...new Set([...server,...local])];
    if(selectedNodeId){
        const node=editor.getNodeFromId(selectedNodeId);
        if(node && node.name==='RolesEngaged') renderProperties(node);
    }
}

async function loadFactory(){
    try{
        const r=await fetch('/flow.json?company_id='+encodeURIComponent(currentCompanyId));
        if(!r.ok) throw new Error('Flow load failed');
        const flow=await r.json();
        editor.clear();
        if(flow && flow.drawflow) editor.import(flow);
        await refreshRoles();
        status('FACTORY LOADED');
    }catch(e){console.error(e);status('LOAD ERROR');alert('Could not load factory.')}
}

async function saveFactory(){
    try{
        const flow=editor.export();
        const r=await fetch('/save_flow?company_id='+encodeURIComponent(currentCompanyId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(flow)});
        const data=await r.json();
        if(!r.ok) throw new Error(data.message||'Save failed');
        status('FACTORY SAVED');
        await refreshRoles();
    }catch(e){console.error(e);status('SAVE ERROR');alert(e.message||'Could not save factory.')}
}

function newFactory(){
    if(!confirm('Create a new empty factory flow?')) return;
    editor.clear();
    selectedNodeId=null;
    flowRoles=[];
    document.getElementById('property-content').textContent='Select Node';
    status('NEW FACTORY');
}

function selectNode(id){
    selectedNodeId=String(id);
    const node=editor.getNodeFromId(id);
    if(node) renderProperties(node);
}

function renderProperties(node){
    const box=document.getElementById('property-content');
    box.innerHTML='';
    const title=document.createElement('div');
    title.className='property-title';
    title.textContent=node.name||node.class;
    box.appendChild(title);
    const def=nodeRegistry[node.name];
    if(!def){box.insertAdjacentHTML('beforeend','<div>No properties.</div>');return}
    (def.config||[]).forEach(c=>renderProperty(box,node,c));
}

function renderProperty(box,node,def){
    const wrap=document.createElement('div');wrap.className='property-field';
    const label=document.createElement('label');label.textContent=def.label||def.name;wrap.appendChild(label);
    if(def.type==='table') renderTable(wrap,node,def);
    else{
        const input=createInput(def,node.data?.[def.name]);
        input.onchange=()=>setNodeValue(node,def.name,inputValue(input,def));
        wrap.appendChild(input);
    }
    box.appendChild(wrap);
}

function optionsFor(def){
    if(def.name==='role') return flowRoles;
    return def.options||[];
}

function createInput(def,value){
    let input;
    if(def.type==='select'){
        input=document.createElement('select');
        optionsFor(def).forEach(o=>input.add(new Option(o,o)));
        input.value=value??def.default??'';
    }else{
        input=document.createElement('input');
        input.type=def.type==='number'?'number':def.type==='password'?'password':'text';
        input.value=value??def.default??'';
    }
    return input;
}

function inputValue(input,def){return def.type==='number'?Number(input.value):input.value}
function setNodeValue(node,name,value){node.data[name]=value;editor.updateNodeDataFromId(node.id,node.data);if(node.name==='Roles') refreshRoles()}

function renderTable(wrap,node,def){
    const rows=Array.isArray(node.data?.[def.name])?node.data[def.name]:[];
    node.data[def.name]=rows;
    const holder=document.createElement('div');holder.className='config-table-wrapper';
    const table=document.createElement('table');table.className='config-table';
    const head=document.createElement('thead');const hr=document.createElement('tr');
    (def.columns||[]).forEach(col=>{const th=document.createElement('th');th.textContent=col.label||col.name;hr.appendChild(th)});
    const action=document.createElement('th');action.textContent='Action';hr.appendChild(action);head.appendChild(hr);table.appendChild(head);
    const body=document.createElement('tbody');
    rows.forEach((row,index)=>{
        const tr=document.createElement('tr');
        (def.columns||[]).forEach(col=>{
            const td=document.createElement('td');
            const input=createInput(col,row?.[col.name]);
            input.onchange=()=>{row[col.name]=inputValue(input,col);editor.updateNodeDataFromId(node.id,node.data);if(node.name==='Roles')refreshRoles()};
            td.appendChild(input);tr.appendChild(td);
        });
        const td=document.createElement('td');const del=document.createElement('button');del.className='delete-row';del.textContent='DELETE';
        del.onclick=()=>{rows.splice(index,1);editor.updateNodeDataFromId(node.id,node.data);renderProperties(node);refreshRoles()};
        td.appendChild(del);tr.appendChild(td);body.appendChild(tr);
    });
    table.appendChild(body);holder.appendChild(table);wrap.appendChild(holder);
    const actions=document.createElement('div');actions.className='table-actions';const add=document.createElement('button');add.textContent='ADD ROW';
    add.onclick=()=>{const row={};(def.columns||[]).forEach(col=>row[col.name]=col.default??'');rows.push(row);editor.updateNodeDataFromId(node.id,node.data);renderProperties(node);refreshRoles()};
    actions.appendChild(add);wrap.appendChild(actions);
}
</script>
</body>
</html>
