<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA FLOW EDITOR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#eee;overflow:hidden}
#toolbar{height:145px;background:#1b1b1b;border-bottom:1px solid #333;padding:7px;overflow:auto}
.row{display:flex;align-items:center;gap:7px;margin-bottom:7px;flex-wrap:wrap}
button,select,input{font:inherit}
button{padding:7px 11px;border:1px solid #555;background:#292929;color:#fff;border-radius:4px;cursor:pointer}
button:hover{background:#444}
button.primary{background:#075e8a;border-color:#149bd0;font-weight:bold}
button.primary:hover{background:#0874a8}
input,select{padding:7px;background:#111;color:#fff;border:1px solid #555;border-radius:4px}
#company_select{min-width:220px}.company-name{width:220px}.info{color:#aaa;padding-left:6px}
#node_buttons{display:flex;gap:6px;flex-wrap:wrap}
#drawflow-container{position:absolute;left:0;top:145px;right:360px;bottom:0;background:#181818}
#drawflow{width:100%;height:100%}
#status{position:absolute;left:10px;bottom:10px;padding:8px 12px;background:rgba(0,0,0,.75);border:1px solid #444;border-radius:4px;z-index:20}
#properties{position:absolute;top:145px;right:0;bottom:0;width:360px;overflow-y:auto;background:#202020;border-left:1px solid #444;padding:12px}
#properties .title{font-size:20px;font-weight:bold;margin-bottom:15px}
.property-title{font-size:18px;font-weight:bold;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #444}
.property-field{margin-bottom:15px}.property-field label{display:block;margin-bottom:6px;color:#ccc}
.property-field>input,.property-field>select{width:100%}
.config-table-wrapper{overflow-x:auto}.config-table{width:100%;border-collapse:collapse}
.config-table th,.config-table td{border:1px solid #444;padding:5px}.config-table th{background:#292929}
.config-table input,.config-table select{width:100%;min-width:75px;padding:5px}
.delete-row{padding:5px 8px}.table-actions{margin-top:8px}
.drawflow .drawflow-node{background:#252525;border:1px solid #777;color:#fff}.drawflow .drawflow-node.selected{border:2px solid #00aaff}.drawflow .drawflow-node .title-box{padding:10px;font-weight:bold}
.machine-editor{border:1px solid #444;background:#181818;border-radius:6px;padding:8px;margin-bottom:10px}
.machine-editor-head{display:flex;gap:5px;align-items:center;margin-bottom:8px}
.machine-editor-head strong{flex:1;color:#fff}
.machine-editor input,.machine-editor select{width:100%;padding:5px;margin-bottom:5px}
.machine-parameter{border-top:1px solid #333;padding-top:6px;margin-top:6px}
.machine-parameter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.machine-parameter-grid input{min-width:0}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:6px 0}
.icon-choice{min-height:52px;padding:5px;font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.icon-choice small{font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.icon-preview{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;font-size:24px;vertical-align:middle;border:1px solid #555;border-radius:4px;margin-right:5px}
.library-item{display:flex;gap:5px;align-items:center;margin-bottom:5px}.library-item img{width:32px;height:32px;object-fit:contain;background:#fff;border-radius:3px}
.section-note{font-size:11px;color:#999;line-height:1.4;margin:4px 0 8px}
</style>
</head>
<body>
<div id="toolbar">
    <div class="row">
        <select id="company_select"><option value="">Select Company</option></select>
        <input id="new_company_name" class="company-name" placeholder="New company name">
        <button onclick="createCompany()">NEW COMPANY</button>
        <button onclick="switchCompany()">OPEN COMPANY</button>
        <button onclick="newCompanyFlow()">NEW EMPTY FLOW</button>
        <button class="primary" onclick="saveCompanyFlow()">SAVE COMPANY FLOW</button>
        <button onclick="loadCompanyFlow()">LOAD COMPANY FLOW</button>
        <span id="company_info" class="info">Company: {{ company_id }}</span>
    </div>
    <div id="node_buttons"></div>
</div>

<div id="drawflow-container">
    <div id="drawflow"></div>
    <div id="status">SCADA FLOW EDITOR</div>
</div>

<div id="properties">
    <div class="title">Properties</div>
    <div id="property-content">Select Node</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>
<script>
const currentCompanyId={{ company_id|tojson }};
const isNewCompany={{ (request.args.get('new') == '1')|tojson }};
let editor=null;
let nodeRegistry={};
let selectedNodeId=null;
let flowRoles=[];

const BUILTIN_ICONS=[
    {id:'builtin:factory',name:'Factory',symbol:'🏭'},
    {id:'builtin:machine',name:'Machine',symbol:'⚙️'},
    {id:'builtin:motor',name:'Motor',symbol:'🔧'},
    {id:'builtin:pump',name:'Pump',symbol:'💧'},
    {id:'builtin:fan',name:'Fan',symbol:'🌀'},
    {id:'builtin:heater',name:'Heater',symbol:'🔥'},
    {id:'builtin:power',name:'Power',symbol:'⚡'},
    {id:'builtin:production',name:'Production',symbol:'📦'},
    {id:'builtin:robot',name:'Robot',symbol:'🤖'},
    {id:'builtin:conveyor',name:'Conveyor',symbol:'➡️'},
    {id:'builtin:compressor',name:'Compressor',symbol:'🔩'},
    {id:'builtin:warehouse',name:'Warehouse',symbol:'🏢'}
];

function status(text){document.getElementById('status').textContent=text}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}

async function init(){
    editor=new Drawflow(document.getElementById('drawflow'));
    editor.reroute=true;
    editor.start();
    editor.on('nodeSelected',id=>selectNode(id));
    editor.on('nodeUnselected',()=>{selectedNodeId=null});
    editor.on('nodeCreated',()=>refreshRoles());
    await loadCompanies();
    await loadRegistry();
    if(isNewCompany){
        editor.clear();
        await refreshRoles();
        status('NEW COMPANY READY - DESIGN THEN SAVE COMPANY FLOW');
    }else{
        await loadCompanyFlow();
        if(document.getElementById('status').textContent!=='LOAD ERROR') status('SCADA FLOW EDITOR READY');
    }
}

document.addEventListener('DOMContentLoaded',init);

async function loadCompanies(){
    const select=document.getElementById('company_select');
    try{
        const r=await fetch('/flow/companies');
        if(!r.ok) return;
        const companies=await r.json();
        select.innerHTML='<option value="">Select Company</option>';
        companies.forEach(c=>select.add(new Option(c.CompanyName,c.CompanyID)));
        select.value=String(currentCompanyId||'');
    }catch(e){console.error('COMPANY LIST ERROR',e)}
}

async function createCompany(){
    const name=document.getElementById('new_company_name').value.trim();
    if(!name){alert('Enter a company name.');return}
    try{
        const r=await fetch('/flow/company/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({company_name:name})});
        const data=await r.json();
        if(!r.ok) throw new Error(data.message||'Company creation failed');
        const id=data.company.CompanyID;
        document.getElementById('new_company_name').value='';
        await loadCompanies();
        document.getElementById('company_select').value=String(id);
        window.location.href='/flow?company_id='+encodeURIComponent(id)+'&new=1';
    }catch(e){alert(e.message||'Company creation failed')}
}

function switchCompany(){
    const id=document.getElementById('company_select').value;
    if(!id){alert('Select a company.');return}
    window.location.href='/flow?company_id='+encodeURIComponent(id);
}

async function loadRegistry(){
    try{
        const r=await fetch('/node_registry');
        if(!r.ok) throw new Error('Registry request failed: HTTP '+r.status);
        nodeRegistry=await r.json();
        const box=document.getElementById('node_buttons');
        box.innerHTML='';
        Object.keys(nodeRegistry).forEach(name=>{
            const b=document.createElement('button');
            b.textContent=name;
            b.onclick=()=>addNode(name);
            box.appendChild(b);
        });
    }catch(e){console.error('NODE REGISTRY ERROR',e);status('NODE REGISTRY ERROR')}
}

function addNode(name){
    let data={};
    if(name==='RolesEngaged') data={roles:[]};
    if(name==='MachineCard') data={machines:[],icon_library:[]};
    const id=editor.addNode(name,1,1,100+Math.random()*350,100+Math.random()*300,name,data,`<div class="title-box">${esc(name)}</div>`,false);
    selectNode(id);
    refreshRoles();
    status('NODE ADDED: '+name);
}

function collectRoles(){
    const roles=[];
    if(!editor) return roles;
    const nodes=editor.export()?.drawflow?.Home?.data||{};
    Object.values(nodes).forEach(node=>{
        if(node.name!=='Roles') return;
        const rows=Array.isArray(node.data?.roles)?node.data.roles:[];
        rows.forEach(row=>{
            const role=typeof row==='string'?row:String(row?.role||'').trim();
            if(role && !roles.includes(role)) roles.push(role);
        });
    });
    return roles;
}

async function refreshRoles(){
    const local=collectRoles();
    let server=[];
    try{
        const r=await fetch('/flow_roles?company_id='+encodeURIComponent(currentCompanyId));
        if(r.ok){
            const data=await r.json();
            if(Array.isArray(data)) server=data.map(x=>String(x.role||'').trim()).filter(Boolean);
        }
    }catch(e){console.warn('FLOW ROLES LOAD ERROR',e)}
    flowRoles=[...new Set([...server,...local])];
    if(selectedNodeId){
        const node=editor.getNodeFromId(selectedNodeId);
        if(node && node.name==='RolesEngaged') renderProperties(node);
    }
}

function cloneJson(value){
    return JSON.parse(JSON.stringify(value));
}

function sanitizeCompanyFlow(flow){
    if(!flow || typeof flow!=='object') throw new Error('Server returned non-object Flow JSON');
    if(!flow.drawflow || typeof flow.drawflow!=='object') throw new Error('Missing drawflow object');
    if(!flow.drawflow.Home || typeof flow.drawflow.Home!=='object') throw new Error('Missing drawflow.Home object');
    if(!flow.drawflow.Home.data || typeof flow.drawflow.Home.data!=='object') throw new Error('Missing drawflow.Home.data object');

    const cleaned=cloneJson(flow);
    const data=cleaned.drawflow.Home.data;
    const managementNames=new Set([
        'ManagementRolesEngaged',
        'ManagementPanelOutput',
        'ManagementInput',
        'ContractRepository',
        'ProductBOMRepository',
        'ManagementCostCalculator',
        'ManagementOutput',
        'management-roles-engaged',
        'management-panel-output',
        'management-input',
        'contract-repository',
        'product-bom-repository',
        'management-cost-calculator',
        'management-output'
    ]);

    const removedIds=new Set();
    const normalized={};
    let removedCount=0;

    Object.entries(data).forEach(([key,node])=>{
        if(!node || typeof node!=='object') return;
        const nodeName=String(node.name||node.class||'').trim();
        if(managementNames.has(nodeName)){
            removedIds.add(String(key));
            removedCount++;
            return;
        }

        const copy=cloneJson(node);
        copy.id=/^\d+$/.test(String(key)) ? Number(key) : String(key);
        normalized[String(key)]=copy;
    });

    Object.values(normalized).forEach(node=>{
        ['inputs','outputs'].forEach(side=>{
            if(!node[side] || typeof node[side]!=='object') return;
            Object.values(node[side]).forEach(port=>{
                if(!port || !Array.isArray(port.connections)) return;
                port.connections=port.connections.filter(connection=>{
                    if(!connection || typeof connection!=='object') return false;
                    return !removedIds.has(String(connection.node));
                });
            });
        });
    });

    cleaned.drawflow.Home.data=normalized;
    return {flow:cleaned,removedCount};
}

async function loadCompanyFlow(){
    const url='/flow.json?company_id='+encodeURIComponent(currentCompanyId);
    try{
        status('LOADING COMPANY FLOW '+currentCompanyId+'...');
        console.groupCollapsed('SCADA FLOW LOAD DEBUG company='+currentCompanyId);
        console.log('Request URL:',url);

        const r=await fetch(url,{cache:'no-store',headers:{'Accept':'application/json'}});
        console.log('HTTP status:',r.status,r.statusText);
        console.log('Content-Type:',r.headers.get('content-type'));
        const raw=await r.text();
        console.log('Response length:',raw.length);
        console.log('Response preview:',raw.slice(0,1000));

        if(!r.ok) throw new Error('Flow HTTP '+r.status+' '+r.statusText+' :: '+raw.slice(0,300));

        let flow;
        try{
            flow=JSON.parse(raw);
        }catch(parseError){
            console.error('FLOW JSON PARSE ERROR:',parseError);
            throw new Error('Invalid Flow JSON returned by server: '+parseError.message);
        }

        console.log('Top-level keys:',Object.keys(flow||{}));
        const beforeNodes=flow?.drawflow?.Home?.data||{};
        console.log('Raw node count:',Object.keys(beforeNodes).length);
        console.table(Object.entries(beforeNodes).map(([key,node])=>({
            key,
            id:node?.id,
            name:node?.name,
            class:node?.class,
            inputs:Object.keys(node?.inputs||{}).length,
            outputs:Object.keys(node?.outputs||{}).length
        })));

        const sanitized=sanitizeCompanyFlow(flow);
        console.log('Removed legacy management nodes:',sanitized.removedCount);
        console.log('Sanitized node count:',Object.keys(sanitized.flow.drawflow.Home.data).length);
        console.table(Object.entries(sanitized.flow.drawflow.Home.data).map(([key,node])=>({key,id:node.id,name:node.name})));

        editor.clear();
        try{
            editor.import(sanitized.flow);
        }catch(importError){
            console.error('DRAWFLOW IMPORT ERROR:',importError);
            console.error('FLOW SENT TO DRAWFLOW:',sanitized.flow);
            throw new Error('Drawflow import failed: '+(importError?.message||importError));
        }

        await refreshRoles();
        console.log('FLOW IMPORT SUCCESS');
        console.groupEnd();

        if(sanitized.removedCount>0){
            status('COMPANY FLOW LOADED - '+sanitized.removedCount+' OLD MANAGEMENT NODES REMOVED FROM VIEW');
        }else{
            status('COMPANY FLOW LOADED: '+currentCompanyId);
        }
        return true;
    }catch(e){
        console.error('COMPANY FLOW LOAD FAILED:',e);
        try{console.groupEnd()}catch(_e){}
        status('LOAD ERROR: '+(e?.message||e));
        alert('Could not load company flow. Open F12 > Console for the exact error.\n\n'+(e?.message||e));
        return false;
    }
}

async function saveCompanyFlow(){
    try{
        const flow=editor.export();
        const r=await fetch('/save_flow?company_id='+encodeURIComponent(currentCompanyId),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(flow)});
        const data=await r.json();
        if(!r.ok) throw new Error(data.message||'Save failed');
        status('COMPANY FLOW SAVED: COMPANY '+currentCompanyId);
        await refreshRoles();
        history.replaceState({},'', '/flow?company_id='+encodeURIComponent(currentCompanyId));
    }catch(e){console.error('SAVE FLOW ERROR',e);status('SAVE ERROR');alert(e.message||'Could not save company flow.')}
}

function newCompanyFlow(){
    if(!confirm('Clear the current flow and start a new empty company flow?')) return;
    editor.clear();
    selectedNodeId=null;
    flowRoles=[];
    document.getElementById('property-content').textContent='Select Node';
    status('NEW EMPTY COMPANY FLOW - CLICK SAVE COMPANY FLOW TO STORE IT');
}

function selectNode(id){
    selectedNodeId=String(id);
    const node=editor.getNodeFromId(id);
    if(node) renderProperties(node);
}

function renderProperties(node){
    const box=document.getElementById('property-content');
    box.innerHTML='';
    const title=document.createElement('div');
    title.className='property-title';
    title.textContent=node.name||node.class;
    box.appendChild(title);
    const def=nodeRegistry[node.name];
    if(!def){box.insertAdjacentHTML('beforeend','<div>No properties.</div>');return}
    (def.config||[]).forEach(c=>renderProperty(box,node,c));
}

function renderProperty(box,node,def){
    const wrap=document.createElement('div');wrap.className='property-field';
    const label=document.createElement('label');label.textContent=def.label||def.name;wrap.appendChild(label);
    if(def.type==='table') renderTable(wrap,node,def);
    else if(def.type==='machine_cards') renderMachineCards(wrap,node);
    else if(def.type==='icon_library') renderIconLibrary(wrap,node);
    else{
        const input=createInput(def,node.data?.[def.name]);
        input.onchange=()=>setNodeValue(node,def.name,inputValue(input,def));
        wrap.appendChild(input);
    }
    box.appendChild(wrap);
}

function optionsFor(def){
    if(def.name==='role') return flowRoles;
    return def.options||[];
}

function createInput(def,value){
    let input;
    if(def.type==='select'){
        input=document.createElement('select');
        optionsFor(def).forEach(o=>input.add(new Option(o,o)));
        input.value=value??def.default??'';
    }else{
        input=document.createElement('input');
        input.type=def.type==='number'?'number':def.type==='password'?'password':'text';
        input.value=value??def.default??'';
    }
    return input;
}

function inputValue(input,def){return def.type==='number'?Number(input.value):input.value}
function setNodeValue(node,name,value){node.data[name]=value;editor.updateNodeDataFromId(node.id,node.data);if(node.name==='Roles') refreshRoles()}

function renderTable(wrap,node,def){
    const rows=Array.isArray(node.data?.[def.name])?node.data[def.name]:[];
    node.data[def.name]=rows;
    const holder=document.createElement('div');holder.className='config-table-wrapper';
    const table=document.createElement('table');table.className='config-table';
    const head=document.createElement('thead');const hr=document.createElement('tr');
    (def.columns||[]).forEach(col=>{const th=document.createElement('th');th.textContent=col.label||col.name;hr.appendChild(th)});
    const action=document.createElement('th');action.textContent='Action';hr.appendChild(action);head.appendChild(hr);table.appendChild(head);
    const body=document.createElement('tbody');
    rows.forEach((row,index)=>{
        const tr=document.createElement('tr');
        (def.columns||[]).forEach(col=>{
            const td=document.createElement('td');
            const input=createInput(col,row?.[col.name]);
            input.onchange=()=>{row[col.name]=inputValue(input,col);editor.updateNodeDataFromId(node.id,node.data);if(node.name==='Roles')refreshRoles()};
            td.appendChild(input);tr.appendChild(td);
        });
        const td=document.createElement('td');const del=document.createElement('button');del.className='delete-row';del.textContent='DELETE';
        del.onclick=()=>{rows.splice(index,1);editor.updateNodeDataFromId(node.id,node.data);renderProperties(node);refreshRoles()};
        td.appendChild(del);tr.appendChild(td);body.appendChild(tr);
    });
    table.appendChild(body);holder.appendChild(table);wrap.appendChild(holder);
    const actions=document.createElement('div');actions.className='table-actions';const add=document.createElement('button');add.textContent='ADD ROW';
    add.onclick=()=>{const row={};(def.columns||[]).forEach(col=>row[col.name]=col.default??'');rows.push(row);editor.updateNodeDataFromId(node.id,node.data);renderProperties(node);refreshRoles()};
    actions.appendChild(add);wrap.appendChild(actions);
}

// =====================================================
// MACHINE CARD DESIGNER
// =====================================================

function machineIconItems(node){
    const custom=Array.isArray(node.data?.icon_library)?node.data.icon_library:[];
    return [...BUILTIN_ICONS,...custom.map(x=>({
        id:'custom:'+String(x.id||''),
        name:String(x.name||x.id||'Custom'),
        src:x.src,
        custom:true
    }))];
}

function machineIconVisual(icon,node){
    const item=machineIconItems(node).find(x=>x.id===icon);
    if(!item) return '<span class="icon-preview">🏭</span>';
    if(item.custom && item.src){
        return '<span class="icon-preview"><img src="'+esc(item.src)+'" style="width:28px;height:28px;object-fit:contain"></span>';
    }
    return '<span class="icon-preview">'+esc(item.symbol||'🏭')+'</span>';
}

function renderMachineCards(wrap,node){
    if(!Array.isArray(node.data.machines)) node.data.machines=[];
    const machines=node.data.machines;

    const note=document.createElement('div');
    note.className='section-note';
    note.textContent='Define any number of industrial machines. Each machine can have any number of tag-based parameters.';
    wrap.appendChild(note);

    const list=document.createElement('div');
    machines.forEach((machine,index)=>{
        if(!machine.id) machine.id='machine_'+(index+1);
        if(!Array.isArray(machine.parameters)) machine.parameters=[];
        if(!machine.icon) machine.icon='builtin:factory';
        if(!machine.layout) machine.layout='auto';

        const card=document.createElement('div');card.className='machine-editor';
        const head=document.createElement('div');head.className='machine-editor-head';
        const strong=document.createElement('strong');strong.textContent='Machine '+(index+1);head.appendChild(strong);
        const del=document.createElement('button');del.textContent='DELETE';del.onclick=()=>{machines.splice(index,1);commitMachineNode(node);renderProperties(node)};head.appendChild(del);card.appendChild(head);

        const idInput=document.createElement('input');idInput.placeholder='Machine ID';idInput.value=machine.id;
        idInput.onchange=()=>{machine.id=idInput.value.trim()||('machine_'+(index+1));commitMachineNode(node)};card.appendChild(idInput);

        const nameInput=document.createElement('input');nameInput.placeholder='Machine Name';nameInput.value=machine.name||'';
        nameInput.onchange=()=>{machine.name=nameInput.value;commitMachineNode(node)};card.appendChild(nameInput);

        const iconLabel=document.createElement('label');iconLabel.textContent='Icon';card.appendChild(iconLabel);
        card.insertAdjacentHTML('beforeend',machineIconVisual(machine.icon,node));
        const iconGrid=document.createElement('div');iconGrid.className='icon-grid';
        machineIconItems(node).forEach(item=>{
            const b=document.createElement('button');b.type='button';b.className='icon-choice';
            if(item.custom && item.src){b.innerHTML='<img src="'+esc(item.src)+'" style="width:28px;height:28px;object-fit:contain"><small>'+esc(item.name)+'</small>'}
            else b.innerHTML=esc(item.symbol)+'<small>'+esc(item.name)+'</small>';
            b.onclick=()=>{machine.icon=item.id;commitMachineNode(node);renderProperties(node)};
            iconGrid.appendChild(b);
        });
        card.appendChild(iconGrid);

        const layout=document.createElement('select');
        [['auto','Automatic'],['1','1 Column'],['2','2 Columns'],['compact','Compact']].forEach(x=>layout.add(new Option(x[1],x[0])));
        layout.value=machine.layout;
        layout.onchange=()=>{machine.layout=layout.value;commitMachineNode(node)};
        card.appendChild(layout);

        const pTitle=document.createElement('div');pTitle.textContent='Parameters';pTitle.style.margin='8px 0 4px';card.appendChild(pTitle);
        const pList=document.createElement('div');
        machine.parameters.forEach((parameter,pIndex)=>{
            const row=document.createElement('div');row.className='machine-parameter';
            const grid=document.createElement('div');grid.className='machine-parameter-grid';
            const label=document.createElement('input');label.placeholder='Label';label.value=parameter.label||'';
            const tag=document.createElement('input');tag.placeholder='Tag';tag.value=parameter.tag||'';
            const unit=document.createElement('input');unit.placeholder='Unit';unit.value=parameter.unit||'';
            label.onchange=()=>{parameter.label=label.value;commitMachineNode(node)};
            tag.onchange=()=>{parameter.tag=tag.value;commitMachineNode(node)};
            unit.onchange=()=>{parameter.unit=unit.value;commitMachineNode(node)};
            grid.append(label,tag,unit);row.appendChild(grid);
            const remove=document.createElement('button');remove.textContent='DELETE PARAMETER';remove.style.marginTop='4px';
            remove.onclick=()=>{machine.parameters.splice(pIndex,1);commitMachineNode(node);renderProperties(node)};
            row.appendChild(remove);pList.appendChild(row);
        });
        card.appendChild(pList);
        const addParam=document.createElement('button');addParam.textContent='+ ADD PARAMETER';
        addParam.onclick=()=>{machine.parameters.push({label:'',tag:'',unit:''});commitMachineNode(node);renderProperties(node)};
        card.appendChild(addParam);
        list.appendChild(card);
    });
    wrap.appendChild(list);

    const addMachine=document.createElement('button');addMachine.textContent='+ ADD MACHINE';
    addMachine.onclick=()=>{machines.push({id:'machine_'+(machines.length+1),name:'',icon:'builtin:factory',layout:'auto',parameters:[ ]});commitMachineNode(node);renderProperties(node)};
    wrap.appendChild(addMachine);
}

function commitMachineNode(node){
    editor.updateNodeDataFromId(node.id,node.data);
}

// =====================================================
// ICON LIBRARY
// =====================================================

function renderIconLibrary(wrap,node){
    if(!Array.isArray(node.data.icon_library)) node.data.icon_library=[];
    const library=node.data.icon_library;

    const note=document.createElement('div');
    note.className='section-note';
    note.textContent='Built-in icons are always available. Custom SVG/PNG/JPG icons added here are stored in this MachineCard flow and can be reused by all machines in it.';
    wrap.appendChild(note);

    const builtinTitle=document.createElement('div');builtinTitle.textContent='Built-in Icons';builtinTitle.style.fontWeight='bold';wrap.appendChild(builtinTitle);
    const builtGrid=document.createElement('div');builtGrid.className='icon-grid';
    BUILTIN_ICONS.forEach(item=>{
        const b=document.createElement('button');b.type='button';b.className='icon-choice';
        b.innerHTML=esc(item.symbol)+'<small>'+esc(item.name)+'</small>';
        b.disabled=true;
        builtGrid.appendChild(b);
    });
    wrap.appendChild(builtGrid);

    const customTitle=document.createElement('div');customTitle.textContent='My Icons';customTitle.style.fontWeight='bold';wrap.appendChild(customTitle);
    const customList=document.createElement('div');
    library.forEach((item,index)=>{
        const row=document.createElement('div');row.className='library-item';
        row.innerHTML='<img src="'+esc(item.src||'')+'"><input value="'+esc(item.name||'Custom Icon')+'">';
        const input=row.querySelector('input');input.onchange=()=>{item.name=input.value;commitMachineNode(node);renderProperties(node)};
        const del=document.createElement('button');del.textContent='DELETE';del.onclick=()=>{library.splice(index,1);commitMachineNode(node);renderProperties(node)};
        row.appendChild(del);customList.appendChild(row);
    });
    wrap.appendChild(customList);

    const upload=document.createElement('input');upload.type='file';upload.accept='.svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg';upload.style.marginTop='8px';
    upload.onchange=()=>{
        const file=upload.files?.[0];
        if(!file) return;
        const reader=new FileReader();
        reader.onload=()=>{
            const ext=(file.name.split('.').pop()||'icon').toLowerCase();
            const id='custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
            library.push({id:id,name:file.name.replace(/\.[^.]+$/,''),src:String(reader.result),type:ext});
            commitMachineNode(node);renderProperties(node);status('CUSTOM ICON ADDED TO MACHINECARD LIBRARY');
        };
        reader.readAsDataURL(file);
    };
    wrap.appendChild(upload);
}
</script>
</body>
