<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Trend</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#1e293b;font-family:'Vazirmatn',Tahoma,sans-serif}.header{background:linear-gradient(135deg,#0f172a,#2563eb);padding:35px;text-align:center;color:#fff}.title{font-size:34px;font-weight:800}.subtitle{margin-top:10px;font-size:17px;opacity:.9}.container{width:95%;max-width:1500px;margin:30px auto}.card{background:#fff;border-radius:18px;padding:25px;margin-bottom:25px;box-shadow:0 8px 25px rgba(0,0,0,.08)}.parameter-card{text-align:center;background:linear-gradient(135deg,#eff6ff,#fff);border-right:8px solid #2563eb}.parameter-label{font-size:18px;color:#64748b}.parameter-name{margin-top:10px;font-size:36px;font-weight:800;color:#1d4ed8}.filter-title{font-size:22px;font-weight:700;margin-bottom:20px}.filter-container{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:end}.filter-item{background:#f8fafc;padding:18px;border-radius:15px}.filter-item label{display:block;margin-bottom:9px;font-weight:600}input,select{padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:16px;font-family:'Vazirmatn';text-align:center;direction:ltr;min-width:220px;background:#fff}button{background:#2563eb;border:0;color:#fff;padding:14px 28px;border-radius:12px;font-size:17px;font-family:'Vazirmatn';cursor:pointer;font-weight:600}button:hover{background:#1e40af}.status{text-align:center;color:#64748b;min-height:28px;margin-top:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.stat{background:#f8fafc;border-radius:15px;padding:20px;text-align:center}.stat-title{font-size:15px;color:#64748b}.stat-value{font-size:28px;font-weight:800;margin-top:10px;color:#2563eb}.chart-card{height:620px}.chart-wrap{position:relative;width:100%;height:100%}.datepicker-plot-area .timepicker{display:block!important;visibility:visible!important;opacity:1!important}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.chart-card{height:480px}}@media(max-width:500px){.stats{grid-template-columns:1fr}.filter-item{width:100%}input,select{width:100%}}
</style>
</head>
<body>
{% include "nav.html" %}
<div class="header"><div class="title">سامانه مانیتورینگ صنعتی SCADA</div><div class="subtitle">روند واقعی داده‌های ذخیره‌شده در Historian</div></div>
<div class="container">
<div class="card parameter-card"><div class="parameter-label">پارامتر انتخاب شده</div><div class="parameter-name" id="parameterName">-</div><div class="status" id="status">در حال خواندن پارامترهای TIME از TagMapper...</div></div>
<div class="card"><div class="filter-title">انتخاب بازه زمانی</div><div class="filter-container"><div class="filter-item"><label>پارامتر TIME</label><select id="tag"></select></div><div class="filter-item"><label>از تاریخ و ساعت</label><input id="start_time" type="text" placeholder="1405/05/25 11:00"></div><div class="filter-item"><label>تا تاریخ و ساعت</label><input id="end_time" type="text" placeholder="1405/05/25 12:00"></div><button onclick="loadGraph()">📈 نمایش نمودار</button><button onclick="resetZoom()">🔄 بازگشت زوم</button><button onclick="saveGraph()">💾 ذخیره نمودار</button></div></div>
<div class="card"><div class="stats"><div class="stat"><div class="stat-title">مقدار فعلی</div><div class="stat-value" id="current">-</div></div><div class="stat"><div class="stat-title">کمترین مقدار</div><div class="stat-value" id="min">-</div></div><div class="stat"><div class="stat-title">بیشترین مقدار</div><div class="stat-value" id="max">-</div></div><div class="stat"><div class="stat-title">میانگین</div><div class="stat-value" id="avg">-</div></div></div></div>
<div class="card chart-card"><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div>
</div>
<script>
let chart=null,liveTimer=null,liveMode=false,busy=false;
const REFRESH_MS=2000;
const el=id=>document.getElementById(id);

function setupPicker(){
    if(!window.jQuery || !jQuery.fn || !jQuery.fn.persianDatepicker)throw new Error('Persian date picker library is not loaded');
    const opts={format:'YYYY/MM/DD HH:mm',initialValue:false,autoClose:false,observer:true,timePicker:{enabled:true,step:1,hour:{enabled:true},minute:{enabled:true},second:{enabled:false},meridian:{enabled:false}}};
    jQuery('#start_time').persianDatepicker(opts);
    jQuery('#end_time').persianDatepicker({...opts});
    el('start_time').value='';
    el('end_time').value='';
}

async function loadTags(){
    try{
        const r=await fetch('/trend_config?_='+Date.now(),{cache:'no-store',credentials:'same-origin'});
        const d=await r.json();
        if(!r.ok)throw Error(d.message||('HTTP '+r.status));
        const s=el('tag');s.innerHTML='';
        (d.tags||[]).forEach(x=>{const o=document.createElement('option');o.value=x.tag;o.textContent=x.title;s.appendChild(o)});
        el('parameterName').textContent=s.value||'-';
        s.onchange=()=>{el('parameterName').textContent=s.value||'-';stopLive()};
        setupPicker();
        el('status').textContent=(d.tags||[]).length?'فقط پارامترهای TagMapper با Storage=TIME و Interval معتبر نمایش داده می‌شوند. تاریخ‌ها خالی = Trend زنده':'هیچ پارامتر TIME دارای Interval در TagMapper پیدا نشد.';
    }catch(e){console.error(e);el('status').textContent='خطا در خواندن پارامترها: '+e.message}
}

function jalaliNow(){return new persianDate().format('YYYY/MM/DD HH:mm')}
function jalaliMinutesAgo(minutes){return new persianDate().subtract('minutes',minutes).format('YYYY/MM/DD HH:mm')}

async function requestTrend(start,end){
    const payload={tag:el('tag').value,start:start||null,end:end||null,calendar:'Jalali',TimezoneOffset:new Date().getTimezoneOffset()};
    const r=await fetch('/trend_request?_='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},credentials:'same-origin',cache:'no-store',body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok)throw Error(d.error||('HTTP '+r.status));
    return d;
}

function normalizePoints(ds){
    return (ds?.data||[]).map(p=>({x:Number(p.x),y:Number(p.y)})).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)).sort((a,b)=>a.x-b.x);
}

function draw(d){
    const ds=(d.datasets||[]).find(x=>x.tag===el('tag').value)||(d.datasets||[])[0];
    const points=normalizePoints(ds);
    if(chart)chart.destroy();
    chart=new Chart(el('trendChart'),{type:'line',data:{datasets:[{label:ds?.title||el('tag').value,data:points,borderWidth:3,tension:0,stepped:ds?.stepped||'after',pointRadius:2,pointHoverRadius:7,fill:false,borderColor:'#2563eb',backgroundColor:'#2563eb'}]},options:{responsive:true,maintainAspectRatio:false,animation:false,parsing:false,spanGaps:false,interaction:{mode:'nearest',intersect:false},scales:{x:{type:'linear',ticks:{maxTicksLimit:14,callback:v=>formatTime(v)},title:{display:true,text:'زمان'}},y:{beginAtZero:false,title:{display:true,text:ds?.title||el('tag').value}}},plugins:{legend:{position:'top'},tooltip:{rtl:true,callbacks:{title:items=>items.length?formatTime(items[0].parsed.x):'',label:item=>' '+item.parsed.y}},zoom:{pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'}}}}});
    updateStats(points);
}
function formatTime(ms){try{return new persianDate(new Date(ms)).format('YYYY/MM/DD HH:mm:ss')}catch(e){return new Date(ms).toLocaleString()}}
function updateStats(points){const v=points.map(p=>p.y);if(!v.length){el('current').textContent='-';el('min').textContent='-';el('max').textContent='-';el('avg').textContent='-';return}el('current').textContent=v[v.length-1];el('min').textContent=Math.min(...v);el('max').textContent=Math.max(...v);el('avg').textContent=(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2)}

async function loadGraph(){
    stopLive();
    const start=el('start_time').value.trim(),end=el('end_time').value.trim();
    if((start&&!end)||(!start&&end)){el('status').textContent='لطفاً هر دو تاریخ شروع و پایان را وارد کنید.';return}
    try{
        if(!start&&!end){
            const d=await requestTrend(jalaliMinutesAgo(10),jalaliNow());
            draw(d);liveMode=true;startLive();el('status').textContent='Trend زنده — بازه جاری ۱۰ دقیقه — بروزرسانی هر ۲ ثانیه';
        }else{
            const d=await requestTrend(start,end);draw(d);el('status').textContent='Trend تاریخی — فقط بازه انتخاب‌شده';
        }
    }catch(e){console.error(e);el('status').textContent='خطا در خواندن Trend: '+e.message}
}
async function refreshLive(){if(!liveMode||busy)return;busy=true;try{const d=await requestTrend(jalaliMinutesAgo(10),jalaliNow());drawLive(d)}catch(e){console.error('LIVE TREND',e)}finally{busy=false}}
function drawLive(d){
    const ds=(d.datasets||[]).find(x=>x.tag===el('tag').value)||(d.datasets||[])[0];
    const points=normalizePoints(ds);
    if(!chart){draw(d);return}
    chart.data.datasets[0].data=points;
    chart.data.datasets[0].stepped=ds?.stepped||'after';
    chart.update('none');
    updateStats(points);
    el('status').textContent='Trend زنده — '+points.length+' نقطه — بروزرسانی هر ۲ ثانیه';
}
function startLive(){stopLive(false);liveTimer=setInterval(refreshLive,REFRESH_MS)}
function stopLive(clear=true){if(liveTimer){clearInterval(liveTimer);liveTimer=null}busy=false;if(clear)liveMode=false}
function resetZoom(){if(chart)chart.resetZoom()}
function saveGraph(){if(!chart)return;const a=document.createElement('a');a.href=chart.toBase64Image();a.download=(el('tag').value||'trend')+'_trend.png';a.click()}
window.addEventListener('beforeunload',()=>stopLive());
loadTags();
</script>
</body>
</html>
