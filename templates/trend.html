<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Trend</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#1e293b;font-family:'Vazirmatn',sans-serif}.header{background:linear-gradient(135deg,#0f172a,#2563eb);padding:35px;text-align:center;color:#fff}.title{font-size:34px;font-weight:800}.subtitle{margin-top:10px;font-size:17px}.container{width:95%;max-width:1500px;margin:30px auto}.card{background:#fff;border-radius:18px;padding:25px;margin-bottom:25px;box-shadow:0 8px 25px rgba(0,0,0,.08)}.parameter-card{text-align:center;border-right:8px solid #2563eb}.parameter-label{font-size:18px;color:#64748b}.parameter-name{margin-top:10px;font-size:36px;font-weight:800;color:#2563eb}.filter-container{display:flex;gap:20px;justify-content:center;align-items:end;flex-wrap:wrap}.filter-item{background:#f8fafc;padding:20px;border-radius:15px}label{display:block;margin-bottom:10px;font-weight:bold}input,select{padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-family:'Vazirmatn';text-align:center;direction:ltr;min-width:220px}button{background:#2563eb;color:white;border:none;padding:14px 25px;border-radius:12px;font-size:16px;cursor:pointer;font-family:'Vazirmatn'}.status{margin-top:15px;text-align:center;color:#64748b;min-height:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.stat{background:#f8fafc;padding:20px;border-radius:15px;text-align:center}.stat-title{color:#64748b}.stat-value{font-size:28px;font-weight:800;color:#2563eb;margin-top:10px}.chart-card{height:600px}canvas{width:100%!important;height:100%!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.chart-card{height:450px}}
.datepicker-plot-area .timepicker{display:block!important;visibility:visible!important;opacity:1!important}.datepicker-plot-area .timepicker .timepicker-list{display:flex!important;visibility:visible!important}
</style>
</head>
<body>
{% include "nav.html" %}
<div class="header"><div class="title">سامانه مانیتورینگ صنعتی SCADA</div><div class="subtitle">نمایش و تحلیل روند پارامترها</div></div>
<div class="container">
<div class="card parameter-card"><div class="parameter-label">پارامتر انتخاب شده</div><div class="parameter-name" id="parameterName">-</div><div class="status" id="configStatus">در حال دریافت تنظیمات Flow...</div></div>
<div class="card"><h3>انتخاب بازه زمانی</h3><div class="filter-container"><div class="filter-item"><label>پارامتر</label><select id="tag"></select></div><div class="filter-item"><label>از تاریخ و ساعت</label><input id="start_time" type="text"></div><div class="filter-item"><label>تا تاریخ و ساعت</label><input id="end_time" type="text"></div><button onclick="loadGraph()">📈 نمایش نمودار</button><button onclick="resetZoom()">🔄 بازگشت زوم</button><button onclick="saveGraph()">💾 ذخیره نمودار</button></div></div>
<div class="card"><div class="stats"><div class="stat"><div class="stat-title">مقدار فعلی</div><div class="stat-value" id="current">-</div></div><div class="stat"><div class="stat-title">کمترین مقدار</div><div class="stat-value" id="min">-</div></div><div class="stat"><div class="stat-title">بیشترین مقدار</div><div class="stat-value" id="max">-</div></div><div class="stat"><div class="stat-title">میانگین</div><div class="stat-value" id="avg">-</div></div></div></div>
<div class="card chart-card"><canvas id="trendChart"></canvas></div>
</div>
<script>
let chart=null,trendConfig={},calendarMode='Gregorian',liveTimer=null,liveBusy=false,liveMode=false,selectedStartMs=null;
const LIVE_WINDOW_MINUTES=10;
const LIVE_REFRESH_MS=2000;
function normalizeTags(tags){if(!Array.isArray(tags))return [];return tags.filter(t=>t&&t.tag).map(t=>({tag:String(t.tag),title:t.title||t.tag,unit:t.unit||''}));}
function setStatus(text){document.getElementById('configStatus').textContent=text;}
async function loadFlow(){try{const response=await fetch('/trend_config?_='+Date.now(),{cache:'no-store',credentials:'same-origin'});if(!response.ok)throw new Error('trend_config HTTP '+response.status);trendConfig=await response.json();trendConfig.tags=normalizeTags(trendConfig.tags);calendarMode=(String(trendConfig.calendar||'').toLowerCase()==='jalali'||trendConfig.date_picker==='JalaliPicker')?'Jalali':'Gregorian';setupTags();setupPicker();clearDateInputs();setStatus('تقویم تعریف شده در Flow: '+(calendarMode==='Jalali'?'جلالی':'میلادی')+' — برای Trend زنده، تاریخ را خالی بگذارید');if(trendConfig.tags.length)await loadGraph();else{setStatus('هیچ پارامتر Trend در Flow تعریف نشده است.');clearStats();}}catch(e){console.error('TREND FLOW ERROR',e);setStatus('خطا در دریافت تنظیمات Trend از Flow');}}
function setupTags(){const select=document.getElementById('tag');select.innerHTML='';for(const item of trendConfig.tags||[]){const option=document.createElement('option');option.value=item.tag;option.textContent=item.title+(item.unit?' ('+item.unit+')':'');select.appendChild(option);}select.onchange=()=>{stopLiveRefresh();document.getElementById('parameterName').textContent=select.value||'-';};if(select.options.length)document.getElementById('parameterName').textContent=select.value;else document.getElementById('parameterName').textContent='-';}
function setupPicker(){const start=document.getElementById('start_time'),end=document.getElementById('end_time');if(calendarMode==='Jalali'){start.type='text';end.type='text';const o={format:'YYYY/MM/DD HH:mm',initialValue:false,autoClose:false,observer:true,timePicker:{enabled:true,step:1,hour:{enabled:true},minute:{enabled:true},second:{enabled:false},meridian:{enabled:false}},toolbox:{enabled:true,submitButton:{enabled:true},todayButton:{enabled:true},calendarSwitch:{enabled:false}}};$(start).persianDatepicker(o);$(end).persianDatepicker({...o});}else{start.type='datetime-local';end.type='datetime-local';}}
function clearDateInputs(){$('#start_time').val('');$('#end_time').val('');}
function pad(n){return String(n).padStart(2,'0')}function localDateTimeValue(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function parsePointX(value){if(typeof value==='number'&&Number.isFinite(value))return value;const n=Number(value);if(Number.isFinite(n))return n;const d=new Date(value);return Number.isNaN(d.getTime())?null:d.getTime();}
function formatAxisDate(value){const date=new Date(Number(value));if(Number.isNaN(date.getTime()))return String(value);if(calendarMode==='Jalali')return new persianDate(date).format('YYYY/MM/DD HH:mm:ss');return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+' '+pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds());}
function normalizePoints(ds){return (Array.isArray(ds&&ds.data)?ds.data:[]).map(p=>({x:parsePointX(p.x??p.Timestamp??p.timestamp),y:Number(p.y??p.Value??p.value)})).filter(p=>p.x!==null&&Number.isFinite(p.y)).sort((a,b)=>a.x-b.x);}
function toServerClock(value){if(!value)return null;try{let d;if(calendarMode==='Jalali'){d=new persianDate(value).toDate();}else{d=new Date(value);if(Number.isNaN(d.getTime()))return null;}return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes());}catch(e){console.error('TREND DATE CONVERSION ERROR',e);return null;}}
async function requestTrend(start,end){const tag=document.getElementById('tag').value;const serverStart=toServerClock(start),serverEnd=toServerClock(end);const payload={tag:tag,start:serverStart,end:serverEnd,calendar:'Gregorian'};console.log('TREND SERVER CLOCK REQUEST',payload);const response=await fetch('/trend_request?_='+Date.now(),{method:'POST',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify(payload),cache:'no-store',credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.error||('HTTP '+response.status));return data;}
async function loadGraph(){stopLiveRefresh();const tag=document.getElementById('tag').value;if(!tag){clearStats();return}document.getElementById('parameterName').textContent=tag;const start=document.getElementById('start_time').value.trim(),end=document.getElementById('end_time').value.trim();try{setStatus('در حال دریافت داده‌های Trend...');let requestStart=start,requestEnd=end;if(!start&&!end){const range=makeLocalRange();requestStart=range.start;requestEnd=range.end;}const data=await requestTrend(requestStart,requestEnd);drawChart(data);updateStats(data);selectedStartMs=parseSelectedStart(start);const endMs=parseSelectedEnd(end);const now=Date.now();const noDates=!start&&!end;const endIsCurrentOrFuture=endMs!==null&&endMs>=now-60000;liveMode=noDates||endIsCurrentOrFuture;if(liveMode){startLiveRefresh();setStatus('Trend زنده — بروزرسانی هر ۲ ثانیه');}else{setStatus('Trend تاریخی — بدون بروزرسانی زنده');}}catch(e){console.error('TREND REQUEST ERROR',e);clearStats();if(chart){chart.destroy();chart=null;}setStatus('خطا در دریافت Trend: '+e.message);}}
function parseSelectedStart(value){if(!value)return null;if(calendarMode==='Jalali'){try{return new persianDate(value).toDate().getTime()}catch(e){return null}}const d=new Date(value);return Number.isNaN(d.getTime())?null:d.getTime();}
function parseSelectedEnd(value){return parseSelectedStart(value);}
function makeLocalRange(){const end=new Date();const start=new Date(end.getTime()-LIVE_WINDOW_MINUTES*60000);if(calendarMode==='Jalali')return{start:new persianDate(start).format('YYYY/MM/DD HH:mm'),end:new persianDate(end).format('YYYY/MM/DD HH:mm')};return{start:localDateTimeValue(start),end:localDateTimeValue(end)};}
function mergeLiveData(data){if(!chart||!data||!Array.isArray(data.datasets)||!data.datasets.length)return;const fresh=normalizePoints(data.datasets[0]);const target=chart.data.datasets[0].data||[];const map=new Map();for(const p of target)map.set(p.x,p.y);for(const p of fresh)map.set(p.x,p.y);let merged=Array.from(map.entries()).map(([x,y])=>({x:Number(x),y:Number(y)})).sort((a,b)=>a.x-b.x);if(selectedStartMs!==null)merged=merged.filter(p=>p.x>=selectedStartMs);chart.data.datasets[0].data=merged;chart.update('none');updateStats({datasets:[{data:merged}]});}
async function refreshLive(){if(liveBusy||!liveMode)return;liveBusy=true;try{const range=makeLocalRange();const data=await requestTrend(range.start,range.end);mergeLiveData(data);const points=chart&&chart.data.datasets.length?chart.data.datasets[0].data:[];setStatus('Trend زنده — بروزرسانی هر ۲ ثانیه — آخرین بروزرسانی: '+new Date().toLocaleTimeString('fa-IR')+' — '+points.length.toLocaleString('fa-IR')+' نقطه');}catch(e){console.error('LIVE TREND ERROR',e);}finally{liveBusy=false;}}
function startLiveRefresh(){stopLiveRefresh();liveTimer=setInterval(refreshLive,LIVE_REFRESH_MS);}
function stopLiveRefresh(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}liveBusy=false;liveMode=false;}
function drawChart(data){const raw=Array.isArray(data&&data.datasets)?data.datasets:[];const datasets=raw.map(ds=>({label:ds.title||ds.tag||'Trend',data:normalizePoints(ds),borderWidth:2,pointRadius:0,tension:.05,fill:false}));const points=datasets.length?datasets[0].data:[];if(chart)chart.destroy();chart=new Chart(document.getElementById('trendChart'),{type:'line',data:{datasets},options:{responsive:true,maintainAspectRatio:false,parsing:false,animation:false,interaction:{mode:'nearest',intersect:false},scales:{x:{type:'linear',ticks:{callback:function(value){return formatAxisDate(value)}},title:{display:true,text:calendarMode==='Jalali'?'تاریخ و زمان جلالی':'Date / Time'}},y:{beginAtZero:false,title:{display:true,text:'Value'}}},plugins:{legend:{display:true},tooltip:{callbacks:{title:function(items){return items.length?formatAxisDate(items[0].parsed.x):''},label:function(item){return ' '+item.dataset.label+': '+item.parsed.y}}},zoom:{zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},pan:{enabled:true,mode:'x'}}}}});if(!points.length)clearStats();}
function updateStats(data){const ds=data&&data.datasets&&data.datasets.length?data.datasets[0]:null;const points=ds&&Array.isArray(ds.data)?ds.data:[];const values=points.map(p=>Number(p.y)).filter(v=>Number.isFinite(v));if(!values.length){clearStats();return}document.getElementById('current').textContent=values[values.length-1];document.getElementById('min').textContent=Math.min(...values);document.getElementById('max').textContent=Math.max(...values);document.getElementById('avg').textContent=(values.reduce((a,b)=>a+b,0)/values.length).toFixed(2);}
function clearStats(){['current','min','max','avg'].forEach(id=>document.getElementById(id).textContent='-');}function resetZoom(){if(chart)chart.resetZoom()}function saveGraph(){if(chart){const a=document.createElement('a');a.href=chart.toBase64Image();a.download='scada-trend.png';a.click()}}window.addEventListener('beforeunload',stopLiveRefresh);loadFlow();
</script>
</body>
</html>
