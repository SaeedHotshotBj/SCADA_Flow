<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCADA Trend</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1118;--panel:#111a24;--panel2:#16212d;--line:#263545;--text:#e7edf3;--muted:#8292a5;--accent:#19c3ff;--accent2:#00e887;--warn:#ffb020;--danger:#ff5364;--shadow:0 14px 35px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:radial-gradient(circle at 50% -10%,#1a2a3a 0,#0b1118 45%);color:var(--text);font-family:'Vazirmatn',sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);background-size:32px 32px}
.header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#172534,#101923);padding:24px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.header-title{display:flex;align-items:center;gap:16px}.status-light{width:13px;height:13px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2)}.title{font-size:27px;font-weight:800;letter-spacing:.2px}.subtitle{font-size:13px;color:var(--muted);margin-top:4px}.header-badge{border:1px solid #31506a;background:#10202d;color:#9cc7df;border-radius:8px;padding:8px 13px;font-size:12px}
.container{width:94%;max-width:1550px;margin:22px auto 40px}.card{background:linear-gradient(145deg,rgba(22,33,45,.98),rgba(14,23,32,.98));border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:18px}.card-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}.card-title{font-size:15px;font-weight:700}.card-title:before{content:"";display:inline-block;width:4px;height:17px;background:var(--accent);border-radius:2px;vertical-align:-4px;margin-left:9px;box-shadow:0 0 8px rgba(25,195,255,.45)}
.parameter-card{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-right:4px solid var(--accent)}.parameter-label{font-size:12px;color:var(--muted);margin-bottom:5px}.parameter-name{font-size:27px;font-weight:800;color:#fff}.config-status{font-size:12px;color:var(--muted);margin-top:7px}.parameter-right{text-align:left;direction:ltr}.live-badge{display:inline-flex;align-items:center;gap:7px;border:1px solid #285d4d;background:#10251f;color:#76e5b5;padding:7px 11px;border-radius:7px;font-size:11px}.live-badge i{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
.filter-body{padding:18px 20px}.filter-container{display:grid;grid-template-columns:1fr 1.2fr 1.2fr auto;gap:12px;align-items:end}.filter-item{min-width:0}.filter-item label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px;font-weight:500}.field{height:46px;width:100%;background:#0c141d;border:1px solid #304152;color:var(--text);border-radius:7px;padding:0 13px;font-family:'Vazirmatn';outline:none;transition:.2s;text-align:center;direction:ltr}.field:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(25,195,255,.1)}select.field{cursor:pointer}button{height:46px;border-radius:7px;padding:0 17px;border:1px solid #315168;background:#132a38;color:#cfeaf6;font-family:'Vazirmatn';font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap}button:hover{border-color:var(--accent);color:#fff;background:#163446;box-shadow:0 0 15px rgba(25,195,255,.1)}button.primary{background:#0c617d;border-color:#1685a8;color:#fff}button.primary:hover{background:#0d789b}.actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}.stat{padding:18px 22px;min-height:104px;border-left:1px solid var(--line);position:relative}.stat:last-child{border-left:0}.stat-title{font-size:11px;color:var(--muted);margin-bottom:8px}.stat-value{font-size:25px;font-weight:800;color:#f4f8fb;direction:ltr;text-align:right}.stat:after{content:"";position:absolute;bottom:0;right:0;left:0;height:2px;background:var(--accent);opacity:.5}.stat:nth-child(2):after{background:var(--danger)}.stat:nth-child(3):after{background:var(--warn)}
.chart-card{overflow:hidden}.chart-toolbar{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px}.chart-wrap{height:560px;padding:15px 18px 18px}canvas{width:100%!important;height:100%!important}
.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.datepicker-plot-area{font-family:'Vazirmatn'!important}.datepicker-plot-area .timepicker{display:block!important;visibility:visible!important;opacity:1!important}.datepicker-plot-area .timepicker .timepicker-list{display:flex!important;visibility:visible!important}
@media(max-width:1000px){.filter-container{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr}.stat{border-left:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}.parameter-card{align-items:flex-start;flex-direction:column}.parameter-right{width:100%;text-align:right}.chart-wrap{height:460px}}
@media(max-width:650px){.header{padding:18px 4%}.title{font-size:21px}.filter-container{grid-template-columns:1fr}.actions{flex-wrap:wrap}.chart-wrap{height:390px}}
</style>
</head>
<body>
{% include "nav.html" %}
<div class="header"><div class="header-title"><span class="status-light"></span><div><div class="title">سامانه مانیتورینگ صنعتی SCADA</div><div class="subtitle">تحلیل روند و پایش پارامترهای فرآیندی</div></div></div><div class="header-badge">TREND MONITOR</div></div>
<div class="container">
<div class="card parameter-card"><div><div class="parameter-label">پارامتر انتخاب شده</div><div class="parameter-name" id="parameterName">-</div><div class="config-status" id="configStatus">در حال دریافت تنظیمات Flow...</div></div><div class="parameter-right"><span class="live-badge"><i></i> ONLINE</span></div></div>
<div class="card"><div class="card-head"><div class="card-title">انتخاب بازه زمانی و پارامتر</div></div><div class="filter-body"><div class="filter-container"><div class="filter-item"><label>پارامتر</label><select class="field" id="tag"></select></div><div class="filter-item"><label id="startLabel">از تاریخ و ساعت</label><input class="field" id="start_time" type="text"></div><div class="filter-item"><label id="endLabel">تا تاریخ و ساعت</label><input class="field" id="end_time" type="text"></div><button class="primary" onclick="loadGraph()">📈 نمایش نمودار</button></div><div class="actions"><button onclick="resetZoom()">↔ بازنشانی زوم</button><button onclick="saveGraph()">💾 ذخیره نمودار</button></div></div></div>
<div class="card"><div class="stats"><div class="stat"><div class="stat-title">مقدار فعلی</div><div class="stat-value" id="current">-</div></div><div class="stat"><div class="stat-title">کمترین مقدار</div><div class="stat-value" id="min">-</div></div><div class="stat"><div class="stat-title">بیشترین مقدار</div><div class="stat-value" id="max">-</div></div></div></div>
<div class="card chart-card"><div class="chart-toolbar"><span>نمودار روند</span><span id="chartInfo">پنجره زمانی انتخاب شده</span></div><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div>
</div>
<script>
let chart=null,trendConfig={},calendarMode='Gregorian';
function normalizeTags(tags){if(!Array.isArray(tags))return [];return tags.filter(t=>t&&t.tag).map(t=>({tag:String(t.tag),title:t.title||t.tag,unit:t.unit||''}));}
async function loadFlow(){try{const response=await fetch('/trend_config',{cache:'no-store'});if(!response.ok)throw new Error('trend_config HTTP '+response.status);trendConfig=await response.json();trendConfig.tags=normalizeTags(trendConfig.tags);calendarMode=(String(trendConfig.calendar||'').toLowerCase()==='jalali'||trendConfig.date_picker==='JalaliPicker')?'Jalali':'Gregorian';setupTags();setupPicker();setDefaultDateRange();document.getElementById('configStatus').textContent='تقویم تعریف شده در Flow: '+(calendarMode==='Jalali'?'جلالی':'میلادی');if(trendConfig.tags.length)await loadGraph();else{document.getElementById('configStatus').textContent='هیچ پارامتر Trend در Flow تعریف نشده است.';clearStats();}}catch(e){document.getElementById('configStatus').textContent='خطا در دریافت تنظیمات Trend از Flow';}}
function setupTags(){const select=document.getElementById('tag');select.innerHTML='';for(const item of trendConfig.tags||[]){const option=document.createElement('option');option.value=item.tag;option.textContent=item.title+(item.unit?' ('+item.unit+')':'');select.appendChild(option);}select.onchange=()=>document.getElementById('parameterName').textContent=select.value||'-';if(select.options.length)document.getElementById('parameterName').textContent=select.value;else document.getElementById('parameterName').textContent='-';}
function setupPicker(){const start=document.getElementById('start_time'),end=document.getElementById('end_time');if(calendarMode==='Jalali'){start.type='text';end.type='text';const opts={format:'YYYY/MM/DD HH:mm',initialValue:false,autoClose:false,observer:true,timePicker:{enabled:true,step:1,hour:{enabled:true},minute:{enabled:true},second:{enabled:false},meridian:{enabled:false}},toolbox:{enabled:true,submitButton:{enabled:true},todayButton:{enabled:true},calendarSwitch:{enabled:false}}};$(start).persianDatepicker(opts);$(end).persianDatepicker({...opts});}else{start.type='datetime-local';end.type='datetime-local';}}
function pad(n){return String(n).padStart(2,'0')}function localDateTimeValue(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function setDefaultDateRange(){const end=new Date(),start=new Date();start.setDate(start.getDate()-10);if(calendarMode==='Jalali'){$('#start_time').val(new persianDate(start.getTime()).format('YYYY/MM/DD HH:mm'));$('#end_time').val(new persianDate(end.getTime()).format('YYYY/MM/DD HH:mm'));}else{document.getElementById('start_time').value=localDateTimeValue(start);document.getElementById('end_time').value=localDateTimeValue(end);}}
async function loadGraph(){const tag=document.getElementById('tag').value;if(!tag){clearStats();return}document.getElementById('parameterName').textContent=tag;const payload={tag:tag,start:document.getElementById('start_time').value,end:document.getElementById('end_time').value,calendar:calendarMode};try{const response=await fetch('/trend_request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||('HTTP '+response.status));drawChart(data);updateStats(data);document.getElementById('chartInfo').textContent=calendarMode==='Jalali'?'زمان جلالی':'زمان میلادی';}catch(e){clearStats();}}
function drawChart(data){const rawDatasets=data&&Array.isArray(data.datasets)?data.datasets:[];const datasets=rawDatasets.map(ds=>({...ds,data:(Array.isArray(ds.data)?ds.data:[]).map(p=>({x:p.label||String(p.x),y:Number(p.y)})).filter(p=>Number.isFinite(p.y))}));const points=datasets.length?datasets[0].data:[];if(chart)chart.destroy();chart=new Chart(document.getElementById('trendChart'),{type:'line',data:{datasets:datasets.map(ds=>({label:ds.title||ds.tag||'Trend',data:ds.data,borderWidth:2.5,pointRadius:0,pointHoverRadius:5,tension:.18,fill:false,borderColor:'#19c3ff',pointBackgroundColor:'#19c3ff}))},options:{responsive:true,maintainAspectRatio:false,parsing:false,interaction:{mode:'nearest',intersect:false},scales:{x:{type:'category',grid:{color:'rgba(130,146,165,.10)'},ticks:{color:'#8292a5',autoSkip:true,maxTicksLimit:12},title:{display:true,text:calendarMode==='Jalali'?'تاریخ و زمان جلالی':'Date / Time',color:'#8292a5'}},y:{beginAtZero:false,grid:{color:'rgba(130,146,165,.10)'},ticks:{color:'#8292a5'},title:{display:true,text:'Value',color:'#8292a5'}}},plugins:{legend:{display:true,labels:{color:'#cbd5e1',font:{family:'Vazirmatn'}}},tooltip:{callbacks:{title:function(items){return items.length?String(items[0].parsed.x):''},label:function(item){return ' '+item.dataset.label+': '+item.parsed.y}}},zoom:{zoom:{wheel:{enabled:true},pinch:{enabled:true},mode:'x'},pan:{enabled:true,mode:'x'}}}}});if(!points.length)clearStats();}
function updateStats(data){const ds=data&&data.datasets&&data.datasets.length?data.datasets[0]:null;const points=ds&&Array.isArray(ds.data)?ds.data:[];const values=points.map(p=>Number(p.y)).filter(v=>Number.isFinite(v));if(!values.length){clearStats();return}const min=Math.min(...values),max=Math.max(...values);document.getElementById('current').textContent=values[values.length-1];document.getElementById('min').textContent=min;document.getElementById('max').textContent=max;}
function clearStats(){['current','min','max'].forEach(id=>document.getElementById(id).textContent='-');}function resetZoom(){if(chart)chart.resetZoom()}function saveGraph(){if(chart){const a=document.createElement('a');a.href=chart.toBase64Image();a.download='scada-trend.png';a.click()}}loadFlow();
</script>
</body>
</html>
