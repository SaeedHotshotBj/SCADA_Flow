<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>SCADA FLOW Login</title>


<style>


body{

    font-family:Arial;

    background:#20232a;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}



.login-box{

    background:white;

    width:350px;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 20px #000;

}



h2{

    text-align:center;

}



input{

    width:100%;

    padding:10px;

    margin-top:10px;

    box-sizing:border-box;

}



button{

    width:100%;

    padding:10px;

    margin-top:20px;

    background:#007bff;

    color:white;

    border:none;

    cursor:pointer;

}



button:hover{

    background:#0056b3;

}



</style>


</head>



<body>



<div class="login-box">


<h2>
SCADA FLOW
</h2>



<form method="POST">


<input

type="text"

name="username"

placeholder="Username"

required>


<input

type="password"

name="password"

placeholder="Password"

required>



<button>

Login

</button>


</form>


</div>



</body>


</html>
